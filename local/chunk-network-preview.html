<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チャンクネットワーク プレビュー</title>
  <style>
    :root { color-scheme:dark; --paper:#05070b; --ink:#eafaff; --sub:#91a4b7; --rule:#223044; --green:#17e6d1; --red:#f06bff; --slate:#7188ff; --gold:#ffc247; --select:#2eeaff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background-color:var(--paper); background-image:linear-gradient(rgba(46,234,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(113,136,255,.025) 1px,transparent 1px); background-size:32px 32px; color:var(--ink); font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; }
    main { width:min(980px,calc(100% - 32px)); margin:0 auto; padding:38px 0 52px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0; color:#f1fdff; font-family:"Shippori Mincho","Yu Mincho","Noto Serif JP",serif; font-size:clamp(24px,4vw,34px); letter-spacing:0; text-shadow:0 0 18px rgba(46,234,255,.28); }
    .lead { margin:7px 0 0; color:var(--sub); font-size:13px; }
    .meta { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
    .pill { border:1px solid #29425a; padding:5px 9px; color:#b8cddd; font-size:11px; background:#0a1019; box-shadow:inset 0 0 10px rgba(46,234,255,.035); }
    .panel { border-top:1px solid #2a6a78; border-bottom:1px solid #392b65; background:#090d14; padding:15px 14px 14px; box-shadow:0 0 28px rgba(46,234,255,.06),0 0 44px rgba(240,107,255,.035); }
    .legend { display:flex; flex-wrap:wrap; align-items:center; gap:13px; margin:0 5px 10px; color:var(--sub); font-size:11px; }
    .legend-item { display:inline-flex; align-items:center; gap:6px; }
    .swatch { width:12px; height:12px; display:inline-block; border:1px solid rgba(234,250,255,.22); }
    .gradient { width:106px; height:10px; display:inline-block; background:linear-gradient(90deg,#a8b4d8,#7188ff,#000080); border:1px solid rgba(46,234,255,.42); box-shadow:0 0 8px rgba(113,136,255,.28); }
    .relation-key { width:12px; height:3px; display:inline-block; }
    .relation-key.content { background:#17e6d1; box-shadow:0 0 6px #17e6d1; }
    .relation-key.topic { background:#7188ff; box-shadow:0 0 6px #7188ff; }
    .relation-key.target { background:#ffc247; box-shadow:0 0 6px #ffc247; }
    .relation-key.category { background:#f06bff; box-shadow:0 0 6px #f06bff; }
    .workspace { display:block; }
    svg { width:100%; height:auto; display:block; background:#03060b; border:1px solid #17273a; }
    .details { border-top:1px solid #22384c; padding:12px 5px 4px; min-height:120px; background:#080c13; }
    .details h2 { margin:0 0 12px; font-size:13px; font-weight:700; }
    .details p { margin:0 0 10px; color:var(--sub); font-size:12px; line-height:1.75; white-space:pre-wrap; }
    .details dl { display:grid; grid-template-columns:68px 1fr; gap:5px 8px; margin:0; font-size:11px; }
    .details dt { color:var(--sub); }
    .details dd { margin:0; }
    .relations { margin-top:14px; border-top:1px solid var(--rule); padding-top:11px; }
    .relations h3 { margin:0 0 8px; font-size:12px; }
    .relation-list { display:grid; gap:6px; margin:0; padding:0; list-style:none; }
    .relation-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:start; border-left:2px solid var(--slate); padding:5px 7px; background:#0c131d; font-size:11px; }
    .relation-row.content { border-left-color:var(--green); }
    .relation-row.island { border-left-color:var(--select); }
    .relation-row.target { border-left-color:var(--gold); }
    .relation-row.category { border-left-color:var(--red); }
    .relation-row.fact { border-left-color:var(--sub); }
    .relation-text { overflow-wrap:anywhere; line-height:1.45; }
    .relation-reason { color:var(--sub); text-align:right; white-space:nowrap; }
    .chunk-node { outline:none; }
    .chunk-node { cursor:pointer; transition:opacity .32s ease; }
    .node-visual { transform:scale(.82); transform-origin:0 0; transition:transform .52s cubic-bezier(.16,1,.3,1); }
    .chunk-node:hover .node-visual, .chunk-node:focus-visible .node-visual { transform:scale(1.02); }
    .chunk-node.selected .node-visual,
    .chunk-node.selected:hover .node-visual,
    .chunk-node.selected:focus-visible .node-visual { transform:scale(1.16); }
    .dense-network .chunk-node:hover .node-visual, .dense-network .chunk-node:focus-visible .node-visual { transform:scale(1.45); }
    .dense-network .chunk-node.selected .node-visual,
    .dense-network .chunk-node.selected:hover .node-visual,
    .dense-network .chunk-node.selected:focus-visible .node-visual { transform:scale(3.2); }
    .chunk-node circle { fill-opacity:.42; transition:fill-opacity .3s ease,stroke .3s ease,stroke-width .3s ease; }
    .chunk-node.selected circle { fill-opacity:1; stroke:var(--select); stroke-opacity:1; stroke-width:.9; }
    .chunk-node text { pointer-events:none; }
    #topic-links { pointer-events:none; }
    #topic-links path { fill:none; stroke-linecap:round; filter:url(#topic-glow); }
    #island-fields, #island-links { pointer-events:none; }
    #island-fields ellipse { mix-blend-mode:screen; }
    #island-links path, #island-links line { fill:none; stroke-linecap:round; filter:url(#relation-glow); }
    #island-links line.parameter-backbone { filter:none; }
    #links { pointer-events:none; }
    #links line { stroke-linecap:round; filter:url(#relation-glow); }
    #network.dense-relations #links line { filter:none; }
    #root { cursor:pointer; filter:url(#root-glow); }
    #annotation { pointer-events:none; }
    #annotation line { stroke:#2eeaff; stroke-width:1.3; stroke-opacity:.84; filter:url(#relation-glow); }
    #annotation rect { fill:#090f19; fill-opacity:.97; stroke:#2eeaff; stroke-width:1; }
    #annotation .annotation-topic { fill:#2eeaff; font-size:9px; font-weight:700; }
    #annotation .annotation-text { fill:#eafaff; font-size:10px; font-weight:700; }
    .caption { margin:10px 5px 0; color:var(--sub); font-size:11px; line-height:1.7; }
    @media (max-width:760px) {
      main { width:min(100% - 18px,980px); padding-top:24px; }
      header { display:block; }
      .meta { justify-content:flex-start; margin-top:12px; }
      .details { padding-top:13px; }
    }
    @media (prefers-reduced-motion:reduce) { .node-visual, .chunk-node circle { transition:none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>チャンクネットワーク</h1>
        <p class="lead">自由記述から抽出した意見を、1件ずつのノードとして表示する別方式。線は本文の共通語を主軸に結ぶ。</p>
      </div>
      <div class="meta" aria-label="表示条件">
        <span class="pill" id="node-count">ノード 全件</span>
        <span class="pill" id="link-count">リンク --</span>
        <span class="pill" id="layout-label">パラメータ放射</span>
      </div>
    </header>
    <section class="panel" aria-label="チャンクネットワークのプレビュー">
      <div class="legend" aria-label="凡例">
        <span class="legend-item"><span class="gradient"></span><span id="parameter-legend">パラメータ（全体色・中心距離）</span></span>
        <span class="legend-item"><span class="relation-key content"></span>本文の共通語（主）</span>
        <span class="legend-item"><span class="relation-key topic"></span>トピック</span>
        <span class="legend-item"><span class="relation-key target"></span>対象</span>
        <span class="legend-item"><span class="relation-key category"></span>分類</span>
        <span class="legend-item">感情値はリンク条件に使わず詳細表示</span>
      </div>
      <div class="workspace">
        <svg id="network" viewBox="0 0 760 760" role="img" aria-label="自由記述チャンクのネットワーク図">
          <defs>
            <filter id="topic-glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
            <filter id="relation-glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.7" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
            <filter id="island-field-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="10"></feGaussianBlur>
            </filter>
            <filter id="root-glow" x="-50%" y="-60%" width="200%" height="220%">
              <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>
          <g id="field">
            <g id="island-fields"></g>
            <g id="island-links"></g>
            <g id="topic-links"></g>
            <g id="links"></g>
            <g id="nodes"></g>
            <g id="annotation" visibility="hidden"></g>
          </g>
          <g id="root">
            <rect x="342" y="358" width="76" height="44" rx="8" fill="#000080" stroke="#2eeaff" stroke-width="2"></rect>
            <text x="380" y="380" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#fff" font-family="Shippori Mincho, Yu Mincho, Noto Serif JP, serif">政治</text>
          </g>
        </svg>
        <aside class="details" id="details" aria-live="polite">
          <h2>チャンクの詳細</h2>
          <p>ノードを選択すると、抽出された意見本文と接続理由を表示します。</p>
        </aside>
      </div>
      <p class="caption">独立プレビュー。リンクは「本文の共通語」を主条件とし、トピック・対象・分類の一致を補助条件にする。既存の意見ネットワークや <code>tree-preview.html</code> には接続していません。</p>
    </section>
  </main>
  <script>
    (() => {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const W = 760, H = 760, cx = W / 2, cy = H / 2;
      const seedChunks = [
        ["スタートアップ支援をもっと進めてほしい。", "雇用", "提言", .25, 66, "政府全般", ""],
        ["減税で手取りを増やすべきだ。", "税制", "要望", -.35, 62, "財務省", "財務省"],
        ["年金だけでは生活が苦しい。", "年金", "不満", -.78, 88, "厚生労働省", "厚生労働省"],
        ["将来の支給水準を明示してほしい。", "年金", "要望", -.42, 76, "厚生労働省", "厚生労働省"],
        ["保育無償化を全国一律にしてほしい。", "子育て", "要望", .18, 74, "政府全般", ""],
        ["待機児童対策が遅すぎる。", "子育て", "不満", -.62, 81, "地方自治体", "自治体"],
        ["政治資金の透明化を優先してほしい。", "政治改革", "提言", -.12, 69, "政府全般", ""],
        ["与党は説明責任を果たすべきだ。", "政治改革", "要望", -.5, 72, "政党", "与党"],
        ["防衛費の増額はやむを得ない。", "防衛", "評価", .3, 58, "政府全般", ""],
        ["財源と使途の説明が不足している。", "防衛", "不満", -.55, 84, "政府全般", ""],
        ["同盟の強化を支持する。", "外交", "評価", .62, 54, "政府全般", ""],
        ["憲法の議論も前に進めてほしい。", "外交", "提言", .1, 63, "政党", "国会"],
        ["再エネへの移行を加速してほしい。", "エネルギー", "提言", .42, 77, "環境省", "環境省"],
        ["削減目標は野心が足りない。", "エネルギー", "不満", -.3, 71, "環境省", "環境省"],
        ["物価高で生活が限界だ。", "物価", "不満", -.86, 92, "政府全般", ""],
        ["消費税を下げて家計を守ってほしい。", "税制", "要望", -.58, 83, "財務省", "財務省"],
        ["教員の長時間労働を改善してほしい。", "教育", "要望", -.2, 73, "文部科学省", "文部科学省"],
        ["部活動改革を進めるべきだ。", "教育", "提言", .12, 61, "文部科学省", "文部科学省"],
        ["地域医療の担い手を確保してほしい。", "医療", "要望", -.25, 79, "地方自治体", "自治体"],
        ["介護職の処遇を改善してほしい。", "介護", "要望", -.48, 86, "厚生労働省", "厚生労働省"],
        ["行政手続きをもっと簡単にしてほしい。", "行政DX", "提言", .22, 57, "政府全般", ""],
        ["自治体のデジタル化を急いでほしい。", "行政DX", "提言", .3, 64, "地方自治体", "自治体"],
        ["農業の収入を安定させてほしい。", "農業", "要望", -.15, 68, "農林水産省", "農林水産省"],
        ["食料自給率を高めるべきだ。", "農業", "提言", .28, 60, "農林水産省", "農林水産省"]
      ].map((row, i) => ({ id: "sample-" + i, text: row[0], topic: row[1], cat: row[2], emo: row[3], crit: row[4], valid: 56 + (i * 17) % 39, motiv: 44 + (i * 13) % 52, tt: row[5], tn: row[6], target: row[5] + "|" + row[6] }));
      const searchParams = new URLSearchParams(location.search);
      const requestedCount = Number(searchParams.get("count"));
      const maxPreviewNodes = 50000;
      const maxVisibleRelatedLinks = 30;
      const requestedLayout = searchParams.get("layout");
      const layoutMode = requestedLayout === "clustered" || requestedLayout === "radial" ? requestedLayout : "parameter";
      document.getElementById("parameter-legend").textContent = layoutMode === "clustered"
        ? "パラメータ（全体色・島内縦軸）"
        : "パラメータ（全体色・中心距離）";
      document.getElementById("layout-label").textContent = layoutMode === "clustered"
        ? "群配置"
        : layoutMode === "radial" ? "意味島" : "パラメータ放射";
      const repeat = requestedCount > 0 ? Math.max(1, Math.ceil(Math.min(maxPreviewNodes, requestedCount) / seedChunks.length)) : 4;
      const expanded = seedChunks.flatMap((seedChunk, seedIndex) => Array.from({ length: repeat }, (_, copy) => {
        if (!copy) return { ...seedChunk };
        const id = seedChunk.id + "-v" + copy;
        const variation = seed(id + "|parameters");
        const adjust = Math.round((variation - 0.5) * 18);
        return {
          ...seedChunk,
          id: id,
          text: seedChunk.text + " [" + (copy + 1) + "]",
          crit: Math.max(0, Math.min(100, seedChunk.crit + adjust)),
          valid: Math.max(0, Math.min(100, seedChunk.valid - adjust)),
          motiv: Math.max(0, Math.min(100, seedChunk.motiv + Math.round(adjust / 2)))
        };
      }));
      const raw = requestedCount > 0 ? expanded.slice(0, Math.min(maxPreviewNodes, requestedCount)) : expanded;
      const denseMode = raw.length > 500;
      const network = document.getElementById("network"), field = document.getElementById("field"), root = document.getElementById("root");
      network.classList.toggle("dense-network", denseMode);
      const islandFieldsLayer = document.getElementById("island-fields"), islandLinksLayer = document.getElementById("island-links"), topicLinksLayer = document.getElementById("topic-links"), linksLayer = document.getElementById("links"), nodesLayer = document.getElementById("nodes"), annotationLayer = document.getElementById("annotation"), details = document.getElementById("details");
      const nodeCount = document.getElementById("node-count"), linkCount = document.getElementById("link-count");
      const initialDetailsHtml = details.innerHTML;
      function seed(value) { let h = 2166136261; for (const ch of String(value)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; }
      function textNormalize(value) { return String(value || "").normalize("NFKC").toLocaleLowerCase("ja-JP"); }
      function semanticText(value) { return textNormalize(value).replace(/\s*\[\d+\]\s*$/, "").trim(); }
      const wordSegmenter = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("ja", { granularity:"word" }) : null;
      function contentTerms(value) {
        const terms = new Set(), addRun = run => { if (!run || run.length < 2) return; terms.add(run); if (run.length <= 8) for (let i = 0; i + 1 < run.length; i++) terms.add(run.slice(i, i + 2)); };
        const text = semanticText(value);
        if (wordSegmenter) {
          for (const part of wordSegmenter.segment(text)) {
            const term = String(part.segment || "").trim();
            if (part.isWordLike && term.length >= 2) terms.add(term);
          }
        }
        for (const run of text.match(/[一-龯々〆ヵヶ]+/g) || []) addRun(run);
        for (const run of text.match(/[ァ-ヶー]{2,}/g) || []) addRun(run);
        for (const run of text.match(/[a-z0-9]{2,}/gi) || []) terms.add(run);
        return [...terms];
      }
      function linkColor(kind) { return ({ content: "#17e6d1", island:"#42d9ff", topic: "#7188ff", target: "#ffc247", category: "#f06bff", fact: "#8ea1b8" })[kind] || "#7188ff"; }
      const termDocumentFrequency = new Map();
      for (const n of raw) {
        n.semanticText = semanticText(n.text);
        n.contentTerms = contentTerms(n.text);
        n.termSet = new Set(n.contentTerms);
        n.targetKey = String(n.target || "").replace(/^\|+|\|+$/g, "").trim();
        for (const term of n.termSet) termDocumentFrequency.set(term, (termDocumentFrequency.get(term) || 0) + 1);
        const values = [[n.crit, .5], [n.motiv, .3], [n.valid, .2]];
        let total = 0, weights = 0;
        for (const pair of values) { total += Math.max(0, Math.min(100, pair[0])) / 100 * pair[1]; weights += pair[1]; }
        n.weight = weights ? total / weights : 0;
      }
      const indexById = new Map(raw.map((node, index) => [node.id, index]));
      const nodeById = new Map(raw.map(node => [node.id, node]));
      function addToIndex(index, key, id) {
        if (!key) return;
        if (!index.has(key)) index.set(key, new Set());
        index.get(key).add(id);
      }
      const termIndex = new Map(), topicIndex = new Map(), targetIndex = new Map(), categoryIndex = new Map();
      for (const node of raw) {
        for (const term of node.termSet) addToIndex(termIndex, term, node.id);
        addToIndex(topicIndex, node.topic || "その他", node.id);
        addToIndex(targetIndex, node.targetKey, node.id);
        addToIndex(categoryIndex, node.cat, node.id);
      }
      let minWeight = 1, maxWeight = 0;
      for (const n of raw) { minWeight = Math.min(minWeight, n.weight); maxWeight = Math.max(maxWeight, n.weight); }
      const weightSpan = maxWeight - minWeight;
      for (const n of raw) n.weightView = weightSpan > 1e-9 ? (n.weight - minWeight) / weightSpan : .5;
      const weightLevels = [...new Set(raw.map(node => node.weightView.toFixed(12)))]
        .map(Number)
        .sort((a, b) => b - a);
      const weightLevelCenters = weightLevels.map(weight => 56 + Math.pow(1 - weight, 1.25) * (350 - 56));
      const radiusRangeByWeight = new Map(weightLevels.map((weight, index) => {
        const center = weightLevelCenters[index];
        const inner = index ? (weightLevelCenters[index - 1] + center) / 2 : 44;
        const outer = index < weightLevelCenters.length - 1 ? (center + weightLevelCenters[index + 1]) / 2 : 352;
        const inset = Math.min(3, Math.max(0, (outer - inner) * .08));
        return [weight.toFixed(12), { inner:inner + inset, outer:outer - inset }];
      }));
      const minimumIslandSize = denseMode ? Math.max(12, Math.ceil(raw.length * .0015)) : 2;
      const islands = [];
      function addIsland(type, label, ids, baseScore) {
        if (!label || !ids || ids.size < minimumIslandSize) return;
        const specificity = Math.log((raw.length + 1) / (ids.size + 1)) / Math.log(raw.length + 1);
        islands.push({ id:type + ":" + label, type, label, sourceIds:ids, baseScore, score:Math.min(1, baseScore + specificity * .32), memberIds:[], primaryMemberIds:[] });
      }
      for (const [label, ids] of topicIndex) addIsland("topic", label, ids, .48);
      [...targetIndex.entries()].sort((a, b) => b[1].size - a[1].size).slice(0, 12).forEach(([label, ids]) => addIsland("target", label.replace(/\|/g, " / "), ids, .58));
      [...categoryIndex.entries()].sort((a, b) => b[1].size - a[1].size).slice(0, 8).forEach(([label, ids]) => addIsland("category", label, ids, .34));
      [...termIndex.entries()]
        .filter(([term, ids]) => term.length >= 2 && !/^\d+$/.test(term) && ids.size >= minimumIslandSize && ids.size <= raw.length * .35)
        .sort((a, b) => {
          const aidf = Math.log((raw.length + 1) / (a[1].size + 1));
          const bidf = Math.log((raw.length + 1) / (b[1].size + 1));
          return bidf - aidf || b[0].length - a[0].length || a[0].localeCompare(b[0], "ja");
        })
        .slice(0, 24)
        .forEach(([label, ids]) => addIsland("term", label, ids, .66));
      const islandTypeOrder = { topic:0, target:1, category:2, term:3 };
      islands.sort((a, b) => islandTypeOrder[a.type] - islandTypeOrder[b.type] || b.sourceIds.size - a.sourceIds.size || a.label.localeCompare(b.label, "ja"));
      const islandById = new Map(islands.map(island => [island.id, island]));
      for (const node of raw) {
        const memberships = islands
          .filter(island => island.sourceIds.has(node.id))
          .map(island => ({ islandId:island.id, type:island.type, label:island.label, score:island.score }))
          .sort((a, b) => b.score - a.score || a.islandId.localeCompare(b.islandId));
        const selectedMemberships = memberships.slice(0, 3);

        return "<h2>チャンクの詳細</h2><p>" + escapeHtml(n.text) + "</p><dl><dt>トピック</dt><dd>" + escapeHtml(n.topic) + "</dd>" + membershipRow + "<dt>分類</dt><dd>" + escapeHtml(n.cat) + "</dd><dt>対象</dt><dd>" + escapeHtml(n.tn || n.tt || "なし") + "</dd><dt>切実度</dt><dd>" + n.crit + " / 100</dd><dt>意欲</dt><dd>" + n.motiv + " / 100</dd><dt>妥当性</dt><dd>" + n.valid + " / 100</dd><dt>感情値</dt><dd>" + Math.round((n.emo + 1) * 50) + " / 100</dd><dt>表示関係</dt><dd>" + allRelated.length + "件</dd></dl>" + relationBlock;
      }
      function renderAnnotation(node) {
        const point = positions[indexById.get(node.id)];
        const boxWidth = 174, boxHeight = 54, gap = 18;
        const placeRight = point.x < cx;
        const boxX = Math.max(8, Math.min(W - boxWidth - 8, placeRight ? point.x + gap : point.x - gap - boxWidth));
        const boxY = Math.max(8, Math.min(H - boxHeight - 8, point.y - boxHeight / 2));
        const anchorX = placeRight ? boxX : boxX + boxWidth;
        const anchorY = Math.max(boxY + 8, Math.min(boxY + boxHeight - 8, point.y));
        const connector = el("line", { x1:point.x, y1:point.y, x2:anchorX, y2:anchorY });
        const box = el("rect", { x:boxX, y:boxY, width:boxWidth, height:boxHeight, rx:5 });
        const topic = el("text", { x:boxX + 10, y:boxY + 14, class:"annotation-topic" });
        const islandLabel = layoutMode === "parameter"
          ? node.topic || "その他"
          : node.islandMemberships.slice(0, 2).map(membership => membership.label).join(" / ") || node.topic || "その他";
        topic.textContent = islandLabel.length > 24 ? islandLabel.slice(0, 24) + "..." : islandLabel;
        const text = el("text", { x:boxX + 10, y:boxY + 31, class:"annotation-text" });
        labelLines(node.text).forEach((line, index) => {
          const span = el("tspan", { x:boxX + 10, dy:index ? 12 : 0 });
          span.textContent = line;
          text.appendChild(span);
        });
        annotationLayer.replaceChildren(connector, box, topic, text);
        annotationLayer.setAttribute("visibility", "visible");
      }
      const nodesFragment = document.createDocumentFragment();
      const nodeRefs = raw.map((n, i) => {
        const group = el("g", { class: "chunk-node", tabindex: 0, "data-node-id": n.id, "data-weight-view":n.weightView.toFixed(12), "data-island-id":n.visualIslandId, transform: "translate(" + positions[i].x.toFixed(2) + " " + positions[i].y.toFixed(2) + ")" });
        const visual = el("g", { class: "node-visual" });
        const densityScale = denseMode ? .2 : 1;
        const radius = (7 + Math.sqrt(n.crit / 100) * 10 + (layoutMode === "parameter" ? 0 : n.degree / maxDegree * 5)) * densityScale;
        const circle = el("circle", { r: radius, fill: weightColor(n.weightView), stroke: "#8095ff", "stroke-opacity":.72, "stroke-width": denseMode ? .5 : 1.6 });
        visual.appendChild(circle);
        if (!denseMode) {
          const text = el("text", { y: radius + 12, "text-anchor": "middle", "font-size": 10, "font-weight": 700, fill: "#eafaff", "font-family": "Zen Kaku Gothic New, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" });
          labelLines(n.text).forEach((line, k) => { const t = el("tspan", { x: 0, dy: k ? 12 : 0 }); t.textContent = line; text.appendChild(t); });
          visual.appendChild(text);
        }
        const title = el("title", {});
        title.textContent = layoutMode === "parameter"
          ? n.text + " / " + n.topic
          : n.text + " / " + n.topic + " / 所属島 " + n.degree;
        group.append(title, visual);
        nodesFragment.appendChild(group);
        return { group, node: n };
      });
      nodesLayer.appendChild(nodesFragment);
      const nodeRefById = new Map(nodeRefs.map(ref => [ref.node.id, ref]));
      let selectedId = "", selectedRef = null;
      function nodeGroupFromEvent(event) {
        const target = event.target instanceof Element ? event.target.closest(".chunk-node") : null;
        return target && nodesLayer.contains(target) ? target : null;
      }
      function selectNode(id) {
        const node = nodeById.get(id), ref = nodeRefById.get(id);
        if (!node || !ref) return;
        if (selectedId === id) {
          clearSelection();
          return;
        }
        if (selectedRef) selectedRef.group.classList.remove("selected");
        selectedRef = ref;
        selectedId = id;
        ref.group.classList.add("selected");
        nodesLayer.appendChild(ref.group);
        renderSelectedLinks(node);
        renderAnnotation(node);
        details.innerHTML = detailsHtml(node, selectedLinks);
      }
      function clearSelection() {
        if (selectedRef) selectedRef.group.classList.remove("selected");
        selectedRef = null;
        selectedId = "";
        annotationLayer.setAttribute("visibility", "hidden");
        annotationLayer.replaceChildren();
        linksLayer.replaceChildren();
        selectedLinks = [];
        network.classList.remove("dense-relations");
        linkCount.textContent = layoutMode === "parameter" ? "関係 " + persistentRelationCount + "本" : "島 " + visibleIslands.length + "群";
        details.innerHTML = initialDetailsHtml;
      }
      nodesLayer.addEventListener("click", event => {
        const group = nodeGroupFromEvent(event);
        if (!group) return;
        event.stopPropagation();
        selectNode(group.getAttribute("data-node-id"));
      });
      nodesLayer.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const group = nodeGroupFromEvent(event);
        if (!group) return;
        event.preventDefault();
        event.stopPropagation();
        selectNode(group.getAttribute("data-node-id"));
      });
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let networkExpanded = false;
      function expandNetwork() {
        if (networkExpanded) return;
        networkExpanded = true;
        const duration = reduce ? 0 : 4000;
        const started = performance.now();
        function frame(now) {
          const progress = duration ? Math.min(1, (now - started) / duration) : 1;
          const eased = 1 - Math.pow(1 - progress, 3);
          const scale = .08 + .92 * eased;
          field.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + scale + ") translate(" + -cx + " " + -cy + ")");
          const inset = 220 * (1 - eased);
          network.setAttribute("viewBox", inset + " " + inset + " " + (760 - inset * 2) + " " + (760 - inset * 2));
          if (progress < 1) requestAnimationFrame(frame);
          else field.removeAttribute("transform");
        }
        requestAnimationFrame(frame);
      }
      root.setAttribute("role", "button");
      root.setAttribute("tabindex", "0");
      root.addEventListener("click", expandNetwork);
      root.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          expandNetwork();
        }
      });
      network.setAttribute("viewBox", "220 220 320 320");
      field.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(.08) translate(" + -cx + " " + -cy + ")");
    })();
  </script>
</body>
</html>
