<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>意見ネットワーク 量子もつれ観測</title>
  <style>
    :root {
      color-scheme:light;
      --paper:#ffffff;
      --ink:#14213d;
      --sub:#53647d;
      --rule:#d5deea;
      --cyan:#007b9b;
      --violet:#3657d6;
      --gold:#9a6200;
      --panel:rgba(255,255,255,.9);
      --control:rgba(255,255,255,.78);
      --panel-shadow:0 8px 28px rgba(43,62,94,.1);
      --trace:#163c69;
      --node-near:#7a38ff;
      --node-far:#00d9ff;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --paper:#110f20;
      --ink:#f4f1ff;
      --sub:#b5aecb;
      --rule:#3b315f;
      --cyan:#50f581;
      --violet:#9a6cff;
      --gold:#f5f050;
      --panel:rgba(17,15,32,.88);
      --control:rgba(17,15,32,.8);
      --panel-shadow:0 12px 34px rgba(7,4,18,.38);
      --trace:#c8b8ff;
      --node-near:#f58250;
      --node-far:#50f581;
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--paper); color:var(--ink); }
    body {
      font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
      background-image:none;
    }
    button { font:inherit; letter-spacing:0; }
    #scene { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; }
    header { position:fixed; z-index:6; top:20px; left:24px; pointer-events:none; }
    h1 {
      margin:0;
      color:var(--ink);
      font-family:"Shippori Mincho","Yu Mincho","Noto Serif JP",serif;
      font-size:25px;
      letter-spacing:0;
      text-shadow:0 1px 12px rgba(44,84,145,.12);
    }
    .legend { display:flex; flex-wrap:wrap; gap:11px; margin-top:8px; color:var(--sub); font-size:11px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; box-shadow:0 0 8px currentColor; }
    .dot.opinion { color:var(--cyan); background:currentColor; }
    .dot.near { color:var(--node-near); background:currentColor; outline:1px solid #7188ff; }
    .dot.far { color:var(--node-far); background:currentColor; }
    .ring { width:10px; height:10px; border:1px solid var(--cyan); border-radius:50%; box-shadow:0 0 8px var(--cyan); }
    .controls {
      position:fixed;
      z-index:7;
      top:92px;
      left:24px;
      display:flex;
      align-items:center;
      gap:4px;
      padding:4px;
      border:1px solid rgba(72,99,140,.2);
      border-radius:6px;
      background:var(--control);
      backdrop-filter:blur(8px);
    }
    .controls button {
      min-width:48px;
      height:30px;
      padding:0 9px;
      border:1px solid transparent;
      border-radius:4px;
      background:transparent;
      color:var(--sub);
      cursor:pointer;
    }
    .controls button:hover,
    .controls button:focus-visible { color:var(--ink); border-color:rgba(0,123,155,.35); outline:none; }
    .controls button[aria-pressed="true"] { color:#142d74; background:rgba(54,87,214,.1); border-color:rgba(54,87,214,.3); }
    .controls .observe { min-width:32px; width:32px; padding:0; color:var(--cyan); font-size:19px; }
    .controls .divider { width:1px; height:18px; margin:0 3px; background:rgba(46,234,255,.2); }
    .status {
      position:fixed;
      z-index:6;
      top:22px;
      right:24px;
      color:var(--sub);
      font:11px/1.6 "IBM Plex Mono",Consolas,monospace;
      text-align:right;
      white-space:pre-line;
      pointer-events:none;
    }
    .details {
      position:fixed;
      z-index:8;
      right:20px;
      bottom:20px;
      width:min(260px,calc(100% - 40px));
      min-height:82px;
      max-height:min(180px,calc(100vh - 190px));
      overflow:auto;
      padding:8px 10px;
      border:1px solid var(--rule);
      border-radius:6px;
      background:var(--panel);
      box-shadow:var(--panel-shadow);
      backdrop-filter:blur(10px);
    }
    .details h2 { margin:0 0 4px; color:var(--ink); font-size:10px; line-height:1.35; }
    .details p { margin:0; color:var(--sub); font-size:8.5px; line-height:1.45; }
    .details .generated { color:var(--ink); font-size:9px; line-height:1.45; }
    .details .result { margin-top:5px; color:var(--cyan); font:8px/1.38 "IBM Plex Mono",Consolas,monospace; }
    .details dl { display:grid; grid-template-columns:56px 1fr; gap:2px 6px; margin:6px 0 0; font-size:8.5px; line-height:1.4; }
    .details dt { color:var(--sub); }
    .details dd { margin:0; overflow-wrap:anywhere; }
    .trace {
      position:fixed;
      z-index:7;
      left:20px;
      bottom:20px;
      width:min(280px,calc(100% - 300px));
      max-width:280px;
      height:min(34vh,280px);
      max-height:calc(100vh - 210px);
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      padding:2px 0;
      border:0;
      background:transparent;
      box-shadow:none;
      color:var(--trace);
      font:7px/1.3 "IBM Plex Mono",Consolas,monospace;
      text-shadow:none;
    }
    .trace header { position:static; display:flex; justify-content:flex-start; margin:0 0 3px; color:var(--cyan); font-size:7px; line-height:1.15; }
    .trace header span:last-child { display:none; }
    .trace pre { margin:0; max-width:100%; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
    .trace::-webkit-scrollbar { display:none; }
    .loading {
      position:fixed;
      z-index:9;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      color:var(--cyan);
      font:12px/1.5 "IBM Plex Mono",Consolas,monospace;
      text-shadow:0 1px 10px rgba(0,123,155,.2);
      pointer-events:none;
    }
    .loading[hidden] { display:none; }
    @media (max-width:700px) {
      html, body { font-size:16px; -webkit-text-size-adjust:100%; }
      #scene, #scene canvas { touch-action:none; }
      header { top:6px; left:8px; right:8px; }
      h1 { font-size:13px; line-height:1.15; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .legend { max-width:calc(100vw - 16px); gap:3px 6px; margin-top:2px; font-size:7.2px; line-height:1.1; }
      .legend .dot { width:6px; height:6px; }
      .legend .ring { width:8px; height:8px; }
      .controls {
        top:48px; left:4px; right:4px; width:calc(100% - 8px); max-width:none;
        display:flex; flex-wrap:nowrap; gap:1px; padding:2px;
        overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
        scrollbar-width:none; border-radius:6px;
      }
      .controls::-webkit-scrollbar { display:none; }
      .controls button {
        flex:0 0 auto; min-width:38px; height:28px; padding:0 5px;
        font-size:9px; line-height:1; white-space:nowrap; border-radius:5px;
      }
      .controls .observe { flex-basis:30px; min-width:30px; width:30px; font-size:16px; }
      .controls .divider { flex:0 0 1px; height:14px; margin:0 1px; }
      .status { display:none; }
      .trace {
        display:block; left:2px; right:auto; bottom:60px;
        width:min(42vw,160px); height:min(15vh,96px); max-height:min(15vh,96px);
        overflow-y:auto; overflow-x:hidden; padding:0 1px; border:0; border-radius:0;
        background:transparent; box-shadow:none; backdrop-filter:none;
        font-size:5.5px; line-height:1.12; opacity:.72; pointer-events:none;
        scrollbar-width:none;
        -webkit-overflow-scrolling:touch;
      }
      .trace header { margin:0 0 1px; font-size:5.5px; line-height:1; }
      .trace header span:last-child { display:none; }
      .trace pre { max-height:none; overflow:visible; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
      .details {
        left:auto; right:4px; bottom:4px; width:min(58vw,220px);
        min-height:0; max-height:50px; padding:3px 5px; overflow:hidden;
        border-radius:6px; pointer-events:none;
      }
      .details h2 { margin:0 0 1px; font-size:7px; line-height:1.05; }
      .details p, .details .generated { font-size:5.8px; line-height:1.08; }
      .details .result { margin-top:1px; font-size:5.4px; line-height:1.05; }
      .details dl { display:none; }
      .loading { max-width:calc(100vw - 24px); text-align:center; font-size:8.5px; }
    }
  </style>
  <script type="importmap">

  </script>
</head>
<body>
  <div id="scene" aria-label="政治を中心とする量子もつれ意見ネットワーク"></div>
  <header>
    <h1>意見ネットワーク 量子もつれ観測</h1>
    <div class="legend" aria-label="表示凡例">
      <span><i class="dot opinion"></i>意見ノード</span>
      <span><i class="ring"></i>量子もつれノード</span>
    </div>
  </header>
  <nav class="controls" aria-label="観測軸">
    <button type="button" data-model="correlated" aria-pressed="true" title="共有乱数による古典相関">相関</button>
    <button type="button" data-model="amplitude" aria-pressed="false" title="二量子ビットの複素振幅とBorn則">量子式</button>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" data-basis="overall" aria-pressed="true">総合</button>
    <button type="button" data-basis="urgency" aria-pressed="false">切実度</button>
    <button type="button" data-basis="motivation" aria-pressed="false">意欲</button>
    <button type="button" data-basis="validity" aria-pressed="false">妥当性</button>
    <button type="button" class="observe" id="observe" aria-label="全体を再観測" title="全体を再観測">↻</button>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" data-theme-choice="light" aria-pressed="true" title="白背景">白</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" title="黒背景">黒</button>
  </nav>
  <div class="status" id="status"></div>
  <section class="trace" aria-label="観測計算コンソール">
    <header><span>OBSERVATION TRACE</span><span id="trace-state">READY</span></header>
    <pre id="trace-output"></pre>
  </section>
  <aside class="details" id="details" aria-live="polite">
    <h2>政治</h2>
    <p>5,000件の観測投影</p>
  </aside>
  <div class="loading" id="loading" role="status">観測投影を構築中</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { LineMaterial } from "three/addons/lines/LineMaterial.js";
    import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
    import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import {
      createEntanglementModel,
      deduplicateNodes,
      generatePrototypeCandidates,
      observeAmplitudeEntanglement,
      observeEntanglement
    } from "./quantum-entanglement-engine.mjs";

    const host = document.getElementById("scene");
    const details = document.getElementById("details");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const traceOutput = document.getElementById("trace-output");
    const traceState = document.getElementById("trace-state");
    const traceEntries = [];
    const traceQueue = [];
    let traceSequence = 0;
    let traceTyping = false;
    const traceTypeDelay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 4;
    const observeButton = document.getElementById("observe");
    const modelButtons = [...document.querySelectorAll("[data-model]")];
    const basisButtons = [...document.querySelectorAll("[data-basis]")];
    const themeButtons = [...document.querySelectorAll("[data-theme-choice]")];
    const searchParams = new URLSearchParams(location.search);
    let colorTheme = searchParams.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = colorTheme;
    const requested = Number(searchParams.get("count"));
    const count = Math.max(240, Math.min(5000, Number.isFinite(requested) && requested > 0 ? requested : 5000));
    const duplicateCount = Math.max(1, Math.round(count * 0.08));
    const observationSeed = searchParams.get("seed") || "prototype-5000";
    const basisLabels = { overall:"総合", urgency:"切実度", motivation:"意欲", validity:"妥当性" };
    const basisWeights = {
      overall:[0.5, 0.3, 0.2],
      urgency:[1, 0, 0],
      motivation:[0, 1, 0],
      validity:[0, 0, 1]
    };
    let basis = basisLabels[searchParams.get("basis")] ? searchParams.get("basis") : "overall";
    let observationMode = searchParams.get("mode") === "amplitude" ? "amplitude" : "correlated";
    let epoch = 0;

    const categoryDefinitions = [
      { id:"livelihood", label:"暮らし・社会", topics:["生活費","住宅","社会保障","年金"] },
      { id:"work", label:"仕事・産業", topics:["雇用","働き方","農業","観光"] },
      { id:"people", label:"教育・福祉", topics:["子育て","教育","医療","介護"] },
      { id:"infrastructure", label:"地域・基盤", topics:["交通","防災","地域","人口減少"] },
      { id:"environment", label:"環境・資源", topics:["環境","エネルギー","食料","文化"] },
      { id:"governance", label:"統治・国際", topics:["行政DX","税制","外交","安全保障"] }
    ];
    const topics = categoryDefinitions.flatMap(category => category.topics.map((label, index) => ({
      id:`${category.id}-${index}`,
      label,
      categoryId:category.id,
      categoryLabel:category.label
    })));
    const topicById = new Map(topics.map(topic => [topic.id, topic]));

    function hash32(value) {
      let hash = 2166136261;
      for (const character of String(value)) hash = Math.imul(hash ^ character.charCodeAt(0), 16777619);
      return hash >>> 0;
    }
    function random01(value) {
      let state = hash32(value) || 0x9e3779b9;
      state ^= state << 13;
      state ^= state >>> 17;
      state ^= state << 5;
      return (state >>> 0) / 4294967296;
    }
    function directionFor(value) {
      const longitude = random01(`${value}|longitude`) * Math.PI * 2;
      const vertical = random01(`${value}|latitude`) * 2 - 1;
      const radial = Math.sqrt(Math.max(0, 1 - vertical * vertical));
      return new THREE.Vector3(radial * Math.cos(longitude), vertical, radial * Math.sin(longitude));
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
      })[character]);
    }
    const themePalette = {
      light:{ background:"#ffffff", fog:"#ffffff", opinion:"#18b8d6", root:"#2446ff", topic:"#f2a900", entanglement:"#00bddd", relation:"#3489b5", active:"#007fd4", glow:"#19ccec", outer:"#78e8f7" },
      // Divergences theme palette, adapted from the MIT-licensed Obsidian theme by Mekann2904.
      dark:{ background:"#110f20", fog:"#110f20", opinion:"#5de7ff", root:"#8a5cf5", topic:"#f5f050", entanglement:"#50f581", relation:"#8a5cf5", active:"#f5f050", glow:"#50f581", outer:"#f58250" }
    };
    const bloomByTheme = {
      // The dark theme follows the reference renderer's galaxy bloom settings.
      dark:{ strength:.75, radius:.5, threshold:.28 },
      // A white background needs selective HDR bloom or the canvas itself glows.
      light:{ strength:.5, radius:.28, threshold:1.03 }
    };
    const initialPalette = themePalette[colorTheme];
    function labelSprite(text, color, scale = 1) {
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      canvas.width = 512;
      canvas.height = 96;
      context.font = "700 34px sans-serif";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.shadowColor = color;
      context.shadowBlur = 14;
      context.fillStyle = color;
      context.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:texture, transparent:true, depthWrite:false }));
      sprite.scale.set(6.2 * scale, 1.16 * scale, 1);
      return sprite;
    }
    function makeLineSegments(color, opacity) {
      const material = new THREE.LineBasicMaterial({
        color,
        transparent:true,
        opacity,
        depthWrite:false,
        fog:false,
        blending:THREE.NormalBlending
      });
      const lines = new THREE.LineSegments(new THREE.BufferGeometry(), material);
      lines.renderOrder = 0;
      return lines;
    }
    function makeSoftHaloTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const context = canvas.getContext("2d");
      const gradient = context.createRadialGradient(32, 32, 3, 32, 32, 31);
      gradient.addColorStop(0, "rgba(255,255,255,.78)");
      gradient.addColorStop(.24, "rgba(255,255,255,.42)");
      gradient.addColorStop(.62, "rgba(255,255,255,.12)");
      gradient.addColorStop(1, "rgba(255,255,255,0)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, 64, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const rawCandidates = generatePrototypeCandidates(topics, { uniqueCount:count, duplicateCount });
    const uniqueNodes = deduplicateNodes(rawCandidates);
    const model = createEntanglementModel(uniqueNodes);
    const sourceById = model.nodeById;
    const nodeIndexById = new Map(model.nodes.map((node, index) => [node.id, index]));
    function calculateProjection(options) {
      return observationMode === "amplitude"
        ? observeAmplitudeEntanglement(model, options)
        : observeEntanglement(model, options);
    }
    let projection = calculateProjection({ basis, seed:observationSeed, epoch });
    let projectionById = new Map(projection.nodes.map(node => [node.id, node]));
    let groupById = new Map(projection.groups.map(group => [group.id, group]));
    const nodeCountScale = Math.cbrt(Math.max(1, model.nodes.length) / 5000);
    const groupCountScale = Math.sqrt(Math.max(1, model.groups.length) / 24);
    const displayScale = clamp(Math.max(.72, nodeCountScale, groupCountScale), .72, 3);
    const displayRadiusBounds = Object.freeze({ min:14 * displayScale, max:72 * displayScale });
    const groupDisplayRadiusBounds = Object.freeze({ min:11 * displayScale, max:58 * displayScale });
    const maxPersistentRelations = 1400;
    const maxSelectedRelations = 48;
    function displayPosition(source, id, phase, bounds) {
      const direction = new THREE.Vector3(source.x, source.y, source.z);
      if (direction.lengthSq() < 1e-8) direction.copy(directionFor(`display|${id}`));
      else direction.normalize();
      const ratio = random01(`display-radius|${id}|${Number(phase || 0).toFixed(8)}`);
      return direction.multiplyScalar(bounds.min + ratio * (bounds.max - bounds.min));
    }
    function nodeDisplayPosition(node) {
      return displayPosition(node.position, node.id, node.phase, displayRadiusBounds);
    }
    function groupDisplayPosition(group) {
      const phase = group.quantumState?.phase ?? group.nearProbability ?? group.groupBit;
      return displayPosition(group.position, group.id, phase, groupDisplayRadiusBounds);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(initialPalette.background);
    scene.fog = new THREE.FogExp2(initialPalette.fog, .009 / displayScale);
    const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, .1, 600);
    camera.position.set(0, 13 * displayScale, Math.max(92, displayRadiusBounds.max * 1.36));
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:"high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    host.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const initialBloom = bloomByTheme[colorTheme];
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      initialBloom.strength,
      initialBloom.radius,
      initialBloom.threshold
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .065;
    controls.minDistance = 13;
    controls.maxDistance = Math.max(170, displayRadiusBounds.max * 2.5);

    scene.add(new THREE.HemisphereLight("#ffffff", "#dce4f0", 2.1));
    const keyLight = new THREE.DirectionalLight("#ffffff", 2.2);
    keyLight.position.set(11, 16, 13);
    scene.add(keyLight);

    const root = new THREE.Mesh(
      new THREE.SphereGeometry(1.28, 30, 22),
      new THREE.MeshStandardMaterial({
        color:initialPalette.root,
        emissive:"#2eeaff",
        emissiveIntensity:.52,
        roughness:.28,
        metalness:.12,
        depthTest:false
      })
    );
    root.userData = { type:"root" };
    root.renderOrder = 8;
    scene.add(root);
    const rootLabel = labelSprite("政治", "#2eeaff", 1.05);
    rootLabel.position.set(0, 1.95, 0);
    rootLabel.material.depthTest = false;
    rootLabel.renderOrder = 9;
    scene.add(rootLabel);

    const topicPositions = topics.map(topic => directionFor(`topic|${topic.id}`).multiplyScalar(displayRadiusBounds.max * .82));
    const topicGeometry = new THREE.SphereGeometry(.34, 12, 8);
    const topicMaterial = new THREE.MeshBasicMaterial({
      color:initialPalette.topic,
      transparent:true,
      opacity:colorTheme === "dark" ? .64 : .68,
      depthWrite:false,
      blending:colorTheme === "dark" ? THREE.AdditiveBlending : THREE.NormalBlending
    });
    const topicInstances = new THREE.InstancedMesh(topicGeometry, topicMaterial, topics.length);
    topicInstances.userData = { type:"topics" };
    const matrixHelper = new THREE.Object3D();
    topicPositions.forEach((position, index) => {
      matrixHelper.position.copy(position);

    function setPointer(event) {
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.x = (event.clientX - bounds.left) / bounds.width * 2 - 1;
      pointer.y = -(event.clientY - bounds.top) / bounds.height * 2 + 1;

    }
    function hitFromPointer() {
      raycaster.setFromCamera(pointer, camera);

      if (!hit) return null;
      if (hit.object === opinionInstances && Number.isInteger(hit.instanceId)) {
        return { type:"opinion", index:hit.instanceId, id:model.nodes[hit.instanceId].id };
      }
      if (hit.object === entanglementInstances && Number.isInteger(hit.instanceId)) {
        return { type:"entanglement", index:hit.instanceId, id:projection.groups[hit.instanceId].id };
      }
      if (hit.object === topicInstances && Number.isInteger(hit.instanceId)) {
        return { type:"topic", index:hit.instanceId, id:topics[hit.instanceId].id };
      }

      }
      if (item.type === "entanglement") {
        return projection.relations.filter(relation => relation.groupId === item.id);
      }
      const memberIds = new Set(projection.nodes
        .filter(node => node.observedTopicId === item.id)

      return projection.relations.filter(relation => memberIds.has(relation.leftId) && memberIds.has(relation.rightId));

    function weightedNodeScore(node) {
      const weights = basisWeights[basis];
      return (node.urgency / 100) * weights[0]
        + (node.motivation / 100) * weights[1]

    function formatTrace(item, action, sequence) {
      const mode = observationMode === "amplitude" ? "amplitude/Born" : "correlated/classic";
      const heading = [
        `[${String(sequence).padStart(2, "0")}] ${action}`,
        `$ observe --mode ${mode} --basis ${basis} --epoch ${epoch}`,
        `seed = ${observationSeed}`
      ];
      if (item?.type === "opinion") {
        const source = sourceById.get(item.id);
        const observed = projectionById.get(item.id);
        const weights = basisWeights[basis];
        const nodeScore = weightedNodeScore(source);
        const group = model.groups.find(candidate => candidate.id === observed.groupId);
        const groupScore = group.memberIds.reduce(
          (sum, id) => sum + weightedNodeScore(sourceById.get(id)),
          0
        ) / Math.max(1, group.memberIds.length);
        const branchDelta = observed.bit ? 0.09 : -0.09;
        const residual = observed.observedWeight - nodeScore * 0.68 - groupScore * 0.22 - branchDelta;
        return [
          ...heading,
          `node = ${source.id}`,
          `input = { urgency:${source.urgency}, motivation:${source.motivation}, validity:${source.validity} }`,
          `score = (${source.urgency}/100)*${weights[0]} + (${source.motivation}/100)*${weights[1]} + (${source.validity}/100)*${weights[2]}`,
          `      = ${nodeScore.toFixed(6)}`,
          `weight = score*0.68 + group*0.22 + branch + jitter`,
          `       = ${nodeScore.toFixed(6)}*0.68 + ${groupScore.toFixed(6)}*0.22 ${branchDelta >= 0 ? "+" : "-"} ${Math.abs(branchDelta).toFixed(2)} ${residual >= 0 ? "+" : "-"} ${Math.abs(residual).toFixed(6)}`,
          `       = ${observed.observedWeight.toFixed(6)}`,
          `analysis_distance = ${observed.distance.toFixed(6)}  # layout unused`,
          `display_radius = ${targetPositions[item.index].length().toFixed(6)}  # deterministic spread`,
          `topic = ${observed.observedTopicId} / coupling = ${observed.coupling.toFixed(6)}`
        ].join("\n");
      }
      if (item?.type === "entanglement") {
        const group = groupById.get(item.id);
        const quantum = group.quantumState;
        return quantum ? [
          ...heading,
          `group = ${group.id} / members = ${group.memberIds.length}`,
          `|psi> = cos(theta)|00> + exp(i*phi)sin(theta)|11>`,
          `P(outcome) = |amplitude|^2 = ${quantum.selectedProbability.toFixed(6)}`,
          `outcome = ${quantum.outcome}`,
          `concurrence = ${quantum.concurrence.toFixed(6)}`,
          `entropy = ${quantum.entanglementEntropy.toFixed(6)} bit`
        ].join("\n") : [
          ...heading,
          `group = ${group.id} / members = ${group.memberIds.length}`,
          `near_probability = ${group.nearProbability.toFixed(6)}`,
          `observed_bit = ${group.groupBit}`
        ].join("\n");
      }
      return [
        ...heading,
        `basis score = U*${basisWeights[basis][0]} + M*${basisWeights[basis][1]} + V*${basisWeights[basis][2]}`,
        `observed_weight = node_score*0.68 + group_score*0.22 + branch + jitter`,
        `analysis_distance = f(observed_weight)  # layout unused`,
        `display_radius = hash(node, phase) -> [${displayRadiusBounds.min}, ${displayRadiusBounds.max}]`,
        `nodes = ${projection.nodes.length} / groups = ${projection.groups.length} / relations = ${projection.relations.length}`,
        `$ select <node>  # show substituted values`
      ].join("\n");
    }
    function renderTraceHistory(activeEntry = "") {
      const completed = activeEntry ? traceEntries.slice(-23) : traceEntries.slice(-24);
      traceOutput.textContent = [...completed, activeEntry].filter(Boolean).join("\n\n");
      requestAnimationFrame(() => {
        const container = traceOutput.parentElement;
        container.scrollTop = container.scrollHeight;
      });
    }
    async function processTraceQueue() {
      if (traceTyping) return;
      traceTyping = true;
      while (traceQueue.length) {
        const entry = traceQueue.shift();
        if (traceTypeDelay > 0) {
          let activeEntry = "";
          for (const character of entry) {
            activeEntry += character;
            renderTraceHistory(activeEntry);
            await new Promise(resolve => setTimeout(resolve, traceTypeDelay));
          }
        }
        traceEntries.push(entry);
        if (traceEntries.length > 24) traceEntries.shift();
        renderTraceHistory();
      }
      traceTyping = false;
    }
    function appendTrace(item, action) {
      traceState.textContent = `EPOCH ${epoch}`;
      traceSequence += 1;
      traceQueue.push(formatTrace(item, action, traceSequence));
      void processTraceQueue();
    }
    function updateStatus() {
      const merged = rawCandidates.length - model.nodes.length;
      status.innerHTML =
        `入力  ${rawCandidates.length.toLocaleString("ja-JP")}件\n` +
        `重複統合  ${merged.toLocaleString("ja-JP")}件\n` +
        `固有ノード  ${model.nodes.length.toLocaleString("ja-JP")}件\n` +
        `もつれノード  ${projection.groups.length}件\n` +
        `観測関係  ${projection.relations.length.toLocaleString("ja-JP")}本\n` +
        `常時描画  ${relationEndpointIndices.length.toLocaleString("ja-JP")}本\n` +
        `表示半径  ${displayRadiusBounds.min.toFixed(0)}–${displayRadiusBounds.max.toFixed(0)}\n` +
        `計算方式  ${observationMode === "amplitude" ? "複素振幅・Born則" : "古典相関"}\n` +
        `<span class="optional">観測シード  ${escapeHtml(observationSeed)}:${epoch}</span>`;
    }
    function refreshSelection() {
      if (selected?.type === "opinion") selected.index = nodeIndexById.get(selected.id);
      if (selected?.type === "entanglement") selected.index = projection.groups.findIndex(group => group.id === selected.id);
      updateActiveLines();
      renderDetails(selected);
    }
    function summarizeObservation(previousProjection, nextProjection, groupId) {
      const previousById = new Map(previousProjection.nodes.map(node => [node.id, node]));
      const targetIds = groupId
        ? new Set(model.groups.find(group => group.id === groupId).memberIds)
        : null;
      let nodeCount = 0;
      let topicChanges = 0;
      let distanceDelta = 0;
      for (const node of nextProjection.nodes) {
        if (targetIds && !targetIds.has(node.id)) continue;
        const previous = previousById.get(node.id);
        if (!previous) continue;
        nodeCount += 1;
        if (previous.observedTopicId !== node.observedTopicId) topicChanges += 1;
        distanceDelta += Math.abs(previous.distance - node.distance);
      }
      return {
        groupId,
        nodeCount,
        topicChanges,
        meanDistanceDelta: distanceDelta / Math.max(1, nodeCount)
      };
    }
    function mergeGroupProjection(nextProjection, groupId) {
      const nextNodeById = new Map(nextProjection.nodes.map(node => [node.id, node]));
      const groupMemberIds = new Set(model.groups.find(group => group.id === groupId).memberIds);
      const nodes = projection.nodes.map(node => groupMemberIds.has(node.id) ? nextNodeById.get(node.id) : node);
      const relations = [
        ...projection.relations.filter(relation => relation.groupId !== groupId),
        ...nextProjection.relations.filter(relation => relation.groupId === groupId)
      ];
      const nextGroup = nextProjection.groups.find(group => group.id === groupId);
      const groups = projection.groups.map(group => group.id === groupId ? nextGroup : group);
      return { ...nextProjection, nodes, relations, groups };
    }
    function applyObservation(nextProjection, groupId = null) {
      lastObservationSummary = summarizeObservation(projection, nextProjection, groupId);
      projection = groupId ? mergeGroupProjection(nextProjection, groupId) : nextProjection;
      projectionById = new Map(projection.nodes.map(node => [node.id, node]));
      groupById = new Map(projection.groups.map(group => [group.id, group]));
      startPositions = renderPositions.map(position => position.clone());
      targetPositions = projection.nodes.map(nodeDisplayPosition);
      groupStartPositions = groupRenderPositions.map(position => position.clone());
      groupTargetPositions = projection.groups.map(groupDisplayPosition);
      updateOpinionColors();
      rebuildRelationGeometry();
      transitionStartedAt = performance.now();
      transitioning = transitionDuration > 0;
      if (!transitioning) {
        updateOpinionInstances();
        updateEntanglementInstances();
        updateRelationPositions();
      }
      refreshSelection();
      updateStatus();
      const observedItem = groupId
        ? { type:"entanglement", id:groupId, index:projection.groups.findIndex(group => group.id === groupId) }
        : { type:"root" };
      appendTrace(observedItem, groupId ? "OBSERVE GROUP" : "OBSERVE ALL");
      window.__ENTANGLEMENT_PROTOTYPE__.observationCount += 1;
    }
    function observeAll(nextBasis = basis, resample = true, force = false) {
      if (!force && !resample && nextBasis === basis) return;
      basis = nextBasis;
      if (resample) epoch += 1;
      applyObservation(calculateProjection({
        basis,
        seed:observationSeed,
        epoch
      }));
      basisButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.basis === basis)));
    }
    function observeGroup(groupId) {
      epoch += 1;
      const next = calculateProjection({ basis, seed:observationSeed, epoch });
      applyObservation(next, groupId);
    }

    function changeObservationMode(nextMode) {
      const normalizedMode = nextMode === "amplitude" ? "amplitude" : "correlated";
      if (normalizedMode === observationMode) return;
      observationMode = normalizedMode;
      observeAll(basis, false, true);
      modelButtons.forEach(button => button.setAttribute(
        "aria-pressed",
        String(button.dataset.model === observationMode)
      ));
    }

    renderer.domElement.addEventListener("pointermove", setPointer);
    renderer.domElement.addEventListener("pointerleave", () => {
      pointer.set(2, 2);
      pointerDirty = true;
    });
    renderer.domElement.addEventListener("click", () => {
      if (!hovered) return;
      selected = { ...hovered };
      if (selected.type === "root") observeAll();
      else if (selected.type === "entanglement") observeGroup(selected.id);
      else {
        refreshSelection();
        if (selected.type === "opinion") appendTrace(selected, "SELECT NODE");
      }
      triggerRelationGlow();
    });
    basisButtons.forEach(button => button.addEventListener("click", () => observeAll(button.dataset.basis, false)));
    modelButtons.forEach(button => button.addEventListener("click", () => changeObservationMode(button.dataset.model)));
    themeButtons.forEach(button => button.addEventListener("click", () => applyColorTheme(button.dataset.themeChoice)));
    observeButton.addEventListener("click", () => observeAll());
    basisButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.basis === basis)));
    modelButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.model === observationMode)));
    themeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.themeChoice === colorTheme)));

    let relationFrame = 0;
    function animate(now = performance.now()) {
      requestAnimationFrame(animate);
      root.rotation.y = now * .00018;
      if (transitioning) {
        const rawProgress = clamp((now - transitionStartedAt) / transitionDuration, 0, 1);
        const progress = 1 - Math.pow(1 - rawProgress, 3);
        updateOpinionInstances(progress);
        updateEntanglementInstances(progress);
        relationFrame += 1;
        if (relationFrame % 2 === 0 || rawProgress >= 1) {
          updateRelationPositions();
          if (selected?.type !== "root") updateActiveLines();
        }
        if (rawProgress >= 1) transitioning = false;
      }
      if (pointerDirty) {
        hovered = hitFromPointer();
        pointerDirty = false;
      }
      const active = hovered || selected;
      renderer.domElement.style.cursor = hovered ? "pointer" : "grab";
      highlight.visible = Boolean(active);
      if (active) {
        highlight.position.copy(selectionPosition(active));
        const scale = active.type === "root" ? 1.5 : active.type === "opinion" ? .38 : active.type === "entanglement" ? .62 : .48;
        highlight.scale.setScalar(scale);
      }
      const glowProgress = clamp((now - glowPulseStartedAt) / glowPulseDuration, 0, 1);
      const glowStrength = Math.pow(1 - glowProgress, 1.7);
      const showRelationGlow = activeGlowAvailable && glowStrength > .001;
      activeGlowLines.visible = showRelationGlow;
      activeGlowOuterLines.visible = showRelationGlow;
      activeGlowMaterial.opacity = .42 * glowStrength;
      activeGlowOuterMaterial.opacity = .075 * glowStrength;
      controls.update();
      composer.render();
    }
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      activeGlowMaterial.resolution.set(innerWidth, innerHeight);
      activeGlowOuterMaterial.resolution.set(innerWidth, innerHeight);
      relationGlowMaterial.resolution.set(innerWidth, innerHeight);
    });

    window.__ENTANGLEMENT_PROTOTYPE__ = {
      ready:true,
      rawCount:rawCandidates.length,
      uniqueCount:model.nodes.length,
      duplicateCount:rawCandidates.length - model.nodes.length,
      groupCount:model.groups.length,
      get basis() { return basis; },
      get epoch() { return epoch; },
      get relationCount() { return projection.relations.length; },
      observationCount:0,
      observe:observeAll
    };
    updateStatus();
    renderDetails(selected);
    appendTrace(selected, "INITIAL OBSERVATION");
    loading.hidden = true;
    animate();
  </script>
</body>
</html>
