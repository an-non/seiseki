name: Import verified local LLM payload

on:
  push:
    branches:
      - feat/local-llm-stage0-1
    paths:
      - "local-llm-import/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiseki-local-llm-import
  cancel-in-progress: false

jobs:
  import-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-llm-stage0-1
          fetch-depth: 0

      - name: Locate and unpack uploaded payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find local-llm-import -maxdepth 1 -type f -name '*.zip' -print | sort)
          test "${#archives[@]}" -eq 1
          rm -rf /tmp/seiseki-local-llm
          mkdir -p /tmp/seiseki-local-llm
          unzip -q "${archives[0]}" -d /tmp/seiseki-local-llm
          test -d /tmp/seiseki-local-llm/localllm-files
          echo "LLM_SRC=/tmp/seiseki-local-llm/localllm-files" >> "$GITHUB_ENV"

      - name: Verify received payload fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cd "$LLM_SRC"
          cat > /tmp/llm-sha256.txt <<'EOF'
          1169794c1993645ba4c2d76452112d078345858ad9bc2e7a179f02799606f09b  .github/workflows/deploy-staging.yml
          24006c61c8d208496a3034fac42e62ca4ce2c3184e238c881774e895424468a0  core/logic.js
          07cdf644fdf429aaf17807cab41936c8edba6e6536941b491ee9760a6a6435c0  core/seiseki-local-bridge.js
          b326f647eabbd5f8504351fe36cba152c1b4a55160b78c4bfd0922f7190c031e  core/ui.jsx
          2d322b553b31e2421f8d9716154bced2a19d989893efe741cb23993aed5ffed4  local/.env.staging.example
          810c3f15ddc67626a1ae1a5172b97459351c2cb613c0d13c26b0c049034b655a  local/index.html
          b579ec57fe4b8ba7d00fe2f0944d87173d4e63a28aa8c5df3ec4843e4e1b62f5  local/public/model/_headers
          752d9af7db940899193eb531b3ef7ac80f19220025e800d09c489904afb7e16c  local/public/model/bootstrap.js
          22eb42642af914ae0ca429605ffd352a83dc195084bfc9ceff5903ab1420256f  local/public/model/chunks.js
          d287b77d03d3d18f2bb0db0d26e92ee60c18b51e511ddd5ae278669ddd0c5a6b  local/public/model/encoder-int8-v40k.bin
          bfe964a6b6285de9cc621337cd136787421ef16b5989198041d296369ef7a662  local/public/model/encoder-wasm.js
          0ac85fd954bdf4bcf6c58998ac02e7a93e560303c2a7217e16c7cc7baf75e141  local/public/model/encoder.js
          201c093e3deb8778f92c635025a8ee67bb7d721c87e7c69c735c846fc204f26d  local/public/model/head-krr-full.bin
          9e6bd95f6653e4ea79fcb808ec637f3b078b3f08bee41194e7799fe984eee29f  local/public/model/head-krr.js
          c9de32f0fd046cee0674c283603621f30fbcb5f4cb75b6be07369f21df1a2aae  local/public/model/kernel.wasm
          10c56c8f9a5454b787972b89552d7c31924aa3cc36fb451086497d9735a8f467  local/public/model/local-client.js
          98169ffb764827a3e731f00f664df4ea3283ef1e362b24a996c9c7ac6ece8d4c  local/public/model/local.js
          d5422160101e8acb828e2f036a5b1151b896932cb9dfe77e3c80dde2921dfded  local/public/model/manifest.json
          cac3b9465f94d1c7635143ee5ea042ea03c6a70a4ae1496fe0df6315327d7f85  local/public/model/model-store.js
          923cfd31045846fedb3ec67ec728fe54484dca2ac58d396138c5745846fe9410  local/public/model/store-fallback.js
          2cd362a6e30c0aa6b336314d6eec66df9bb51cfebb03f5d6d1879d9849de912a  local/public/model/tok-data-v40k.json
          9f0237e79fb50f5dcc352438c60c5f9da8013cc75d7ecc139ac11dfe4de25d18  local/public/model/tokenizer.js
          f194b32b83cfcdf5c289fc96db7da231f361433ae4dc7c95563a0851b0567cd0  local/public/model/worker.js
          4efd0704f498e37543b6dbcf864ea9e4d46f085bc328aa84893f7b471c0cf815  scripts/build-app.mjs
          b661e365304ef9666dbbe9b26c56bd3632cf1904d91ea747617b3b5ff0c15162  tests/local-bridge.test.js
          EOF
          sha256sum -c /tmp/llm-sha256.txt

      - name: Overlay local LLM integration onto quantum source
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$LLM_SRC/.github/workflows/deploy-staging.yml" .github/workflows/deploy-staging.yml
          cp -a "$LLM_SRC/core/logic.js" core/logic.js
          cp -a "$LLM_SRC/core/ui.jsx" core/ui.jsx
          cp -a "$LLM_SRC/core/seiseki-local-bridge.js" core/seiseki-local-bridge.js
          cp -a "$LLM_SRC/scripts/build-app.mjs" scripts/build-app.mjs
          cp -a "$LLM_SRC/tests/local-bridge.test.js" tests/local-bridge.test.js
          cp -a "$LLM_SRC/local/index.html" local/index.html
          cp -a "$LLM_SRC/local/.env.staging.example" local/.env.staging.example
          rm -rf local/public/model
          mkdir -p local/public/model
          cp -a "$LLM_SRC/local/public/model/." local/public/model/
          cat > local/public/model/LICENSE-modernbert-ja-30m.txt <<'EOF'
          MIT License

          Copyright (c) 2025 SB Intuitions

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          grep -qxF '**/dist/' .gitignore || printf '\n**/dist/\n' >> .gitignore
          rm -rf local-llm-import

      - name: Verify quantum integration was preserved
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\["quantum", "量子観測"\]' core/ui.jsx
          grep -q 'quantum: "/app/quantum"' core/ui.jsx
          grep -q 'seiseki-opinion-network-preview.tokyo-odh-129.workers.dev' core/ui.jsx

      - name: Regenerate app artifacts and verify source sync
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          grep -q 'seiseki-local-v1' app/seiseki.jsx
          grep -q 'quantum: "/app/quantum"' app/seiseki.jsx
          cmp app/seiseki.jsx local/src/App.jsx

      - name: Verify application tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test.js
          node tests/local-bridge.test.js
          node tests/page-routing.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          node tests/quantum-entanglement-engine.test.mjs

      - name: Verify Cloudflare source only
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Fresh staging build
        shell: bash
        env:
          VITE_SEISEKI_API_BASE: https://seiseki-api-staging.tokyo-odh-129.workers.dev
          VITE_SEISEKI_API_REQUIRED: 'false'
        run: |
          set -euo pipefail
          cd local
          npm ci --no-audit --no-fund
          npm run build:staging
          cd ..
          test -s local/dist/index.html
          test -f local/dist/model/manifest.json
          test -f local/dist/model/LICENSE-modernbert-ja-30m.txt
          grep -lq 'seiseki-api-staging' local/dist/assets/*.js
          grep -lq 'seiseki-local-v1' local/dist/assets/*.js
          grep -q 'model-store.js' local/dist/index.html
          rm -rf local/dist local/node_modules cloudflare/node_modules

      - name: Commit verified local LLM source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore .github/workflows/deploy-staging.yml core/logic.js core/ui.jsx core/seiseki-local-bridge.js scripts/build-app.mjs tests/local-bridge.test.js local/index.html local/.env.staging.example local/public/model app/seiseki.jsx local/src/App.jsx
          git rm -r --ignore-unmatch local-llm-import
          git status --short
          git commit -m "Integrate verified local LLM into SEISEKI quantum branch"
          git push origin HEAD:feat/local-llm-stage0-1
