name: Diagnose production dashboard WebKit 20260830

on:
  push:
    branches:
      - fix/mobile-tree-fit-dashboard-20260830
    paths:
      - .github/workflows/diagnose-production-dashboard-webkit-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seiseki-webkit-diag
          cd /tmp/seiseki-webkit-diag
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Execute production dashboard as mobile Safari
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/seiseki-webkit-diag
          cat > diag.mjs <<'EOF'
          import { webkit, devices } from 'playwright';
          const browser = await webkit.launch({ headless: true });
          const device = devices['iPhone 13'];
          const context = await browser.newContext({ ...device });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => { const line='PAGEERROR '+String(error?.stack||error); errors.push(line); console.log(line); });
          page.on('console', msg => { if (msg.type()==='error') { const line='CONSOLEERROR '+msg.text(); errors.push(line); console.log(line); } });
          page.on('requestfailed', req => console.log('REQUESTFAILED '+req.url()+' '+(req.failure()?.errorText||'')));
          const url='https://seiseki-api.tokyo-odh-129.workers.dev/app/dashboard?rev=webkit-diag-'+Date.now();
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          console.log('HTTP',response?.status(),response?.url());
          await page.waitForTimeout(5000);
          const h=await page.evaluate(()=>document.documentElement.scrollHeight);
          console.log('SCROLL_HEIGHT',h);
          for(let y=0;y<h;y+=500){ await page.evaluate(v=>window.scrollTo(0,v),y); await page.waitForTimeout(120); }
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(3000);
          console.log('BODY', (await page.locator('body').innerText()).slice(0,3000).replace(/\n/g,' | '));
          console.log('ERROR_COUNT',errors.length);
          await page.screenshot({path:'/tmp/dashboard-webkit.png',fullPage:true});
          await browser.close();
          if(errors.length) process.exitCode=2;
          EOF
          node diag.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dashboard-webkit-diagnosis
          path: /tmp/dashboard-webkit.png
          if-no-files-found: ignore
