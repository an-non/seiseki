name: Production queue DLQ repair v3 20260830

on:
  push:
    branches:
      - release/production-20260830
    paths:
      - .github/workflows/production-queue-dlq-repair-v3-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-production-20260830
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUEUE_NAME: seiseki-analysis
      DLQ_NAME: seiseki-analysis-dlq
      SCRIPT_NAME: seiseki-api
      EXPECTED_QUEUE_ID: 4606abc6f57645358bad7444b83e3b1b
      EXPECTED_CONSUMER_ID: f5c011d7c7d640709a044ace2edf664d
    steps:
      - name: Checkout exact application RC
        uses: actions/checkout@v4
        with:
          ref: f2b9d0a6b3642f4c3b064f64c47c13726cc8127c
          fetch-depth: 0

      - name: Setup Node and Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install Wrangler
        shell: bash
        run: npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund

      - name: Hard-guard local and remote consumer state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const q=c.queues?.consumers?.filter(x=>x.queue===process.env.QUEUE_NAME)||[];
          if(q.length!==1)throw new Error(`local consumer count ${q.length}`);
          const x=q[0];
          if(x.dead_letter_queue!==process.env.DLQ_NAME)throw new Error('local DLQ mismatch');
          if(Number(x.max_batch_size)!==3||Number(x.max_batch_timeout)!==2||Number(x.max_retries)!==3||Number(x.max_concurrency)!==1||Number(x.retry_delay)!==10)throw new Error(`local settings mismatch ${JSON.stringify(x)}`);
          NODE
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/queues-before.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${EXPECTED_QUEUE_ID}/consumers" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/consumers-before.json
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/queues-before.json','utf8'));
          if(!q.success)throw new Error(JSON.stringify(q.errors));
          const prod=(q.result||[]).filter(x=>x.queue_name===process.env.QUEUE_NAME);
          if(prod.length!==1||prod[0].queue_id!==process.env.EXPECTED_QUEUE_ID)throw new Error(`queue identity drift ${JSON.stringify(prod)}`);
          const dlq=(q.result||[]).filter(x=>x.queue_name===process.env.DLQ_NAME);
          if(dlq.length>1)throw new Error('duplicate named DLQ');
          const r=JSON.parse(fs.readFileSync('/tmp/consumers-before.json','utf8'));
          if(!r.success)throw new Error(JSON.stringify(r.errors));
          const all=Array.isArray(r.result)?r.result:[];
          if(all.length!==1)throw new Error(`remote consumer count ${all.length}`);
          const c=all[0],s=c.settings||{};
          if(c.type!=='worker'||c.consumer_id!==process.env.EXPECTED_CONSUMER_ID)throw new Error(`consumer identity drift ${JSON.stringify(c)}`);
          if(Number(s.batch_size)!==3||Number(s.max_retries)!==3||Number(s.max_wait_time_ms)!==2000||Number(s.max_concurrency)!==1||Number(s.retry_delay)!==10)throw new Error(`consumer settings drift ${JSON.stringify(s)}`);
          console.log(JSON.stringify({queueId:prod[0].queue_id,consumerId:c.consumer_id,dlqExists:dlq.length===1,settings:s}));
          NODE

      - name: Provision missing DLQ with Wrangler
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler queues list | grep -Eq '(^|[[:space:]|])seiseki-analysis-dlq([[:space:]|]|$)'; then
            echo 'production DLQ already exists'
          else
            npx wrangler queues create seiseki-analysis-dlq
          fi
          npx wrangler queues list | tee /tmp/queues-after-create.txt
          grep -Eq '(^|[[:space:]|])seiseki-analysis-dlq([[:space:]|]|$)' /tmp/queues-after-create.txt

      - name: Attach DLQ to the unique guarded consumer
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "{\"script_name\":\"${SCRIPT_NAME}\",\"type\":\"worker\",\"dead_letter_queue\":\"${DLQ_NAME}\",\"settings\":{\"batch_size\":3,\"max_concurrency\":1,\"max_retries\":3,\"max_wait_time_ms\":2000,\"retry_delay\":10}}" > /tmp/update.json
          HTTP_CODE="$(curl -sS -o /tmp/update-result.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues/${EXPECTED_QUEUE_ID}/consumers/${EXPECTED_CONSUMER_ID}" -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${CF_TOKEN}" --data-binary @/tmp/update.json)"
          if [ "$HTTP_CODE" != 200 ]; then
            echo "consumer update HTTP ${HTTP_CODE}" >&2
            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/update-result.json','utf8'));console.error(JSON.stringify(x.errors||x.messages||[]))"
            exit 61
          fi
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/update-result.json','utf8'));
          if(!x.success)throw new Error(`consumer update failed ${JSON.stringify(x.errors)}`);
          const c=x.result||{},s=c.settings||{};
          if(c.consumer_id!==process.env.EXPECTED_CONSUMER_ID||c.script_name!==process.env.SCRIPT_NAME||c.dead_letter_queue!==process.env.DLQ_NAME)throw new Error(`consumer response mismatch ${JSON.stringify(c)}`);
          if(Number(s.batch_size)!==3||Number(s.max_retries)!==3||Number(s.max_wait_time_ms)!==2000||Number(s.max_concurrency)!==1||Number(s.retry_delay)!==10)throw new Error(`consumer settings changed ${JSON.stringify(s)}`);
          console.log(JSON.stringify({consumerId:c.consumer_id,script:c.script_name,dlq:c.dead_letter_queue,settings:s}));
          NODE

      - name: Verify repaired state independently
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues" -H "Authorization: Bearer ${CF_TOKEN}" > /tmp/queues-final.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues/${EXPECTED_QUEUE_ID}/consumers/${EXPECTED_CONSUMER_ID}" -H "Authorization: Bearer ${CF_TOKEN}" > /tmp/consumer-final.json
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/queues-final.json','utf8'));
          if(!q.success||(q.result||[]).filter(x=>x.queue_name===process.env.DLQ_NAME).length!==1)throw new Error('DLQ missing after repair');
          const x=JSON.parse(fs.readFileSync('/tmp/consumer-final.json','utf8'));
          if(!x.success)throw new Error(JSON.stringify(x.errors));
          const c=x.result||{},s=c.settings||{};
          if(c.consumer_id!==process.env.EXPECTED_CONSUMER_ID||c.script_name!==process.env.SCRIPT_NAME||c.dead_letter_queue!==process.env.DLQ_NAME)throw new Error(`final consumer mismatch ${JSON.stringify(c)}`);
          if(Number(s.batch_size)!==3||Number(s.max_retries)!==3||Number(s.max_wait_time_ms)!==2000||Number(s.max_concurrency)!==1||Number(s.retry_delay)!==10)throw new Error(`final settings mismatch ${JSON.stringify(s)}`);
          console.log('production Queue/DLQ repair PASS');
          NODE

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Production Queue/DLQ repair v3'
            echo '- DLQ target: `seiseki-analysis-dlq`'
            echo '- existing queue and consumer identity/settings hard-guarded before mutation'
            echo '- D1 untouched'
            echo '- Worker application code not deployed'
          } >> "$GITHUB_STEP_SUMMARY"
