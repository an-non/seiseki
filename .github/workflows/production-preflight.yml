name: Verify SEISEKI production access read-only

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to verify
        required: true
        type: string
      confirmation:
        description: Type preflight-production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seiseki-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable preflight request
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "preflight-production"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout approved commit without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install Cloudflare tooling
        working-directory: cloudflare
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify production access without changing it
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          npx wrangler queues list > /tmp/queues.txt
          npx wrangler secret list > /tmp/secrets.json
          npx wrangler d1 migrations list seiseki-db --remote > /tmp/migrations.txt
          npx wrangler deployments list > /tmp/deployments.txt
          node - <<'NODE'
          const fs = require('fs');
          const databases = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          if (!databases.some(item => item?.name === 'seiseki-db')) {
            throw new Error('production D1 is missing');
          }
          const queues = fs.readFileSync('/tmp/queues.txt', 'utf8');
          for (const name of ['seiseki-analysis', 'seiseki-analysis-dlq']) {
            if (!queues.includes(name)) throw new Error(`production Queue is missing: ${name}`);
          }
          const secrets = JSON.parse(fs.readFileSync('/tmp/secrets.json', 'utf8'));
          const names = new Set(secrets.map(item => item.name));
          for (const name of [
            'ANALYSIS_CACHE_HMAC_SECRET',
            'SUBMISSION_FINGERPRINT_HMAC_SECRET',
            'RATE_LIMIT_FINGERPRINT_SECRET'
          ]) {
            if (!names.has(name)) throw new Error(`production secret is missing: ${name}`);
          }
          const migrations = fs.readFileSync('/tmp/migrations.txt', 'utf8');
          if (!/No migrations to apply/i.test(migrations)) {
            throw new Error('production D1 has pending migrations');
          }
          if (!fs.readFileSync('/tmp/deployments.txt', 'utf8').trim()) {
            throw new Error('production deployment list is empty');
          }
          NODE
          printf '### Production read-only preflight\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- commit: `%s`\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- D1: available\n- Queue and DLQ: available\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- required secret names: available\n- pending migrations: none\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- production changed: `false`\n' >> "$GITHUB_STEP_SUMMARY"
