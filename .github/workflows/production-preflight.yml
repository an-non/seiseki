name: Production readiness preflight

on:
  push:
    branches:
      - feature/quantum-app-integration
    paths:
      - .github/workflows/production-preflight.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiseki-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/quantum-app-integration
          fetch-depth: 0

      - name: Build and test release candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-mobile-ui-fix.mjs
          node scripts/build-app.mjs
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/local-bridge.test.js
          node tests/balcheck.js app/seiseki.jsx
          node tests/quantum-entanglement-engine.test.mjs
          cd cloudflare
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Inspect Cloudflare production resources read-only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler d1 list --json > /tmp/d1.json 2>/tmp/d1.err
          echo $? > /tmp/d1.status
          npx wrangler queues list > /tmp/queues.txt 2>/tmp/queues.err
          echo $? > /tmp/queues.status
          npx wrangler deployments list > /tmp/deployments.txt 2>/tmp/deployments.err
          echo $? > /tmp/deployments.status
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/turnstile.json 2>/tmp/turnstile.err
          echo $? > /tmp/turnstile.status
          exit 0

      - name: Write production readiness report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(node - <<'NODE'
          const fs=require('fs');
          try {
            const rows=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
            const hit=Array.isArray(rows)?rows.find(x=>x && x.name==='seiseki-db'):null;
            process.stdout.write(hit?.uuid || hit?.id || '');
          } catch {}
          NODE
          )
          QUEUE_FOUND=$(grep -q 'seiseki-analysis' /tmp/queues.txt 2>/dev/null && echo true || echo false)
          TURNSTILE_FOUND=$(node - <<'NODE'
          const fs=require('fs');
          try {
            const x=JSON.parse(fs.readFileSync('/tmp/turnstile.json','utf8'));
            process.stdout.write(Array.isArray(x.result)&&x.result.length?'true':'false');
          } catch { process.stdout.write('unknown'); }
          NODE
          )
          CONFIG_DB=$(node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('cloudflare/wrangler.jsonc','utf8');
          const m=s.match(/"database_name":\s*"seiseki-db",\s*\n\s*"database_id":\s*"([^"]+)"/);
          process.stdout.write(m?.[1]||'');
          NODE
          )
          PROD_ORIGINS=$(grep -q '"ALLOWED_ORIGINS"' cloudflare/wrangler.jsonc && echo configured || echo missing)
          PROD_AI=$(node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('cloudflare/wrangler.jsonc','utf8');
          const root=s.split('"env"')[0]; process.stdout.write(root.includes('"ai"')?'configured':'missing');
          NODE
          )
          cat > PRODUCTION_PREFLIGHT.md <<EOF
          # SEISEKI production preflight

          Generated from branch: feature/quantum-app-integration
          GitHub head: $(git rev-parse HEAD)

          ## Application
          - app tests: passed
          - Cloudflare worker tests: passed
          - typography patch: Hiragino-first, external Google Fonts removed
          - quantum glow experiment: archived separately; stable renderer selected

          ## Production configuration
          - configured D1 id: ${CONFIG_DB}
          - remote D1 named seiseki-db discovered: $([ -n "$DB_ID" ] && echo true || echo false)
          - remote D1 id: ${DB_ID:-not-found}
          - production ALLOWED_ORIGINS: ${PROD_ORIGINS}
          - production AI binding: ${PROD_AI}
          - production queue discovered: ${QUEUE_FOUND}
          - Turnstile widget visible to deployment token: ${TURNSTILE_FOUND}

          ## Security gates
          - Turnstile server-side verification exists for response submission.
          - Production must not set TURNSTILE_REQUIRED=true until a client sitekey/token flow is present.
          - Account login/register currently have no dedicated application-level rate limiter.
          - Bearer sessions are random 32-byte tokens stored server-side only as SHA-256 hashes.
          - CORS uses an explicit origin allowlist when ALLOWED_ORIGINS is configured.
          - Request JSON is limited to 32 KiB; free text is limited to 1500 characters.

          ## Deploy decision
          $([ -n "$DB_ID" ] && [ "$PROD_ORIGINS" = configured ] && echo 'Candidate infrastructure exists; production config can be finalized.' || echo 'BLOCKED: production configuration is incomplete. Do not deploy until D1 and origin configuration are finalized.')
          EOF

      - name: Commit preflight report only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf local/dist local/node_modules cloudflare/node_modules
          git restore core/ui.jsx app/seiseki.jsx local/src/App.jsx 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION_PREFLIGHT.md
          if ! git diff --cached --quiet; then
            git commit -m "Record production readiness preflight"
            git push origin HEAD:feature/quantum-app-integration
          fi
