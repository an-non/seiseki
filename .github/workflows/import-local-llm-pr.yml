name: Import local LLM via observable PR

on:
  pull_request:
    branches:
      - feat/local-llm-stage0-1
    paths:
      - "local-llm-import/PR_TRIGGER"

permissions:
  contents: write

concurrency:
  group: seiseki-local-llm-pr-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target local LLM branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-llm-stage0-1
          fetch-depth: 0
      - name: Import, verify and commit local LLM
        shell: bash
        run: bash .github/scripts/import-local-llm-pr.sh
