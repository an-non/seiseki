name: Deploy SEISEKI production dashboard + quantum hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-dashboard-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiseki-production-release
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://seiseki-api.tokyo-odh-129.workers.dev
    steps:
      - name: Checkout production source
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: feature/quantum-app-integration
          fetch-depth: 0

      - name: Apply durable UI and dashboard patches
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-mobile-ui-fix.mjs
          node scripts/apply-production-dashboard-fix.mjs
          node scripts/build-app.mjs
          grep -q 'cloudLoadPublicAggregate' core/ui.jsx
          grep -q '/api/public-aggregate' cloudflare/src/index.mjs
          grep -q 'getPublicAggregate' cloudflare/src/public-aggregate.mjs
          grep -q 'const QUANTUM_PREVIEW_URL = "/quantum/' core/ui.jsx
          ! grep -q 'seiseki-opinion-network-preview.tokyo-odh-129.workers.dev/chunk-network-entanglement-preview.html' core/ui.jsx

      - name: Sync stable quantum source into web public assets
        id: quantum_source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/opinion-network-preview:refs/remotes/origin/feature/opinion-network-preview
          mkdir -p local/public/quantum
          git show origin/feature/opinion-network-preview:preview/opinion-network/public/chunk-network-entanglement-preview.html > local/public/quantum/chunk-network-entanglement-preview.html
          git show origin/feature/opinion-network-preview:preview/opinion-network/public/quantum-entanglement-engine.mjs > local/public/quantum/quantum-entanglement-engine.mjs
          test -s local/public/quantum/chunk-network-entanglement-preview.html
          test -s local/public/quantum/quantum-entanglement-engine.mjs
          grep -q 'prototype-10000' local/public/quantum/chunk-network-entanglement-preview.html
          grep -q 'linewidth:1.55' local/public/quantum/chunk-network-entanglement-preview.html
          ! grep -q 'relationMist' local/public/quantum/chunk-network-entanglement-preview.html
          node --check local/public/quantum/quantum-entanglement-engine.mjs

      - name: Prepare same-origin Three.js runtime
        id: quantum_runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack three@0.185.1 --pack-destination "$tmp" >/dev/null
          tar -xzf "$tmp"/three-*.tgz -C "$tmp"
          src="$tmp/package"
          dst="local/public/node_modules/three"
          rm -rf "$dst"
          mkdir -p "$dst/build" "$dst/examples/jsm/controls" "$dst/examples/jsm/lines" "$dst/examples/jsm/postprocessing" "$dst/examples/jsm/shaders"
          cp "$src/build/three.module.js" "$src/build/three.core.js" "$dst/build/"
          cp "$src/examples/jsm/controls/OrbitControls.js" "$dst/examples/jsm/controls/"
          cp "$src/examples/jsm/lines/LineMaterial.js" "$src/examples/jsm/lines/LineSegments2.js" "$src/examples/jsm/lines/LineSegmentsGeometry.js" "$dst/examples/jsm/lines/"
          cp "$src/examples/jsm/postprocessing/EffectComposer.js" "$src/examples/jsm/postprocessing/MaskPass.js" "$src/examples/jsm/postprocessing/OutputPass.js" "$src/examples/jsm/postprocessing/Pass.js" "$src/examples/jsm/postprocessing/RenderPass.js" "$src/examples/jsm/postprocessing/ShaderPass.js" "$src/examples/jsm/postprocessing/UnrealBloomPass.js" "$dst/examples/jsm/postprocessing/"
          cp "$src/examples/jsm/shaders/CopyShader.js" "$src/examples/jsm/shaders/LuminosityHighPassShader.js" "$src/examples/jsm/shaders/OutputShader.js" "$dst/examples/jsm/shaders/"
          test -s "$dst/build/three.module.js"
          test -s "$dst/examples/jsm/postprocessing/UnrealBloomPass.js"

      - name: Run application tests
        id: app_tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/local-bridge.test.js
          node tests/balcheck.js app/seiseki.jsx
          node tests/quantum-entanglement-engine.test.mjs

      - name: Install and test Worker
        id: worker_tests
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler --version
          npm run check
          npm test

      - name: Build production web assets
        id: build
        working-directory: local
        env:
          VITE_SEISEKI_API_BASE: https://seiseki-api.tokyo-odh-129.workers.dev
          VITE_SEISEKI_API_REQUIRED: 'true'
          VITE_SEISEKI_RUNTIME_MODE: production
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -f dist/model/manifest.json
          test -s dist/quantum/chunk-network-entanglement-preview.html
          test -s dist/quantum/quantum-entanglement-engine.mjs
          test -s dist/node_modules/three/build/three.module.js
          grep -lq '/api/public-aggregate' dist/assets/*.js
          grep -lq '/quantum/chunk-network-entanglement-preview.html' dist/assets/*.js
          grep -lq 'Hiragino Sans' dist/assets/*.js

      - name: Wrangler dry run
        id: dry_run
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -s ../local/dist/index.html
          npx wrangler deploy --dry-run --outdir /tmp/seiseki-dashboard-quantum-hotfix

      - name: Record previous Worker deployment
        id: previous
        working-directory: cloudflare
        shell: bash
        run: |
          set +e
          npx wrangler deployments list > /tmp/previous-deployment.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/previous-deployment.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy production hotfix
        id: deploy
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --strict 2>&1 | tee /tmp/deploy.txt

      - name: Verify production Cloudflare runtime
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PRODUCTION_URL/api/health" > /tmp/health.json; then break; fi
            sleep 3
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h.status!=='ok'||h.database!=='d1') throw new Error('health/D1 failed');
          NODE
          curl -fsS "$PRODUCTION_URL/api/config" > /tmp/config.json
          curl -fsS "$PRODUCTION_URL/api/public-aggregate" > /tmp/aggregate.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/aggregate.json','utf8'));
          for(const k of ['total','demo','questions','ideology','topics','targets','cross','series','net','opinions']) if(!(k in a)) throw new Error('aggregate missing '+k);
          if(!Number.isFinite(Number(a.total))) throw new Error('aggregate total invalid');
          console.log(JSON.stringify({total:a.total,topics:Object.keys(a.topics||{}).length,opinions:(a.opinions||[]).length}));
          NODE
          curl -fsS "$PRODUCTION_URL/app/dashboard" > /tmp/dashboard.html
          grep -qi '<!doctype html>' /tmp/dashboard.html
          curl -fsS "$PRODUCTION_URL/app/quantum" > /tmp/quantum-route.html
          grep -qi '<!doctype html>' /tmp/quantum-route.html
          curl -fsS "$PRODUCTION_URL/quantum/chunk-network-entanglement-preview.html?count=10000&seed=prototype-10000&theme=dark&rev=quantum-embedded-v1" > /tmp/quantum-embedded.html
          grep -q '意見ネットワーク 量子もつれ観測' /tmp/quantum-embedded.html
          grep -q 'quantum-entanglement-engine.mjs' /tmp/quantum-embedded.html
          curl -fsS "$PRODUCTION_URL/quantum/quantum-entanglement-engine.mjs" > /tmp/quantum-engine.mjs
          grep -q 'createEntanglementModel' /tmp/quantum-engine.mjs
          curl -fsS "$PRODUCTION_URL/node_modules/three/build/three.module.js" > /tmp/three.module.js
          grep -q 'three.js' /tmp/three.module.js

      - name: Commit hotfix source and success record
        id: record
        shell: bash
        run: |
          set -euo pipefail
          cat > PRODUCTION_DASHBOARD_HOTFIX.md <<EOF
          # SEISEKI production dashboard + quantum hotfix

          - outcome: success
          - production_url: ${PRODUCTION_URL}
          - dashboard_path: ${PRODUCTION_URL}/app/dashboard
          - quantum_path: ${PRODUCTION_URL}/app/quantum
          - embedded_quantum_asset: ${PRODUCTION_URL}/quantum/chunk-network-entanglement-preview.html?count=10000&seed=prototype-10000&theme=dark&rev=quantum-embedded-v1
          - health: ok
          - database: d1
          - public_aggregate: ok
          - dashboard_html: ok
          - quantum_route: ok
          - quantum_embedded_html: ok
          - quantum_engine: ok
          - three_runtime: 0.185.1 same-origin
          - d1_migrations: none
          - worker_deploy_guard: strict
          - dashboard_source: privacy-filtered D1 aggregate API
          - quantum_source: stable feature/opinion-network-preview artifact copied into production web assets
          - local_fallback: retained
          EOF
          rm -rf local/node_modules local/dist local/public/node_modules local/public/quantum cloudflare/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/ui.jsx app/seiseki.jsx local/src/App.jsx cloudflare/src/index.mjs cloudflare/src/public-aggregate.mjs scripts/apply-mobile-ui-fix.mjs scripts/apply-production-dashboard-fix.mjs PRODUCTION_DASHBOARD_HOTFIX.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix production dashboard and embed quantum renderer"
            git push origin HEAD:feature/quantum-app-integration
          fi

      - name: Roll back Worker if runtime verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success' && steps.previous.outputs.exists == 'true' }}
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler rollback --message "Rollback failed SEISEKI dashboard/quantum hotfix"

      - name: Record incomplete hotfix
        if: ${{ always() && steps.record.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > PRODUCTION_DASHBOARD_HOTFIX_PROGRESS.md <<EOF
          # SEISEKI production dashboard + quantum hotfix progress
          - outcome: incomplete
          - checkout: ${{ steps.checkout.outcome }}
          - patch: ${{ steps.patch.outcome }}
          - quantum_source: ${{ steps.quantum_source.outcome }}
          - quantum_runtime: ${{ steps.quantum_runtime.outcome }}
          - app_tests: ${{ steps.app_tests.outcome }}
          - worker_tests: ${{ steps.worker_tests.outcome }}
          - build: ${{ steps.build.outcome }}
          - dry_run: ${{ steps.dry_run.outcome }}
          - previous: ${{ steps.previous.outcome }}
          - deploy: ${{ steps.deploy.outcome }}
          - smoke: ${{ steps.smoke.outcome }}
          - record: ${{ steps.record.outcome }}
          - d1_migrations: none
          EOF
          rm -rf local/node_modules local/dist local/public/node_modules local/public/quantum cloudflare/node_modules || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION_DASHBOARD_HOTFIX_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record incomplete dashboard/quantum hotfix"
            git push origin HEAD:feature/quantum-app-integration
          fi
