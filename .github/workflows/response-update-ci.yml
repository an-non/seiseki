name: Response auth revision CI

on:
  push:
    branches:
      - feature/response-update-auth-revision-20260825
    paths:
      - cloudflare/**
      - .github/workflows/response-update-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: cloudflare
        run: npm run check
      - name: Tests
        working-directory: cloudflare
        run: npm test
