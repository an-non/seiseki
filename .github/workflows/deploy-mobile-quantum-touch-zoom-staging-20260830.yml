name: Deploy mobile quantum touch zoom staging 20260830

on:
  push:
    branches:
      - release/production-20260830
    paths:
      - .github/workflows/deploy-mobile-quantum-touch-zoom-staging-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-staging-quantum-20260830
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIX_SHA: ca8b9326a096883247b64358ece4a932f43985fd
      STAGING_URL: https://seiseki-api-staging.tokyo-odh-129.workers.dev
    steps:
      - name: Checkout exact tested quantum fix
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_SHA }}
          fetch-depth: 0

      - name: Prove exact fix and production RC ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIX_SHA"
          git merge-base --is-ancestor e1652c303868b9c20e476abc1888ba7388738b2f HEAD
          node tests/mobile-quantum-touch-zoom-contract.mjs local/chunk-network-entanglement-preview.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            local/package-lock.json
            cloudflare/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix local ci --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund

      - name: Regression and build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          git diff --exit-code -- app/seiseki.jsx local/src/App.jsx
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          VITE_SEISEKI_API_BASE="$STAGING_URL" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=staging npm --prefix local run build
          node tests/mobile-quantum-touch-zoom-contract.mjs local/dist --built
          node tests/phase5-quantum-compact-contract.mjs local/dist/quantum/chunk-network-entanglement-preview.html

      - name: Staging dry run
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --dry-run --outdir /tmp/staging-quantum-dry-run
          test -d /tmp/staging-quantum-dry-run

      - name: Deploy staging only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --strict 2>&1 | tee /tmp/deploy.txt
          grep -E 'Current Version ID|Uploaded|Deployed|https://' /tmp/deploy.txt || true

      - name: Verify live staging quantum bundle
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$STAGING_URL/api/health" > /tmp/health.json; then break; fi
            sleep 2
          done
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h.status!=='ok'||h.database!=='d1')throw new Error(JSON.stringify(h));
          NODE
          curl -fsS "$STAGING_URL/quantum/chunk-network-entanglement-preview.html?rev=mobile-touch-zoom-20260830" > /tmp/quantum.html
          grep -qi '<!doctype html>' /tmp/quantum.html
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('/tmp/quantum.html','utf8');
          const matches=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(x=>x[1]);
          const q=matches.find(x=>/quantum/i.test(x));
          if(!q)throw new Error(`quantum bundle src missing: ${JSON.stringify(matches)}`);
          fs.writeFileSync('/tmp/quantum-src.txt',q);
          NODE
          src=$(cat /tmp/quantum-src.txt)
          case "$src" in
            http*) url="$src" ;;
            /*) url="$STAGING_URL$src" ;;
            *) url="$STAGING_URL/quantum/$src" ;;
          esac
          curl -fsS "$url" > /tmp/quantum.js
          grep -Fq 'pointerdown' /tmp/quantum.js
          grep -Fq 'pointerup' /tmp/quantum.js
          grep -Fq '(pointer: coarse)' /tmp/quantum.js
          grep -Fq 'pointercancel' /tmp/quantum.js
          echo 'live staging quantum touch bundle PASS'
