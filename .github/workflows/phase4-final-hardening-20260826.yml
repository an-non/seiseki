name: Phase 4 final hardening 20260826

on:
  push:
    branches:
      - feature/response-update-auth-revision-20260825
    paths:
      - scripts/apply-phase4-final-hardening-20260826.mjs
      - .github/workflows/phase4-final-hardening-20260826.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Apply final Phase 4 hardening
        run: node scripts/apply-phase4-final-hardening-20260826.mjs
      - name: Install
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: cloudflare
        run: npm run check
      - name: Focused Phase 4 hardening tests
        working-directory: cloudflare
        run: node --test tests/response-phase4-backend.test.mjs tests/response-analysis-hardening.test.mjs tests/response-auth-revision.test.mjs tests/response-revision-queue.test.mjs tests/validation.test.mjs tests/public-aggregate-filter.test.mjs
      - name: Full regression suite
        working-directory: cloudflare
        run: npm test
      - name: Show diff
        if: always()
        run: git diff --stat && git diff -- cloudflare/src/index.mjs cloudflare/src/rate-limit.mjs cloudflare/src/validation.mjs cloudflare/tests/response-phase4-backend.test.mjs cloudflare/tests/validation.test.mjs
      - name: Commit final Phase 4 hardening
        if: success()
        run: |
          git config user.name "SEISEKI phase4 hardening"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/src/index.mjs cloudflare/src/rate-limit.mjs cloudflare/src/validation.mjs cloudflare/tests/response-phase4-backend.test.mjs cloudflare/tests/validation.test.mjs
          if git diff --cached --quiet; then
            echo "No final Phase 4 hardening changes to commit."
            exit 0
          fi
          git commit -m "Harden Phase 4 requeue and public demo boundaries"
          git push origin HEAD:feature/response-update-auth-revision-20260825
