name: Phase 5 recovery local implementation 20260827

on:
  push:
    branches:
      - codex/phase5-recovery-20260827
    paths:
      - scripts/SEISEKI_PHASE5_APPLY_20260827.mjs
      - .github/workflows/phase5-recovery-local-implementation-20260827.yml

permissions:
  contents: write

concurrency:
  group: seiseki-phase5-recovery-local-implementation
  cancel-in-progress: false

env:
  BASELINE_SHA: 7d761f6a7ecbc130f8cb66fef5004fdaf3b66c51
  TARGET_BRANCH: codex/phase5-implementation-20260827

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve recovery runner and return to exact baseline
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/SEISEKI_PHASE5_APPLY_20260827.mjs /tmp/SEISEKI_PHASE5_APPLY_20260827.mjs
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/SEISEKI_PHASE5_APPLY_20260827.mjs';
          let s = fs.readFileSync(p, 'utf8');
          function one(a, b) {
            const first = s.indexOf(a);
            if (first < 0 || s.indexOf(a, first + a.length) >= 0) throw new Error('runner hotfix anchor mismatch: ' + a.slice(0, 100));
            s = s.slice(0, first) + b + s.slice(first + a.length);
          }
          one(String.raw`  'const FONT_MONO = \'ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace\';'`, String.raw`  'const FONT_MONO = \\'ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace\\';'`);
          one(String.raw`src.includes('const FONT_BODY = \'"Hiragino Sans"')`, String.raw`src.includes('const FONT_BODY = \\'"Hiragino Sans"')`);
          one(String.raw`src.includes('const FONT_DISP = \'"Hiragino Sans"')`, String.raw`src.includes('const FONT_DISP = \\'"Hiragino Sans"')`);
          one(String.raw`src.includes('const FONT_BODY = \'"Zen Kaku Gothic New"')`, String.raw`src.includes('const FONT_BODY = \\'"Zen Kaku Gothic New"')`);
          one(String.raw`src.includes('const FONT_DISP = \'"Shippori Mincho"')`, String.raw`src.includes('const FONT_DISP = \\'"Shippori Mincho"')`);
          one(String.raw`src.includes('const FONT_MONO = \'"IBM Plex Mono"')`, String.raw`src.includes('const FONT_MONO = \\'"IBM Plex Mono"')`);
          const compactAnalysis = '    analysisStatus: row.analysisStatus === "pending" && run?.status === "running" ? "running" : row.analysisStatus,';
          const firstAnalysis = s.indexOf(compactAnalysis);
          if (firstAnalysis < 0) throw new Error('compact baseline analysis anchor not found');
          const expandedAnalysis = '    analysisStatus: row.analysisStatus === "pending" && run?.status === "running"\n      ? "running"\n      : row.analysisStatus,';
          s = s.slice(0, firstAnalysis) + expandedAnalysis + s.slice(firstAnalysis + compactAnalysis.length);
          const blockStart = s.indexOf('replaceOnce(".github/workflows/mobile-ui-staging.yml",');
          const blockEnd = s.indexOf('\n\nconst migration = ', blockStart);
          if (blockStart < 0 || blockEnd < 0) throw new Error('mobile workflow runner block not found');
          s = s.slice(0, blockStart) + s.slice(blockEnd + 2);
          fs.writeFileSync(p, s);
          NODE
          git checkout --detach "$BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git status --porcelain)"
          node --check /tmp/SEISEKI_PHASE5_APPLY_20260827.mjs

      - name: Install local test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          npm --prefix local ci --no-audit --no-fund
          test -z "$(git status --porcelain)"

      - name: Apply Phase 5 and patch workflow font contract
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/SEISEKI_PHASE5_APPLY_20260827.mjs --repo="$GITHUB_WORKSPACE"
          node - <<'NODE'
          const fs = require('fs');
          const p = '.github/workflows/mobile-ui-staging.yml';
          let s = fs.readFileSync(p, 'utf8');
          function replaceLine(fragment, next) {
            const lines = s.split('\n');
            const indexes = lines.map((line, i) => line.includes(fragment) ? i : -1).filter(i => i >= 0);
            if (indexes.length !== 1) throw new Error(`expected one workflow line for ${fragment}, found ${indexes.length}`);
            lines[indexes[0]] = next;
            s = lines.join('\n');
          }
          replaceLine('const FONT_BODY = ', `          grep -Fq 'const FONT_BODY = ' core/ui.jsx && grep -Fq '"Zen Kaku Gothic New"' core/ui.jsx`);
          replaceLine('const FONT_DISP = ', `          grep -Fq 'const FONT_DISP = ' core/ui.jsx && grep -Fq '"Shippori Mincho"' core/ui.jsx`);
          replaceLine('SFMono-Regular', `          grep -Fq 'const FONT_MONO = ' core/ui.jsx && grep -Fq '"IBM Plex Mono"' core/ui.jsx`);
          fs.writeFileSync(p, s);
          NODE
          node tests/local-bridge.test.js
          node tests/phase4-ui-contract.test.mjs
          git diff --check
          cmp app/seiseki.jsx local/src/App.jsx

      - name: Verify local-only recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare/migrations/0007_response_updated_at.sql
          grep -q 'tree: "/app/tree"' core/ui.jsx
          grep -q 'ANALYSIS_NOT_RETRYABLE' cloudflare/src/index.mjs
          grep -q 'ANALYSIS_STALL_AFTER_MS = 60000' cloudflare/src/db.mjs
          grep -Fq '"Zen Kaku Gothic New"' .github/workflows/mobile-ui-staging.yml
          grep -Fq '"Shippori Mincho"' .github/workflows/mobile-ui-staging.yml
          grep -Fq '"IBM Plex Mono"' .github/workflows/mobile-ui-staging.yml
          ! git diff -- cloudflare/wrangler.jsonc | grep -E 'database_id|queue|name'

      - name: Commit tested implementation to isolated Phase 5 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core app/seiseki.jsx local/src/App.jsx scripts/apply-mobile-ui-fix.mjs \
            .github/workflows/mobile-ui-staging.yml cloudflare tests
          git status --short
          git commit -m 'Implement Phase 5 route auth analysis UX recovery'
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'Phase 5 tested commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Target branch: `%s`\n' "$TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          printf 'No staging deploy, remote D1 migration, workflow dispatch, or production action was performed.\n' >> "$GITHUB_STEP_SUMMARY"
