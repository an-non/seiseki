name: Recover mobile quantum preview safely

on:
  push:
    branches:
      - feature/opinion-network-preview
    paths:
      - preview/opinion-network/scripts/apply-mobile-fix.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiseki-opinion-preview-recovery
  cancel-in-progress: false

jobs:
  recover-mobile-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch with history
        uses: actions/checkout@v4
        with:
          ref: feature/opinion-network-preview
          fetch-depth: 0

      - name: Record GitHub state and restore known-good 3D source
        shell: bash
        run: |
          set -euo pipefail
          GOOD_COMMIT=80254a7826b9bb5dbfa10707852382204dbb8ef8
          GOOD_BLOB=f19b67d1b978a93edfaf96a5519b0a2e9ee2ac64
          FILE=preview/opinion-network/public/chunk-network-entanglement-preview.html
          printf '### Quantum preview preflight\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- GitHub HEAD before deploy: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- known-good commit: `%s`\n' "$GOOD_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- commits since known-good: `%s`\n' "$(git rev-list --count "$GOOD_COMMIT"..HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- changed paths since known-good:\n' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "$GOOD_COMMIT"..HEAD | sed 's/^/  - `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          git checkout "$GOOD_COMMIT" -- "$FILE"
          test "$(git hash-object "$FILE")" = "$GOOD_BLOB"
          grep -q 'Math.min(5000' "$FILE"
          grep -q 'generatePrototypeCandidates(topics, { uniqueCount:count, duplicateCount })' "$FILE"
          grep -q 'loading.hidden = true' "$FILE"
          grep -q 'animate();' "$FILE"

      - name: Apply mobile UI 10000-node and density glow patch
        shell: bash
        run: |
          set -euo pipefail
          node preview/opinion-network/scripts/apply-mobile-fix.mjs
          FILE=preview/opinion-network/public/chunk-network-entanglement-preview.html
          grep -q 'Math.min(10000' "$FILE"
          grep -q 'requested : 10000' "$FILE"
          grep -q 'prototype-10000' "$FILE"
          grep -q '10,000件の観測投影' "$FILE"
          grep -q 'const nodeCountScale = Math.cbrt(Math.max(1, model.nodes.length) / 5000);' "$FILE"
          grep -q 'displayRadiusBounds = Object.freeze({ min:14 \* displayScale, max:72 \* displayScale })' "$FILE"
          grep -q 'camera.position.set(0, 13 \* displayScale' "$FILE"
          grep -q 'const fitAllDistance = displayRadiusBounds.max' "$FILE"
          grep -q 'setPointer(event);' "$FILE"
          grep -q 'hovered = hitFromPointer();' "$FILE"
          grep -q 'camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, .1, 1800)' "$FILE"
          grep -q 'display:block; left:1px; right:auto; bottom:96px' "$FILE"
          grep -q 'width:min(58vw,240px); height:min(13vh,105px)' "$FILE"
          grep -q 'font-size:7px; line-height:1.2' "$FILE"
          grep -q 'background:transparent; box-shadow:none; backdrop-filter:none;' "$FILE"
          grep -q 'const relationGlowProfile = Object.freeze' "$FILE"
          grep -q 'referenceNodeDiameter:.32' "$FILE"
          grep -q 'outerWorldWidth:.48' "$FILE"
          grep -q 'const relationGlowOuterMaterial = new LineMaterial' "$FILE"
          grep -q 'const relationGlowOuterLines = new LineSegments2' "$FILE"
          grep -q 'relationGlowOuterMaterial.resolution.set(innerWidth, innerHeight)' "$FILE"
          grep -q 'Hiragino Sans' "$FILE"
          grep -q 'loading.hidden = true' "$FILE"
          grep -q 'animate();' "$FILE"
          node --check preview/opinion-network/public/quantum-entanglement-engine.mjs
          node --check preview/opinion-network/worker.mjs

      - name: Commit 10000-node density-glow preview source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/opinion-network/public/chunk-network-entanglement-preview.html
          if ! git diff --cached --quiet; then
            git commit -m "Add density-accumulating relation glow to 10000-node preview"
            git push origin HEAD:feature/opinion-network-preview
          fi

      - name: Prepare exact same-origin Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack three@0.185.1 --pack-destination "$tmp" >/dev/null
          tar -xzf "$tmp"/three-*.tgz -C "$tmp"
          src="$tmp/package"
          dst="preview/opinion-network/public/node_modules/three"
          rm -rf "$dst"
          mkdir -p "$dst/build" "$dst/examples/jsm/controls" "$dst/examples/jsm/lines" "$dst/examples/jsm/postprocessing" "$dst/examples/jsm/shaders"
          cp "$src/build/three.module.js" "$src/build/three.core.js" "$dst/build/"
          cp "$src/examples/jsm/controls/OrbitControls.js" "$dst/examples/jsm/controls/"
          cp "$src/examples/jsm/lines/LineMaterial.js" "$src/examples/jsm/lines/LineSegments2.js" "$src/examples/jsm/lines/LineSegmentsGeometry.js" "$dst/examples/jsm/lines/"
          cp "$src/examples/jsm/postprocessing/EffectComposer.js" "$src/examples/jsm/postprocessing/MaskPass.js" "$src/examples/jsm/postprocessing/OutputPass.js" "$src/examples/jsm/postprocessing/Pass.js" "$src/examples/jsm/postprocessing/RenderPass.js" "$src/examples/jsm/postprocessing/ShaderPass.js" "$src/examples/jsm/postprocessing/UnrealBloomPass.js" "$dst/examples/jsm/postprocessing/"
          cp "$src/examples/jsm/shaders/CopyShader.js" "$src/examples/jsm/shaders/LuminosityHighPassShader.js" "$src/examples/jsm/shaders/OutputShader.js" "$dst/examples/jsm/shaders/"
          test -s "$dst/build/three.module.js"
          test -s "$dst/examples/jsm/postprocessing/UnrealBloomPass.js"

      - name: Inspect current Cloudflare preview deployments
        id: inspect
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: preview/opinion-network
          command: deployments list

      - name: Record Cloudflare state before write
        shell: bash
        run: |
          printf '\n### Cloudflare before deploy\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '${{ steps.inspect.outputs.command-output }}' | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          printf '\nTarget is only `seiseki-opinion-network-preview`. SEISEKI staging API, D1, queues and production are excluded.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview with conflict guard
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: preview/opinion-network
          command: deploy --strict

      - name: Record successful deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview/opinion-network/public/node_modules
          cat > preview/opinion-network/DEPLOYMENT_STATUS.md <<EOF
          # Opinion network preview deployment

          - credentials_ready: true
          - deploy_outcome: success
          - deployment_url: ${{ steps.deploy.outputs.deployment-url }}
          - worker: seiseki-opinion-network-preview
          - source_branch: feature/opinion-network-preview
          - source_head: $(git rev-parse HEAD)
          - known_good_base: 80254a7826b9bb5dbfa10707852382204dbb8ef8
          - runtime_three: 0.185.1
          - module_loading: same-origin-importmap
          - mobile_ui: enabled
          - mobile_tap_raycast: enabled
          - mobile_fit_all_zoom: enabled
          - mobile_trace_panel: transparent-compact-v2
          - demo_count_default: 10000
          - count_scaling_base: 5000
          - spatial_scaling: existing-displayScale
          - relation_density_glow: additive-shared-geometry-v1
          - relation_glow_reference_node_diameter: 0.32
          - relation_glow_outer_world_width: 0.48
          - relation_base_opacity_dark: 0.12
          - cloudflare_conflict_guard: strict
          - existing_seiseki_staging_touched: false
          - d1_migrations_run: false
          - production_touched: false
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/opinion-network/DEPLOYMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record relation density glow preview deployment"
            git push origin HEAD:feature/opinion-network-preview
          fi
