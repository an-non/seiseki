name: Response D1 read-only audit

on:
  push:
    branches:
      - feature/response-update-auth-revision-20260825
    paths:
      - .github/workflows/response-d1-readonly-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-response-d1-readonly-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify configured database identities
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"database_name": "seiseki-db"' cloudflare/wrangler.jsonc
          grep -q '"database_id": "8ad5e023-3588-490c-ba61-3f180f8b2887"' cloudflare/wrangler.jsonc
          grep -q '"database_name": "seiseki-db-staging"' cloudflare/wrangler.jsonc
          grep -q '"database_id": "64468050-a8e5-4a5f-86a7-3dfca661df55"' cloudflare/wrangler.jsonc

      - name: Probe Cloudflare capability matrix without mutation
        id: probe
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -u
          CONFIG_ACCOUNT_ID=$(node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc', 'utf8');
          const match = text.match(/"account_id"\s*:\s*"([^"]+)"/);
          process.stdout.write(match ? match[1] : '');
          NODE
          )

          if [ -n "$CONFIG_ACCOUNT_ID" ] && [ "${CLOUDFLARE_ACCOUNT_ID:-}" = "$CONFIG_ACCOUNT_ID" ]; then
            ACCOUNT_MATCH=true
          else
            ACCOUNT_MATCH=false
          fi

          TOKEN_HTTP=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          TOKEN_ACTIVE=$(node - <<'NODE'
          const fs = require('fs');
          try {
            const x = JSON.parse(fs.readFileSync('/tmp/cf-token.json', 'utf8'));
            process.stdout.write(String(Boolean(x.success && x.result && x.result.status === 'active')));
          } catch { process.stdout.write('false'); }
          NODE
          )

          set +e
          npx wrangler deployments list >/tmp/cf-deployments.out 2>/tmp/cf-deployments.err
          DEPLOYMENTS_EXIT=$?
          npx wrangler queues list >/tmp/cf-queues.out 2>/tmp/cf-queues.err
          QUEUES_EXIT=$?
          npx wrangler d1 list --json >/tmp/cf-d1-list.out 2>/tmp/cf-d1-list.err
          D1_LIST_EXIT=$?
          set -e

          PROD_D1_HTTP=$(curl -sS -o /tmp/cf-prod-d1.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CONFIG_ACCOUNT_ID}/d1/database/8ad5e023-3588-490c-ba61-3f180f8b2887" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          STAGING_D1_HTTP=$(curl -sS -o /tmp/cf-staging-d1.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CONFIG_ACCOUNT_ID}/d1/database/64468050-a8e5-4a5f-86a7-3dfca661df55" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)

          echo "configured_account_matches_secret=${ACCOUNT_MATCH}"
          echo "token_verify_http=${TOKEN_HTTP}"
          echo "token_active=${TOKEN_ACTIVE}"
          echo "workers_deployments_exit=${DEPLOYMENTS_EXIT}"
          echo "queues_list_exit=${QUEUES_EXIT}"
          echo "d1_list_exit=${D1_LIST_EXIT}"
          echo "production_d1_metadata_http=${PROD_D1_HTTP}"
          echo "staging_d1_metadata_http=${STAGING_D1_HTTP}"

          {
            echo "account_match=${ACCOUNT_MATCH}"
            echo "token_http=${TOKEN_HTTP}"
            echo "token_active=${TOKEN_ACTIVE}"
            echo "deployments_exit=${DEPLOYMENTS_EXIT}"
            echo "queues_exit=${QUEUES_EXIT}"
            echo "d1_list_exit=${D1_LIST_EXIT}"
            echo "prod_d1_http=${PROD_D1_HTTP}"
            echo "staging_d1_http=${STAGING_D1_HTTP}"
          } >> "$GITHUB_OUTPUT"

          if [ "$ACCOUNT_MATCH" != true ] || [ "$TOKEN_HTTP" != 200 ] || [ "$TOKEN_ACTIVE" != true ]; then
            echo "BLOCKED: base Cloudflare credential/account configuration is invalid"
            exit 1
          fi

          if [ "$D1_LIST_EXIT" -ne 0 ] || [ "$PROD_D1_HTTP" != 200 ] || [ "$STAGING_D1_HTTP" != 200 ]; then
            echo "BLOCKED: D1 capability is unavailable; SQL audit intentionally skipped"
            exit 1
          fi

      - name: Inspect production and staging D1 read-only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          query() {
            local db="$1"
            local label="$2"
            local sql="$3"
            echo "===== ${db}: ${label} ====="
            npx wrangler d1 execute "$db" --remote --command "$sql" --json
          }

          inspect_db() {
            local db="$1"
            query "$db" "table list" "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"
            query "$db" "foreign key check" "PRAGMA foreign_key_check;"
            query "$db" "account duplicate count" "SELECT COUNT(*) AS duplicate_accounts FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1);"
            query "$db" "account duplicate groups" "SELECT account_id, COUNT(*) AS response_count FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1 ORDER BY response_count DESC LIMIT 20;"
            query "$db" "row counts" "SELECT (SELECT COUNT(*) FROM responses) AS responses, (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM account_responses) AS account_links, (SELECT COUNT(*) FROM analysis_runs) AS analysis_runs, (SELECT COUNT(*) FROM opinion_chunks) AS opinion_chunks;"
            query "$db" "unlinked responses" "SELECT COUNT(*) AS responses_without_account_link FROM responses r LEFT JOIN account_responses ar ON ar.response_id = r.id WHERE ar.response_id IS NULL;"
            query "$db" "broken account links" "SELECT COUNT(*) AS broken_account_links FROM account_responses ar LEFT JOIN accounts a ON a.id=ar.account_id LEFT JOIN responses r ON r.id=ar.response_id WHERE a.id IS NULL OR r.id IS NULL;"
            query "$db" "responses schema" "PRAGMA table_info('responses');"
            query "$db" "analysis_runs schema" "PRAGMA table_info('analysis_runs');"
            query "$db" "account_responses indexes" "PRAGMA index_list('account_responses');"
            query "$db" "analysis_runs indexes" "PRAGMA index_list('analysis_runs');"
            query "$db" "migration tables" "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%migration%' ORDER BY name;"
          }

          inspect_db "seiseki-db"
          inspect_db "seiseki-db-staging"

      - name: Record audit gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Response D1 read-only audit'
            echo
            echo '- Scope: production + staging D1'
            echo '- Operation: capability probes + SELECT / PRAGMA only'
            echo '- Migration applied: no'
            echo '- Worker deploy: no'
            echo '- Data mutation: no'
            echo "- account matches config: ${{ steps.probe.outputs.account_match || 'unknown' }}"
            echo "- token active: ${{ steps.probe.outputs.token_active || 'unknown' }}"
            echo "- Workers deployments probe exit: ${{ steps.probe.outputs.deployments_exit || 'unknown' }}"
            echo "- Queues list probe exit: ${{ steps.probe.outputs.queues_exit || 'unknown' }}"
            echo "- D1 list probe exit: ${{ steps.probe.outputs.d1_list_exit || 'unknown' }}"
            echo "- production D1 metadata HTTP: ${{ steps.probe.outputs.prod_d1_http || 'unknown' }}"
            echo "- staging D1 metadata HTTP: ${{ steps.probe.outputs.staging_d1_http || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"
