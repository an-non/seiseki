name: Fix dashboard stats compatibility alias 20260830

on:
  push:
    branches:
      - fix/mobile-tree-fit-dashboard-20260830
    paths:
      - .github/workflows/fix-dashboard-stats-alias-20260830.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-tree-fit-dashboard-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            local/package-lock.json
            cloudflare/package-lock.json
      - name: Apply compatibility alias and regression assertion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const ui='core/ui.jsx';
          let s=fs.readFileSync(ui,'utf8');
          const old='const VIEW_PATH_ALIASES = { "/app/network": "tree" };';
          const neu='const VIEW_PATH_ALIASES = { "/app/network": "tree", "/app/stats": "dash" };';
          if(!s.includes(old)) throw new Error('route alias anchor mismatch');
          s=s.replace(old,neu);
          fs.writeFileSync(ui,s);

          const test='tests/page-routing.test.mjs';
          let t=fs.readFileSync(test,'utf8');
          const anchor='  assert.doesNotMatch(ui, /path === "\\/app\\/dashboard"[^\\n]+return "home"/);';
          const replacement=anchor+'\n  assert.match(ui, /"\\/app\\/stats": "dash"/);';
          if(!t.includes(anchor)) throw new Error('routing test anchor mismatch');
          t=t.replace(anchor,replacement);
          fs.writeFileSync(test,t);
          NODE
          node scripts/build-app.mjs
          git diff -- app/seiseki.jsx core/ui.jsx local/src/App.jsx tests/page-routing.test.mjs
      - name: Regression
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix local ci --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          VITE_SEISEKI_API_BASE="https://seiseki-api.tokyo-odh-129.workers.dev" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm --prefix local run build
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/ui.jsx app/seiseki.jsx local/src/App.jsx tests/page-routing.test.mjs
          git commit -m "Restore legacy stats route for dashboard"
          git push origin HEAD:fix/mobile-tree-fit-dashboard-20260830
