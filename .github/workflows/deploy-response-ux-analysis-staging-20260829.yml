name: Response UX and analysis trace staging 20260829

on:
  push:
    branches:
      - codex/response-ux-analysis-trace-20260829
    paths:
      - .github/workflows/deploy-response-ux-analysis-staging-20260829.yml
      - scripts/staging-response-ux-analysis-e2e-20260829.mjs

permissions:
  contents: read

concurrency:
  group: seiseki-response-ux-analysis-staging-20260829
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAGING_BASE: https://seiseki-api-staging.tokyo-odh-129.workers.dev
      VITE_SEISEKI_API_BASE: https://seiseki-api-staging.tokyo-odh-129.workers.dev
      VITE_SEISEKI_API_REQUIRED: 'false'
      VITE_SEISEKI_RUNTIME_MODE: staging
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            local/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          npm --prefix local ci --no-audit --no-fund

      - name: Read-only staging D1 preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "seiseki-api-staging"' wrangler.jsonc
          grep -q '"database_name": "seiseki-db-staging"' wrangler.jsonc
          grep -q '"database_id": "64468050-a8e5-4a5f-86a7-3dfca661df55"' wrangler.jsonc
          npx wrangler d1 execute DB --env staging --remote \
            --command "SELECT name FROM pragma_table_info('responses') WHERE name IN ('revision','updated_at','follow_up_text') ORDER BY name; SELECT COUNT(*) AS duplicate_groups FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1); SELECT key FROM app_config WHERE key='questions'; PRAGMA foreign_key_check;" \
            --json > /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          const columns = (result?.[0]?.results || result?.[0]?.result || []).map(row => row.name);
          const dup = result?.[1]?.results?.[0] || result?.[1]?.result?.[0] || {};
          const cfg = result?.[2]?.results || result?.[2]?.result || [];
          const fk = result?.[3]?.results || result?.[3]?.result || [];
          for (const name of ['revision','updated_at','follow_up_text']) if (!columns.includes(name)) throw new Error(`missing staging column: ${name}`);
          if (Number(dup.duplicate_groups) !== 0) throw new Error('duplicate account-response ownership exists');
          if (!cfg.some(row => row.key === 'questions')) throw new Error('questions config missing');
          if (fk.length) throw new Error(`foreign-key violations before deploy: ${fk.length}`);
          console.log('staging D1 preflight PASS');
          NODE

      - name: Verify source and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          git diff --exit-code -- app/seiseki.jsx local/src/App.jsx
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          npm --prefix local run build:staging

      - name: Guard unrelated surfaces and privacy
        shell: bash
        run: |
          set -euo pipefail
          BASE=37599c45a2944998ec62b0ae2d6d314a00788148
          git diff --exit-code "$BASE" -- core/logic.js local/chunk-network-entanglement-preview.html local/vite.config.js
          grep -Fq 'STAGING_ADMIN_ENABLED' cloudflare/wrangler.jsonc
          if grep -R -Fq 'storeLocalProvisionalAnalysis' cloudflare/src; then
            echo 'provisional local analysis must not be deployed into formal D1 path' >&2
            exit 1
          fi
          grep -Fq 'raw: analysisValueSnapshot(rawValues)' cloudflare/src/analysis.mjs
          grep -Fq '本文やAIの生テキストは保存せず' core/ui.jsx
          grep -Fq 'surveyEdit: "/survey/edit-initial"' core/ui.jsx
          grep -Fq 'followupEdit: "/survey/follow-up/edit"' core/ui.jsx
          grep -Fq '回答全体を撤回する' core/ui.jsx
          grep -Fq '推定確信度' core/ui.jsx

      - name: Deploy Worker and UI to staging only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --strict 2>&1 | tee /tmp/deploy.log
          grep -E 'Current Version ID|Uploaded' /tmp/deploy.log || true

      - name: Live UX revision and analysis trace E2E with cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging-response-ux-analysis-e2e-20260829.mjs

      - name: Post-E2E staging integrity
        if: always()
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env staging --remote \
            --command "SELECT COUNT(*) AS duplicate_groups FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1); PRAGMA foreign_key_check;" \
            --json > /tmp/post.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/post.json','utf8'));
          const dup = result?.[0]?.results?.[0] || result?.[0]?.result?.[0] || {};
          const fk = result?.[1]?.results || result?.[1]?.result || [];
          if (Number(dup.duplicate_groups) !== 0) throw new Error('duplicate ownership after E2E');
          if (fk.length) throw new Error(`foreign-key violations after E2E: ${fk.length}`);
          console.log('post-E2E staging integrity PASS');
          NODE

      - name: Summary
        if: always()
        shell: bash
        run: |
          printf '\n### Response UX + analysis trace staging deploy\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- branch: `%s`\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- D1 migration: not applied\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- live E2E: direct edit routes + revision flow + numeric trace + cleanup\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- production: untouched\n' >> "$GITHUB_STEP_SUMMARY"
