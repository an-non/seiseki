name: Fix radial tree scale v2 20260830
on:
  push:
    branches: [fix/radial-tree-scale-20260830]
    paths: [.github/workflows/fix-radial-tree-scale-v2-20260830.yml]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/radial-tree-scale-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/ui.jsx'); s=p.read_text()
          a='  const S = 640, cx = S / 2, cy = S / 2;\n  const R0 = 62, R1 = 128, R2 = 218, R3 = 268;'
          b='  const branchLoad = Math.max(rt.ring2.length, rt.ring3.length);\n  const treeScale = Math.max(1, Math.min(1.9, 1 + Math.max(0, branchLoad - 18) * 0.018));\n  const R0 = 62;\n  const R1 = Math.round(128 * treeScale);\n  const R2 = Math.round(218 * treeScale);\n  const R3 = Math.round(268 * treeScale);\n  const S = Math.max(640, R3 * 2 + 84), cx = S / 2, cy = S / 2;'
          if s.count(a)!=1: raise SystemExit('geometry target mismatch')
          s=s.replace(a,b,1)
          a='style={{ width: "100%", maxWidth: 640, height: "auto", display: "block", margin: "0 auto" }}'
          b='style={{ width: S, maxWidth: "none", height: "auto", display: "block", margin: "0 auto" }}'
          start=s.index('function RadialTree'); pos=s.find(a,start)
          if pos<0: raise SystemExit('svg style target mismatch')
          s=s[:pos]+b+s[pos+len(a):]
          p.write_text(s)
          PY
          git diff --check
      - name: Test and build
        run: |
          npm --prefix local ci --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          node scripts/build-app.mjs
          node tests/test.js
          npm --prefix cloudflare test
          VITE_SEISEKI_API_BASE="https://seiseki-api.tokyo-odh-129.workers.dev" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm --prefix local run build
      - name: Commit
        run: |
          rm -rf local/node_modules local/dist cloudflare/node_modules
          git diff --name-only | sort > /tmp/a
          printf '%s\n' app/seiseki.jsx core/ui.jsx local/src/App.jsx | sort > /tmp/b
          diff -u /tmp/b /tmp/a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/seiseki.jsx core/ui.jsx local/src/App.jsx
          git commit -m 'Scale radial opinion tree with branch density'
          git push origin HEAD:fix/radial-tree-scale-20260830
