name: Fix mobile stats and network 20260830

on:
  push:
    branches:
      - fix/mobile-stats-network-20260830
    paths:
      - .github/workflows/fix-mobile-stats-network-20260830.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-stats-network-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            local/package-lock.json
            cloudflare/package-lock.json

      - name: Patch canonical UI sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/ui.jsx')
          s=p.read_text()

          old='''      <Card>\n        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>{q ? q.text : ""}</div>\n        <ResponsiveContainer width="100%" height={optOrder.length * 40 + 24}>'''
          new='''      <Card style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>\n        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>{q ? q.text : ""}</div>\n        <ResponsiveContainer width="100%" minWidth={620} height={optOrder.length * 40 + 24}>'''
          if s.count(old)!=1: raise SystemExit('distribution target mismatch')
          s=s.replace(old,new,1)

          old='''      <Card>\n        {!hasCross ? ('''
          new='''      <Card style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>\n        {!hasCross ? ('''
          if s.count(old)!=1: raise SystemExit('cross card target mismatch')
          s=s.replace(old,new,1)
          old='<ResponsiveContainer width="100%" height={crossData.length * 42 + 34}>'
          new='<ResponsiveContainer width="100%" minWidth={720} height={crossData.length * 42 + 34}>'
          if s.count(old)!=1: raise SystemExit('cross chart target mismatch')
          s=s.replace(old,new,1)

          old='''  const gp = selOpt ? paramView(qa.params[selOpt]) : null;\n  const selColor = (q && q.id === ANCHOR_QID && SUP_COLORS[selOpt]) || C.green;'''
          new='''  const groupOpt = selOpt || optOrder.find(o => (qa.counts[o] || 0) > 0) || "";\n  const gp = groupOpt ? paramView(qa.params[groupOpt]) : null;\n  const selColor = (q && q.id === ANCHOR_QID && SUP_COLORS[groupOpt]) || C.green;'''
          if s.count(old)!=1: raise SystemExit('group default target mismatch')
          s=s.replace(old,new,1)
          for old,new in [
            ('active={selOpt === o} count={qa.counts[o] || 0}', 'active={groupOpt === o} count={qa.counts[o] || 0}'),
            ('name={"「" + selOpt + "」グループ"}', 'name={"「" + groupOpt + "」グループ"}'),
            ('「{selOpt}」グループの平均', '「{groupOpt}」グループの平均'),
            (') : selOpt ? (\n        <Card pad={14}><div style={{ fontSize: 13, color: C.sub }}>「{selOpt}」にはまだ解析済みの回答がありません。</div></Card>', ') : groupOpt ? (\n        <Card pad={14}><div style={{ fontSize: 13, color: C.sub }}>「{groupOpt}」にはまだ解析済みの回答がありません。</div></Card>')
          ]:
            if old not in s: raise SystemExit('group render target mismatch: '+old[:30])
            s=s.replace(old,new,1)

          # Time-series stays in the same DOM, but gets a minimum chart width so labels do not collapse on phones.
          old='<ResponsiveContainer width="100%" height={260}>'
          if old in s:
            s=s.replace(old, '<ResponsiveContainer width="100%" minWidth={720} height={260}>', 1)
          old='<ResponsiveContainer width="100%" height={300}>'
          if old in s:
            s=s.replace(old, '<ResponsiveContainer width="100%" minWidth={720} height={300}>', 1)

          p.write_text(s)

          p=Path('core/opinion-network.jsx')
          s=p.read_text()
          old='''  const [phase, setPhase] = useState(0);\n  const [motion] = useState(() => typeof window === "undefined" || !window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches);\n  const placed = useMemo(() => networkLayout(data.nodes, 340, 340, 104, 274), [data]);'''
          new='''  const [phase, setPhase] = useState(0);\n  const [motion] = useState(() => typeof window === "undefined" || !window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches);\n  const networkSize = Math.max(680, Math.min(1200, 680 + Math.max(0, data.nodes.length - 12) * 18));\n  const networkOuterRadius = networkSize / 2 - 70;\n  const networkInnerRadius = Math.max(104, networkOuterRadius * 0.38);\n  const placed = useMemo(() => networkLayout(data.nodes, networkSize / 2, networkSize / 2, networkInnerRadius, networkOuterRadius), [data, networkSize, networkInnerRadius, networkOuterRadius]);'''
          if s.count(old)!=1: raise SystemExit('network layout target mismatch')
          s=s.replace(old,new,1)
          if 'const S = 680, cx = S / 2, cy = S / 2;' not in s: raise SystemExit('network size target mismatch')
          s=s.replace('const S = 680, cx = S / 2, cy = S / 2;', 'const S = networkSize, cx = S / 2, cy = S / 2;', 1)
          old='''  return (\n    <svg viewBox={"0 0 " + S + " " + S} style={{ width: "100%", maxWidth: 680, height: "auto", display: "block", margin: "0 auto" }}>'''
          new='''  return (\n    <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 4 }}>\n    <svg viewBox={"0 0 " + S + " " + S} style={{ width: S, maxWidth: "none", height: "auto", display: "block", margin: "0 auto" }}>'''
          if s.count(old)!=1: raise SystemExit('network svg opening target mismatch')
          s=s.replace(old,new,1)
          old='''    </svg>\n  );'''
          new='''    </svg>\n    </div>\n  );'''
          if s.count(old)!=1: raise SystemExit('network svg closing target mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check

      - name: Focused contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const ui=fs.readFileSync('core/ui.jsx','utf8'),net=fs.readFileSync('core/opinion-network.jsx','utf8');
          const checks={distribution:ui.includes('minWidth={620}'),cross:ui.includes('minWidth={720}'),scroll:(ui.match(/WebkitOverflowScrolling: "touch"/g)||[]).length>=2,group:ui.includes('const groupOpt = selOpt || optOrder.find'),networkSize:net.includes('data.nodes.length - 12'),networkRadius:net.includes('networkOuterRadius'),networkScroll:net.includes('width: S, maxWidth: "none"')};
          for(const [k,v] of Object.entries(checks)){if(!v)throw new Error(k);console.log('ok',k)}
          NODE

      - name: Install regenerate and test
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix local ci --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          node scripts/build-app.mjs
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          VITE_SEISEKI_API_BASE="https://seiseki-api.tokyo-odh-129.workers.dev" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm --prefix local run build

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf local/node_modules local/dist cloudflare/node_modules
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' app/seiseki.jsx core/opinion-network.jsx core/ui.jsx local/src/App.jsx | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/seiseki.jsx core/opinion-network.jsx core/ui.jsx local/src/App.jsx
          git commit -m 'Improve mobile stats and scale opinion network'
          git push origin HEAD:fix/mobile-stats-network-20260830
