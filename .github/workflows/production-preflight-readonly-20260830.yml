name: Production read-only preflight 20260830

on:
  push:
    branches:
      - release/production-20260830
    paths:
      - .github/workflows/production-preflight-readonly-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-production-20260830
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RC_SHA: f2b9d0a6b3642f4c3b064f64c47c13726cc8127c
      PRODUCTION_URL: https://seiseki-api.tokyo-odh-129.workers.dev
      EXPECTED_DB_ID: 8ad5e023-3588-490c-ba61-3f180f8b2887
    steps:
      - name: Checkout exact application RC
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
          fetch-depth: 0

      - name: Verify exact RC and repository invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc', 'utf8'));
          const fail = m => { throw new Error(m); };
          if (c.name !== 'seiseki-api') fail(`worker mismatch: ${c.name}`);
          if (c.d1_databases?.[0]?.database_name !== 'seiseki-db') fail('production D1 name mismatch');
          if (c.d1_databases?.[0]?.database_id !== process.env.EXPECTED_DB_ID) fail('production D1 id mismatch');
          if (c.ai?.binding !== 'AI') fail('Workers AI binding missing');
          if (c.queues?.producers?.[0]?.queue !== 'seiseki-analysis') fail('production queue producer mismatch');
          const consumer = c.queues?.consumers?.find(x => x.queue === 'seiseki-analysis');
          if (!consumer) fail('production queue consumer missing');
          if (consumer.dead_letter_queue !== 'seiseki-analysis-dlq') fail('production DLQ mismatch');
          if (Number(consumer.max_retries) !== 3) fail('production queue retry policy mismatch');
          if (c.vars?.ALLOWED_ORIGINS !== process.env.PRODUCTION_URL) fail('production origin mismatch');
          if (c.vars?.PASSWORD_ITERATIONS !== '120000') fail('production password KDF mismatch');
          if (c.vars?.AI_ANALYSIS_ENABLED !== 'true') fail('production AI disabled unexpectedly');
          console.log('production wrangler invariants PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            local/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          npm --prefix local ci --no-audit --no-fund

      - name: Verify application and Worker contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          git diff --exit-code -- app/seiseki.jsx local/src/App.jsx
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js

      - name: Build production assets
        working-directory: local
        env:
          VITE_SEISEKI_API_BASE: https://seiseki-api.tokyo-odh-129.workers.dev
          VITE_SEISEKI_API_REQUIRED: 'true'
          VITE_SEISEKI_RUNTIME_MODE: production
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -f dist/model/manifest.json
          grep -lq 'seiseki-api.tokyo-odh-129.workers.dev' dist/assets/*.js

      - name: Wrangler production dry run
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -s ../local/dist/index.html
          npx wrangler deploy --dry-run --outdir /tmp/seiseki-production-dry-run
          test -d /tmp/seiseki-production-dry-run

      - name: Confirm Cloudflare credentials are present
        shell: bash
        env:
          DB_API_TOKEN: ${{ secrets.DB_API }}
          DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${DB_API_TOKEN:-}" || { echo 'DB_API is missing' >&2; exit 41; }
          test -n "${DEPLOY_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing' >&2; exit 42; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing' >&2; exit 43; }
          echo 'required Cloudflare credentials are present; values not printed'

      - name: Read-only production D1 identity and migration preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const hit = Array.isArray(rows) ? rows.find(x => x?.name === 'seiseki-db') : null;
          const id = hit?.uuid || hit?.id || '';
          if (!hit) throw new Error('production D1 seiseki-db not found');
          if (id !== process.env.EXPECTED_DB_ID) throw new Error(`production D1 id mismatch: ${id}`);
          console.log(`production D1 identity PASS: ${id}`);
          NODE

          npx wrangler d1 migrations list seiseki-db --remote | tee /tmp/migrations-before.txt
          grep -oE '000[0-9]_[A-Za-z0-9_.-]+\.sql' /tmp/migrations-before.txt | sort -u > /tmp/pending.txt || true
          cat > /tmp/expected-pending.txt <<'EOF'
          0006_response_access_revision.sql
          0007_response_updated_at.sql
          0008_questionnaire_seven_structured.sql
          0008_response_follow_up_text.sql
          EOF
          sed -i 's/^          //' /tmp/expected-pending.txt
          diff -u /tmp/expected-pending.txt /tmp/pending.txt

      - name: Read-only production D1 integrity preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute seiseki-db --remote --command "SELECT COUNT(*) AS n FROM accounts; SELECT COUNT(*) AS n FROM responses; SELECT COUNT(*) AS n FROM account_responses; SELECT COUNT(*) AS n FROM analysis_runs; SELECT COUNT(*) AS n FROM opinion_chunks; SELECT COUNT(*) AS duplicate_groups FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1); PRAGMA foreign_key_check; SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='response_access'; SELECT name FROM pragma_table_info('responses') WHERE name IN ('revision','updated_at','follow_up_text') ORDER BY name; SELECT length(value_json) AS question_bytes FROM app_config WHERE key='questions';" --json > /tmp/d1-preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/d1-preflight.json','utf8'));
          const rows = i => x?.[i]?.results || x?.[i]?.result || [];
          const scalar = (i, key='n') => Number(rows(i)?.[0]?.[key] ?? NaN);
          const counts = {
            accounts: scalar(0), responses: scalar(1), accountResponses: scalar(2),
            analysisRuns: scalar(3), opinionChunks: scalar(4)
          };
          if (Object.values(counts).some(v => !Number.isFinite(v))) throw new Error('production row-count query malformed');
          if (scalar(5, 'duplicate_groups') !== 0) throw new Error('duplicate account-response ownership exists');
          if (rows(6).length !== 0) throw new Error(`foreign-key violations: ${rows(6).length}`);
          if (scalar(7) !== 0) throw new Error('response_access already exists although migration is pending');
          const preColumns = rows(8).map(r => r.name).filter(Boolean);
          if (preColumns.length !== 0) throw new Error(`partially applied response schema detected: ${preColumns.join(',')}`);
          const questionBytes = Number(rows(9)?.[0]?.question_bytes ?? 0);
          console.log(JSON.stringify({counts, duplicateGroups: 0, foreignKeyViolations: 0, questionBytes}));
          NODE

      - name: Read-only production Queue and deployment preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler queues list | tee /tmp/queues.txt
          grep -Eq '(^|[[:space:]|])seiseki-analysis([[:space:]|]|$)' /tmp/queues.txt
          npx wrangler queues consumer list seiseki-analysis --json > /tmp/consumers.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/consumers.json','utf8'));
          const text = JSON.stringify(x);
          if (!text.includes('seiseki-api')) throw new Error('seiseki-api queue consumer not found');
          if (!text.includes('seiseki-analysis-dlq')) throw new Error('production dead-letter queue not visible in consumer configuration');
          console.log('production queue/DLQ consumer PASS');
          NODE
          npx wrangler deployments list --name seiseki-api --json > /tmp/deployments-before.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const n = Array.isArray(x) ? x.length : Array.isArray(x?.result) ? x.result.length : 0;
          if (n < 1) throw new Error('no production Worker deployments found');
          console.log(`production deployments visible: ${n}`);
          NODE

      - name: Preflight summary
        if: always()
        shell: bash
        run: |
          {
            echo '### SEISEKI production read-only preflight'
            echo
            echo "- application RC: \`$RC_SHA\`"
            echo '- production writes: none'
            echo '- expected pending migrations: 0006, 0007, 0008 questionnaire, 0008 follow-up'
            echo '- checks: app/tests/build, Wrangler dry-run, D1 identity/integrity, Queue/DLQ, existing Worker deployment'
            echo '- next gate: migration workflow is not present in this run and cannot execute here'
          } >> "$GITHUB_STEP_SUMMARY"
