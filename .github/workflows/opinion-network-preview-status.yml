name: Verify SEISEKI quantum app integration

on:
  push:
    branches:
      - feature/quantum-app-integration
    paths:
      - integration/VERIFY_TRIGGER

permissions:
  contents: write

jobs:
  verify-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/quantum-app-integration
          fetch-depth: 0

      - name: Reconstruct integration source
        id: reconstruct
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap
          cat bootstrap/part-* > /tmp/seiseki-integration-source.b64
          base64 --decode /tmp/seiseki-integration-source.b64 > /tmp/seiseki-integration-source.tar.xz
          tar -tJf /tmp/seiseki-integration-source.tar.xz >/dev/null
          tar -xJf /tmp/seiseki-integration-source.tar.xz -C .
          echo "archive_sha256=$(sha256sum /tmp/seiseki-integration-source.tar.xz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify protected files and application tests
        id: app_tests
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f DEPLOYMENT_SAFETY.md
          test -d preview/opinion-network
          grep -q 'without automatic Cloudflare deployment' README.md
          grep -q 'Do not run D1 migrations' DEPLOYMENT_SAFETY.md
          test ! -e .env
          test ! -e cloudflare/.env.staging
          test ! -d local/node_modules
          test ! -d cloudflare/node_modules
          test ! -d cloudflare/.wrangler
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          node tests/quantum-entanglement-engine.test.mjs

      - name: Verify Cloudflare source only
        id: cloudflare_tests
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Fresh install and staging Vite build
        id: vite_build
        if: steps.reconstruct.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd local
          npm ci --no-audit --no-fund
          npm run build:staging
          test -s dist/index.html
          test -d dist/assets
          echo "build_index_sha256=$(sha256sum dist/index.html | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          find dist -maxdepth 2 -type f -print | sort

      - name: Record verification result
        if: always()
        shell: bash
        env:
          RECONSTRUCT: ${{ steps.reconstruct.outcome }}
          APP_TESTS: ${{ steps.app_tests.outcome }}
          CLOUDFLARE_TESTS: ${{ steps.cloudflare_tests.outcome }}
          VITE_BUILD: ${{ steps.vite_build.outcome }}
          ARCHIVE_SHA: ${{ steps.reconstruct.outputs.archive_sha256 }}
          BUILD_SHA: ${{ steps.vite_build.outputs.build_index_sha256 }}
        run: |
          set -euo pipefail
          result=failure
          if [ "$RECONSTRUCT" = success ] && [ "$APP_TESTS" = success ] && [ "$CLOUDFLARE_TESTS" = success ] && [ "$VITE_BUILD" = success ]; then
            result=success
          fi

          rm -rf local/dist local/node_modules cloudflare/node_modules
          cat > INTEGRATION_VERIFICATION.md <<EOF
          # SEISEKI integration verification

          - result: ${result}
          - source_branch: feature/quantum-app-integration
          - trigger_commit: ${GITHUB_SHA}
          - source_archive_sha256: ${ARCHIVE_SHA:-unavailable}
          - reconstruct_source: ${RECONSTRUCT:-unknown}
          - application_tests: ${APP_TESTS:-unknown}
          - cloudflare_source_tests: ${CLOUDFLARE_TESTS:-unknown}
          - fresh_vite_staging_build: ${VITE_BUILD:-unknown}
          - build_index_sha256: ${BUILD_SHA:-unavailable}
          - cloudflare_deploy_run: false
          - d1_migrations_run: false
          - staging_worker_touched: false
          - production_touched: false
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- INTEGRATION_VERIFICATION.md

          if [ "$result" = success ]; then
            git add -- .gitignore AGENTS.md CHANGELOG.md HANDOFF.md app cloudflare core docs legacy local production prototypes scripts tests
            git rm -r --ignore-unmatch bootstrap
          fi

          git commit -m "Record SEISEKI integration verification ${result}"
          git push origin HEAD:feature/quantum-app-integration

          if [ "$result" != success ]; then
            exit 1
          fi
