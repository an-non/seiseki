name: Deploy and record opinion preview status

on:
  push:
    branches:
      - feature/opinion-network-preview
    paths:
      - preview/opinion-network/DEPLOY_TRIGGER

permissions:
  contents: write

jobs:
  deploy-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opinion-network-preview
          fetch-depth: 0

      - name: Check Cloudflare credentials presence
        id: credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore relations1400 UI baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("preview/opinion-network/public/chunk-network-entanglement-preview.html")
          s = p.read_text()

          # Keep validation/provenance fixes, but restore the latest local relations1400 UI dimensions.
          replacements = {
            'right:20px;\n      top:96px;\n      bottom:auto;': 'right:20px;\n      bottom:20px;',
            'width:min(292px,calc(100% - 40px));': 'width:min(350px,calc(100% - 40px));',
            'min-height:92px;': 'min-height:112px;',
            'max-height:min(210px,calc(100vh - 190px));': 'max-height:min(260px,calc(100vh - 190px));',
            'padding:10px 12px;': 'padding:14px 15px;',
            '.details h2 { margin:0 0 5px; color:var(--ink); font-size:12px; }': '.details h2 { margin:0 0 7px; color:var(--ink); font-size:13px; }',
            '.details p { margin:0; color:var(--sub); font-size:10px; line-height:1.55; }': '.details p { margin:0; color:var(--sub); font-size:11px; line-height:1.7; }',
            '.details .generated { color:var(--ink); font-size:11px; }': '.details .generated { color:var(--ink); font-size:12px; }',
            '.details .result { margin-top:6px; color:var(--cyan); font:9px/1.45 "IBM Plex Mono",Consolas,monospace; }': '.details .result { margin-top:8px; color:var(--cyan); font:10px/1.55 "IBM Plex Mono",Consolas,monospace; }',
            '.details dl { display:grid; grid-template-columns:64px 1fr; gap:3px 7px; margin:8px 0 0; font-size:10px; }': '.details dl { display:grid; grid-template-columns:76px 1fr; gap:4px 8px; margin:10px 0 0; font-size:11px; }',
            'width:min(390px,calc(100% - 350px));': 'width:min(470px,calc(100% - 410px));',
            'height:min(40vh,360px);': 'height:min(56vh,540px);',
            'max-height:calc(100vh - 260px);': 'max-height:calc(100vh - 210px);',
            'font:9px/1.45 "IBM Plex Mono",Consolas,monospace;': 'font:10px/1.55 "IBM Plex Mono",Consolas,monospace;',
            '.trace header { position:static; display:flex; justify-content:flex-start; margin:0 0 5px; color:var(--cyan); }': '.trace header { position:static; display:flex; justify-content:space-between; margin:0 0 7px; color:var(--cyan); }',
            '.trace header span:last-child { display:none; }': '.trace header span:last-child { color:var(--sub); }',
            'const completed = activeEntry ? traceEntries.slice(-15) : traceEntries.slice(-16);': 'const completed = activeEntry ? traceEntries.slice(-23) : traceEntries.slice(-24);',
            'if (traceEntries.length > 16) traceEntries.shift();': 'if (traceEntries.length > 24) traceEntries.shift();'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Restore full trace wording from the latest relations1400 UI.
          s = s.replace(
              '        `$ mode=${mode} basis=${basis} epoch=${epoch}`\n      ];',
              '        `$ observe --mode ${mode} --basis ${basis} --epoch ${epoch}`,\n        `seed = ${observationSeed}`\n      ];'
          )
          s = s.replace(
              '          `weight = score*0.68 + group*0.22 + branch + jitter`,\n          `       = ${observed.observedWeight.toFixed(6)}`,',
              '          `weight = score*0.68 + group*0.22 + branch + jitter`,\n          `       = ${nodeScore.toFixed(6)}*0.68 + ${groupScore.toFixed(6)}*0.22 ${branchDelta >= 0 ? "+" : "-"} ${Math.abs(branchDelta).toFixed(2)} ${residual >= 0 ? "+" : "-"} ${Math.abs(residual).toFixed(6)}`,\n          `       = ${observed.observedWeight.toFixed(6)}`,'
          )
          s = s.replace('`distance = ${observed.distance.toFixed(6)}`', '`analysis_distance = ${observed.distance.toFixed(6)}  # layout unused`')
          s = s.replace('`radius = ${targetPositions[item.index].length().toFixed(6)}`', '`display_radius = ${targetPositions[item.index].length().toFixed(6)}  # deterministic spread`')
          s = s.replace(
              '        `radius = [${displayRadiusBounds.min.toFixed(0)}, ${displayRadiusBounds.max.toFixed(0)}]`,\n        `nodes = ${projection.nodes.length} / groups = ${projection.groups.length} / relations = ${projection.relations.length}`,',
              '        `analysis_distance = f(observed_weight)  # layout unused`,\n        `display_radius = hash(node, phase) -> [${displayRadiusBounds.min}, ${displayRadiusBounds.max}]`,\n        `nodes = ${projection.nodes.length} / groups = ${projection.groups.length} / relations = ${projection.relations.length}`,\n        `$ select <node>  # show substituted values`'
          )

          assert 'const maxPersistentRelations = 1400;' in s
          assert 'OBSERVATION TRACE' in s
          assert 'UnrealBloomPass' in s
          assert 'data-theme-choice="dark"' in s
          assert 'width:min(470px,calc(100% - 410px));' in s
          p.write_text(s)
          PY

      - name: Prepare same-origin Three.js runtime assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack three@0.185.1 --pack-destination "$tmp" >/dev/null
          tar -xzf "$tmp"/three-*.tgz -C "$tmp"
          src="$tmp/package"
          dst="preview/opinion-network/public/node_modules/three"
          rm -rf "$dst"
          mkdir -p "$dst/build" "$dst/examples/jsm/controls" "$dst/examples/jsm/lines" "$dst/examples/jsm/postprocessing" "$dst/examples/jsm/shaders"
          cp "$src/build/three.module.js" "$src/build/three.core.js" "$dst/build/"
          cp "$src/examples/jsm/controls/OrbitControls.js" "$dst/examples/jsm/controls/"
          cp "$src/examples/jsm/lines/LineMaterial.js" "$src/examples/jsm/lines/LineSegments2.js" "$src/examples/jsm/lines/LineSegmentsGeometry.js" "$dst/examples/jsm/lines/"
          cp "$src/examples/jsm/postprocessing/EffectComposer.js" "$src/examples/jsm/postprocessing/MaskPass.js" "$src/examples/jsm/postprocessing/OutputPass.js" "$src/examples/jsm/postprocessing/Pass.js" "$src/examples/jsm/postprocessing/RenderPass.js" "$src/examples/jsm/postprocessing/ShaderPass.js" "$src/examples/jsm/postprocessing/UnrealBloomPass.js" "$dst/examples/jsm/postprocessing/"
          cp "$src/examples/jsm/shaders/CopyShader.js" "$src/examples/jsm/shaders/LuminosityHighPassShader.js" "$src/examples/jsm/shaders/OutputShader.js" "$dst/examples/jsm/shaders/"
          test -s "$dst/build/three.module.js"

      - name: Deploy isolated Cloudflare preview
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: preview/opinion-network
          command: deploy

      - name: Record deployment status
        if: always()
        shell: bash
        env:
          CREDS_READY: ${{ steps.credentials.outputs.ready }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          rm -rf preview/opinion-network/public/node_modules
          {
            echo "# Opinion network preview deployment"
            echo
            echo "- credentials_ready: ${CREDS_READY:-false}"
            echo "- deploy_outcome: ${DEPLOY_OUTCOME:-not-run}"
            echo "- deployment_url: ${DEPLOY_URL:-}"
            echo "- worker: seiseki-opinion-network-preview"
            echo "- source_branch: feature/opinion-network-preview"
            echo "- trigger_commit: ${GITHUB_SHA}"
            echo "- module_loading: same-origin-importmap"
            echo "- ui_baseline: relations1400"
            echo "- demo_count_default: 5000"
            echo "- existing_seiseki_staging_touched: false"
            echo "- d1_migrations_run: false"
          } > preview/opinion-network/DEPLOYMENT_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview/opinion-network/public/chunk-network-entanglement-preview.html preview/opinion-network/DEPLOYMENT_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore relations1400 opinion preview UI"
          git push origin HEAD:feature/opinion-network-preview
