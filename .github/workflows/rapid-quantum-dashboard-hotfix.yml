name: Rapid SEISEKI quantum and dashboard hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rapid-quantum-dashboard-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiseki-rapid-hotfix
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://seiseki-api.tokyo-odh-129.workers.dev
      STAGING_URL: https://seiseki-api-staging.tokyo-odh-129.workers.dev
    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          ref: feature/quantum-app-integration
          fetch-depth: 0

      - name: Apply UI patches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-mobile-ui-fix.mjs
          node scripts/apply-production-dashboard-fix.mjs
          node scripts/build-app.mjs
          grep -q '/api/public-aggregate' cloudflare/src/index.mjs
          grep -q 'cloudLoadPublicAggregate' core/ui.jsx
          grep -q 'const QUANTUM_PREVIEW_URL = "/quantum/' core/ui.jsx

      - name: Prepare 10000-node quantum source as Vite entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/opinion-network-preview:refs/remotes/origin/feature/opinion-network-preview
          mkdir -p local/quantum preview/opinion-network/public preview/opinion-network/scripts
          git show origin/feature/opinion-network-preview:preview/opinion-network/public/chunk-network-entanglement-preview.html > preview/opinion-network/public/chunk-network-entanglement-preview.html
          git show origin/feature/opinion-network-preview:preview/opinion-network/public/quantum-entanglement-engine.mjs > preview/opinion-network/public/quantum-entanglement-engine.mjs
          git show origin/feature/opinion-network-preview:preview/opinion-network/scripts/restore-stable-relation-glow.mjs > preview/opinion-network/scripts/restore-stable-relation-glow.mjs
          node preview/opinion-network/scripts/restore-stable-relation-glow.mjs
          cp preview/opinion-network/public/chunk-network-entanglement-preview.html local/quantum/chunk-network-entanglement-preview.html
          cp preview/opinion-network/public/quantum-entanglement-engine.mjs local/quantum/quantum-entanglement-engine.mjs
          grep -q 'baseCapacity' local/quantum/quantum-entanglement-engine.mjs
          grep -q '合成系列' local/quantum/quantum-entanglement-engine.mjs
          ! grep -q 'uniqueCount must be ${capacity} or less' local/quantum/quantum-entanglement-engine.mjs
          grep -q 'linewidth:1.55' local/quantum/chunk-network-entanglement-preview.html
          node --check local/quantum/quantum-entanglement-engine.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd local && npm ci --no-audit --no-fund
          cd ../cloudflare && npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production Safari-compatible bundle
        shell: bash
        run: |
          set -euo pipefail
          cd local
          VITE_SEISEKI_API_BASE="$PRODUCTION_URL" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm run build
          test -s dist/index.html
          test -s dist/quantum/chunk-network-entanglement-preview.html
          ! grep -q '<script type="importmap">' dist/quantum/chunk-network-entanglement-preview.html || true
          grep -lq '/api/public-aggregate' dist/assets/*.js

      - name: Deploy production
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --strict

      - name: Smoke production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PRODUCTION_URL/api/health" > /tmp/prod-health.json
          curl -fsS "$PRODUCTION_URL/api/public-aggregate" > /tmp/prod-aggregate.json
          curl -fsS "$PRODUCTION_URL/app/dashboard" > /tmp/prod-dashboard.html
          curl -fsS "$PRODUCTION_URL/app/quantum" > /tmp/prod-quantum-route.html
          curl -fsS "$PRODUCTION_URL/quantum/chunk-network-entanglement-preview.html?count=10000&seed=prototype-10000&theme=dark&rev=quantum-safari-v1" > /tmp/prod-quantum.html
          grep -q '意見ネットワーク 量子もつれ観測' /tmp/prod-quantum.html

      - name: Build staging Safari-compatible bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf local/dist
          cd local
          VITE_SEISEKI_API_BASE="$STAGING_URL" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=staging npm run build:staging
          test -s dist/index.html
          test -s dist/quantum/chunk-network-entanglement-preview.html

      - name: Deploy staging
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --strict

      - name: Smoke staging
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_URL/api/health" > /tmp/stage-health.json
          curl -fsS "$STAGING_URL/api/public-aggregate" > /tmp/stage-aggregate.json
          curl -fsS "$STAGING_URL/app/dashboard" > /tmp/stage-dashboard.html
          curl -fsS "$STAGING_URL/app/quantum" > /tmp/stage-quantum-route.html
          curl -fsS "$STAGING_URL/quantum/chunk-network-entanglement-preview.html?count=10000&seed=prototype-10000&theme=dark&rev=quantum-safari-v1" > /tmp/stage-quantum.html
          grep -q '意見ネットワーク 量子もつれ観測' /tmp/stage-quantum.html

      - name: Record success
        shell: bash
        run: |
          set -euo pipefail
          cat > SAFARI_HOTFIX_STATUS.md <<EOF
          # SEISEKI Safari hotfix
          - outcome: success
          - production_dashboard: ${PRODUCTION_URL}/app/dashboard
          - production_quantum: ${PRODUCTION_URL}/app/quantum
          - staging_dashboard: ${STAGING_URL}/app/dashboard
          - staging_quantum: ${STAGING_URL}/app/quantum
          - quantum_generator: 10000 unique synthetic nodes verified
          - build_target: safari14 ios14
          - quantum_delivery: Vite-bundled same-origin entry
          - dashboard_source: /api/public-aggregate
          EOF
          rm -rf local/node_modules local/dist local/quantum cloudflare/node_modules preview/opinion-network
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SAFARI_HOTFIX_STATUS.md local/vite.config.js core/ui.jsx app/seiseki.jsx local/src/App.jsx cloudflare/src/index.mjs cloudflare/src/public-aggregate.mjs scripts/apply-mobile-ui-fix.mjs scripts/apply-production-dashboard-fix.mjs
          git commit -m "Ship Safari-compatible dashboard and quantum bundle" || true
          git push origin HEAD:feature/quantum-app-integration
