name: Response Phase 4 UI 20260826

on:
  push:
    branches:
      - feature/response-update-auth-revision-20260825
    paths:
      - scripts/apply-response-phase4-ui-20260826.py
      - .github/workflows/response-phase4-ui-20260826.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Apply Phase 4 UI
        run: python3 scripts/apply-response-phase4-ui-20260826.py
      - name: Build generated app copies
        run: node scripts/build-app.mjs
      - name: Verify Phase 4 UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudPatchFreeText' core/ui.jsx
          grep -q 'cloudPatchAnswers' core/ui.jsx
          grep -q 'cloudRequeueAnalysis' core/ui.jsx
          grep -q 'currentResponse && phase === "consent"' core/ui.jsx
          grep -q '自由記述を追記' core/ui.jsx
          grep -q '自由記述を修正' core/ui.jsx
          grep -q 'アンケート回答を修正' core/ui.jsx
          grep -q 'REVISION_CONFLICT' core/ui.jsx
          ! grep -q 'setAddendum' core/ui.jsx
          ! grep -q 'setLimit' core/ui.jsx
          git diff --check -- core/ui.jsx app/seiseki.jsx local/src/App.jsx
      - name: Existing core logic tests
        run: node tests/test.js
      - name: Route paths
        run: node --test --test-name-pattern='入口・回答・完了・本人・Admin' tests/page-routing.test.mjs
      - name: App view paths
        run: node --test --test-name-pattern='概要・集計・意見ツリー・意見一覧' tests/page-routing.test.mjs
      - name: Browser history routing
        run: node --test --test-name-pattern='画面遷移はブラウザ履歴' tests/page-routing.test.mjs
      - name: Admin navigation isolation
        run: node --test --test-name-pattern='Adminは通常ナビ' tests/page-routing.test.mjs
      - name: Survey navigation order
        run: node --test --test-name-pattern='回答を先頭' tests/page-routing.test.mjs
      - name: Account settings auth
        run: node --test --test-name-pattern='名前とパスワード' tests/page-routing.test.mjs
      - name: Completion routing
        run: node --test --test-name-pattern='回答完了は独立' tests/page-routing.test.mjs
      - name: Answer action and share
        run: node --test --test-name-pattern='回答導線を常時強調' tests/page-routing.test.mjs
      - name: Quantum navigation
        run: node --test --test-name-pattern='量子観測は通常ナビ' tests/page-routing.test.mjs
      - name: Existing page routing tests
        run: node tests/page-routing.test.mjs
      - name: Existing local bridge tests
        run: node tests/local-bridge.test.js
      - name: Existing app balance check
        run: node tests/balcheck.js app/seiseki.jsx
      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cloudflare syntax check
        working-directory: cloudflare
        run: npm run check
      - name: Cloudflare full regression suite
        working-directory: cloudflare
        run: npm test
      - name: Show diff
        if: always()
        run: git diff --stat && git diff -- core/ui.jsx
      - name: Commit Phase 4 UI
        if: success()
        run: |
          git config user.name "SEISEKI phase4 ui"
          git config user.email "actions@users.noreply.github.com"
          git add core/ui.jsx app/seiseki.jsx local/src/App.jsx
          if git diff --cached --quiet; then
            echo "No Phase 4 UI changes to commit."
            exit 0
          fi
          git commit -m "Use current-response editing for Phase 4 UI"
          git push origin HEAD:feature/response-update-auth-revision-20260825
