name: Reconcile staging account links 20260826

on:
  push:
    branches:
      - feature/response-update-auth-revision-20260825
    paths:
      - cloudflare/scripts/reconcile-staging-account-links-20260826.sql
      - .github/workflows/reconcile-staging-account-links-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-staging-account-link-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preflight staging only
        id: preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_json() {
            npx wrangler d1 execute seiseki-db-staging --remote --command "$1" --json
          }
          query_json "PRAGMA foreign_key_check;" > /tmp/fk.json
          query_json "SELECT COUNT(*) AS responses FROM responses;" > /tmp/responses.json
          query_json "SELECT COUNT(*) AS links FROM account_responses;" > /tmp/links.json
          query_json "SELECT COUNT(*) AS duplicates FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1);" > /tmp/duplicates.json
          node - <<'NODE'
          const fs = require('fs');
          const first = p => {
            const x = JSON.parse(fs.readFileSync(p, 'utf8'));
            return x?.[0]?.results?.[0] || x?.[0]?.result?.[0] || {};
          };
          const fk = JSON.parse(fs.readFileSync('/tmp/fk.json', 'utf8'));
          const responses = Number(first('/tmp/responses.json').responses);
          const links = Number(first('/tmp/links.json').links);
          const duplicates = Number(first('/tmp/duplicates.json').duplicates);
          const fkRows = fk?.[0]?.results || fk?.[0]?.result || [];
          console.log(JSON.stringify({responses, links, duplicates, fkViolations: fkRows.length}));
          if (fkRows.length !== 0) throw new Error('FK violations present; refusing write');
          if (responses !== 49) throw new Error(`Expected 49 staging responses, got ${responses}; refusing write`);
          if (links !== 19) throw new Error(`Expected 19 staging account links, got ${links}; refusing write`);
          if (duplicates !== 5) throw new Error(`Expected 5 duplicate account groups, got ${duplicates}; refusing write`);
          NODE
      - name: Preserve all links and reconcile active ownership
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute seiseki-db-staging --remote --file scripts/reconcile-staging-account-links-20260826.sql
      - name: Verify no historical data loss
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute seiseki-db-staging --remote --command "PRAGMA foreign_key_check;" --json > /tmp/fk-after.json
          npx wrangler d1 execute seiseki-db-staging --remote --command "SELECT (SELECT COUNT(*) FROM responses) AS responses, (SELECT COUNT(*) FROM account_responses) AS active_links, (SELECT COUNT(*) FROM account_responses_legacy_20260826) AS archived_links, (SELECT COUNT(*) FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1)) AS duplicate_groups;" --json > /tmp/after.json
          npx wrangler d1 execute seiseki-db-staging --remote --command "SELECT COUNT(*) AS mismatches FROM account_responses ar JOIN account_responses_legacy_20260826 l ON l.account_id=ar.account_id AND l.response_id=ar.response_id WHERE l.was_current <> 1;" --json > /tmp/current.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = p => {
            const x = JSON.parse(fs.readFileSync(p, 'utf8'));
            return x?.[0]?.results || x?.[0]?.result || [];
          };
          const fk = rows('/tmp/fk-after.json');
          const after = rows('/tmp/after.json')[0] || {};
          const current = rows('/tmp/current.json')[0] || {};
          console.log(JSON.stringify({after, fkViolations: fk.length, currentMarkerMismatches: Number(current.mismatches || 0)}));
          if (fk.length !== 0) throw new Error('FK check failed after reconciliation');
          if (Number(after.responses) !== 49) throw new Error('Response rows changed');
          if (Number(after.archived_links) !== 19) throw new Error('Historical links were not fully preserved');
          if (Number(after.duplicate_groups) !== 0) throw new Error('Duplicate active ownership remains');
          if (Number(after.active_links) !== 10) throw new Error(`Expected 10 active links, got ${after.active_links}`);
          if (Number(current.mismatches || 0) !== 0) throw new Error('Active link does not match archived current marker');
          NODE
