name: Diagnose SEISEKI production Cloudflare access

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-production-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feature/quantum-app-integration
          fetch-depth: 0

      - name: Install Wrangler
        working-directory: cloudflare
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Probe Cloudflare permissions
        id: probe
        working-directory: cloudflare
        shell: bash
        run: |
          set +e
          : > /tmp/diag.txt
          echo '## wrangler whoami' >> /tmp/diag.txt
          npx wrangler whoami >> /tmp/diag.txt 2>&1
          echo "whoami_exit=$?" >> /tmp/diag.txt
          echo >> /tmp/diag.txt
          echo '## d1 list' >> /tmp/diag.txt
          npx wrangler d1 list --json >> /tmp/diag.txt 2>&1
          echo "d1_list_exit=$?" >> /tmp/diag.txt
          echo >> /tmp/diag.txt
          echo '## queues list' >> /tmp/diag.txt
          npx wrangler queues list >> /tmp/diag.txt 2>&1
          echo "queues_list_exit=$?" >> /tmp/diag.txt
          echo >> /tmp/diag.txt
          echo '## deployments list' >> /tmp/diag.txt
          npx wrangler deployments list >> /tmp/diag.txt 2>&1
          echo "deployments_list_exit=$?" >> /tmp/diag.txt
          set -e

      - name: Record diagnostic result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# SEISEKI Cloudflare production diagnostic'
            echo
            echo 'Generated automatically from GitHub Actions.'
            echo
            echo '```text'
            sed -E 's/[A-Za-z0-9_-]{40,}/[redacted]/g' /tmp/diag.txt 2>/dev/null || true
            echo '```'
          } > CLOUDFLARE_PRODUCTION_DIAGNOSTIC.md
          rm -rf cloudflare/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLOUDFLARE_PRODUCTION_DIAGNOSTIC.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare production access diagnostic"
            git push origin HEAD:feature/quantum-app-integration
          fi
