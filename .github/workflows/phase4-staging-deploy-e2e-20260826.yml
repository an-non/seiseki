name: Phase 4 staging migrate deploy and E2E 20260826

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-phase4-staging to migrate and deploy staging only'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: seiseki-phase4-staging-e2e
  cancel-in-progress: false

jobs:
  deploy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SEISEKI_API_BASE: https://seiseki-api-staging.tokyo-odh-129.workers.dev
      VITE_SEISEKI_API_REQUIRED: 'false'
      STAGING_BASE: https://seiseki-api-staging.tokyo-odh-129.workers.dev
    steps:
      - name: Confirm staging-only operation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.confirm }}" = 'deploy-phase4-staging'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install Wrangler and verify staging bindings
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          grep -q '"name": "seiseki-api-staging"' wrangler.jsonc
          grep -q '"database_name": "seiseki-db-staging"' wrangler.jsonc
          grep -q '"database_id": "64468050-a8e5-4a5f-86a7-3dfca661df55"' wrangler.jsonc
          grep -q '"queue": "seiseki-analysis-staging"' wrangler.jsonc
          grep -q '"dead_letter_queue": "seiseki-analysis-staging-dlq"' wrangler.jsonc

      - name: Verify staging database before migration
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env staging --remote \
            --command "SELECT COUNT(*) AS duplicate_groups FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1); PRAGMA foreign_key_check;" --json > /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/preflight.json', 'utf8'));
          const counts = result?.[0]?.results?.[0] || result?.[0]?.result?.[0] || {};
          const fk = result?.[1]?.results || result?.[1]?.result || [];
          if (Number(counts.duplicate_groups) !== 0) throw new Error('staging has duplicate account-response ownership; migration and deploy were not run');
          if (fk.length) throw new Error(`staging has ${fk.length} foreign-key violation(s)`);
          NODE

      - name: Apply pending migrations to staging only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Verify migrated schema and capture E2E baseline
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env staging --remote --command "SELECT (SELECT COUNT(*) FROM responses) AS responses, (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM account_responses) AS active_links, (SELECT COUNT(*) FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1)) AS duplicate_groups; PRAGMA foreign_key_check;" --json > /tmp/e2e-baseline.json
          npx wrangler d1 execute DB --env staging --remote --command "SELECT name FROM pragma_table_info('responses') WHERE name='revision'; SELECT name FROM pragma_table_info('analysis_runs') WHERE name IN ('response_revision','lease_until') ORDER BY name; SELECT name, \"unique\" FROM pragma_index_list('account_responses') WHERE name='account_responses_account_unique'; SELECT name, \"unique\" FROM pragma_index_list('analysis_runs') WHERE name='analysis_runs_response_revision_running_unique'; SELECT name FROM sqlite_master WHERE type='table' AND name='response_access';" --json > /tmp/schema.json
          node - <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/e2e-baseline.json','utf8'));
          const schema = JSON.parse(fs.readFileSync('/tmp/schema.json','utf8'));
          const counts = baseline?.[0]?.results?.[0] || baseline?.[0]?.result?.[0] || {};
          const fk = baseline?.[1]?.results || baseline?.[1]?.result || [];
          const names = schema.flatMap(item => item?.results || item?.result || []).map(item => item.name);
          console.log(JSON.stringify({ counts, fkViolations: fk.length }));
          if (Number(counts.duplicate_groups) !== 0) throw new Error('duplicate active ownership remains');
          if (fk.length) throw new Error('foreign-key violations remain');
          for (const name of ['revision','lease_until','response_revision','account_responses_account_unique','analysis_runs_response_revision_running_unique','response_access']) {
            if (!names.includes(name)) throw new Error(`missing expected schema object: ${name}`);
          }
          NODE

      - name: Verify repo tests before deploy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          git diff --exit-code -- app/seiseki.jsx local/src/App.jsx
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/local-bridge.test.js
          node tests/balcheck.js app/seiseki.jsx
          cd cloudflare
          npm run check
          npm test

      - name: Fresh staging UI build
        working-directory: local
        run: |
          npm ci --no-audit --no-fund
          npm run build:staging

      - name: Ensure staging DLQ exists
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler queues list | grep -Fq 'seiseki-analysis-staging-dlq'; then
            echo 'staging DLQ already exists'
          else
            npx wrangler queues create seiseki-analysis-staging-dlq
          fi

      - name: Deploy Worker and UI to staging only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --strict

      - name: Run live Phase 4 E2E with cleanup
        run: node scripts/staging-phase4-e2e-20260826.mjs

      - name: Verify E2E cleanup restored the staging baseline
        if: always()
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/e2e-baseline.json
          npx wrangler d1 execute DB --env staging --remote --command "SELECT (SELECT COUNT(*) FROM responses) AS responses, (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM account_responses) AS active_links, (SELECT COUNT(*) FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1)) AS duplicate_groups; PRAGMA foreign_key_check;" --json > /tmp/post-e2e.json
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/e2e-baseline.json','utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/post-e2e.json','utf8'));
          const b = before?.[0]?.results?.[0] || before?.[0]?.result?.[0] || {};
          const a = after?.[0]?.results?.[0] || after?.[0]?.result?.[0] || {};
          const fk = after?.[1]?.results || after?.[1]?.result || [];
          for (const key of ['responses','accounts','active_links']) {
            if (Number(a[key]) !== Number(b[key])) throw new Error(`E2E cleanup changed ${key}: ${b[key]} -> ${a[key]}`);
          }
          if (Number(a.duplicate_groups) !== 0) throw new Error('duplicate active ownership appeared during E2E');
          if (fk.length) throw new Error('foreign-key violation after E2E');
          NODE
