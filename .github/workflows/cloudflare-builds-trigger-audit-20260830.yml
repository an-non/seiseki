name: Cloudflare Builds trigger audit 20260830

on:
  push:
    branches:
      - release/production-20260830
    paths:
      - .github/workflows/cloudflare-builds-trigger-audit-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read Worker tags and Builds triggers
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          curl -fsS "$api/workers/scripts" -H "Authorization: Bearer ${CF_API_TOKEN}" > /tmp/scripts.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/scripts.json','utf8'));
          if(!x.success) throw new Error(JSON.stringify(x.errors));
          const rows=Array.isArray(x.result)?x.result:[];
          const wanted=['seiseki-api','seiseki-api-staging'];
          const out={};
          for(const name of wanted){
            const hit=rows.find(r=>r?.id===name || r?.name===name);
            if(!hit) throw new Error(`Worker not found: ${name}`);
            const tag=hit.tag || hit.etag || hit.external_script_id;
            if(!tag) throw new Error(`Worker tag missing for ${name}`);
            out[name]={tag};
          }
          fs.writeFileSync('/tmp/tags.json',JSON.stringify(out));
          NODE

          for worker in seiseki-api seiseki-api-staging; do
            tag=$(node -e "const x=require('/tmp/tags.json');process.stdout.write(x[process.argv[1]].tag)" "$worker")
            curl -fsS "$api/builds/workers/$tag/triggers" -H "Authorization: Bearer ${CF_API_TOKEN}" > "/tmp/${worker}-triggers.json"
          done

          node - <<'NODE'
          const fs=require('fs');
          for(const worker of ['seiseki-api','seiseki-api-staging']){
            const x=JSON.parse(fs.readFileSync(`/tmp/${worker}-triggers.json`,'utf8'));
            if(!x.success) throw new Error(`${worker}: ${JSON.stringify(x.errors)}`);
            const rows=Array.isArray(x.result)?x.result:[];
            console.log(JSON.stringify({worker,triggers:rows.map(t=>({trigger_uuid:t.trigger_uuid,trigger_name:t.trigger_name,deploy_command:t.deploy_command,build_command:t.build_command,root_directory:t.root_directory,branch_includes:t.branch_includes,branch_excludes:t.branch_excludes,path_includes:t.path_includes,path_excludes:t.path_excludes}))},null,2));
          }
          NODE
