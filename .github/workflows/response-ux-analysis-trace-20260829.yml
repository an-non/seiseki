name: Response UX and analysis trace 20260829

on:
  push:
    branches:
      - codex/response-ux-analysis-trace-20260829
    paths:
      - .github/workflows/response-ux-analysis-trace-20260829.yml
      - scripts/apply-response-ux-analysis-trace-20260829.mjs
      - tests/follow-up-ui-contract.test.mjs

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/response-ux-analysis-trace-20260829
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            local/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          npm --prefix local ci --no-audit --no-fund

      - name: Apply UX, trace and ideology changes
        run: |
          set -euo pipefail
          node scripts/apply-response-ux-analysis-trace-20260829.mjs
          node scripts/build-app.mjs

      - name: Normalize trace contract test
        run: |
          cat > tests/response-ux-analysis-trace-contract.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const ui = readFileSync(new URL("../core/ui.jsx", import.meta.url), "utf8");
          const analysis = readFileSync(new URL("../cloudflare/src/analysis.mjs", import.meta.url), "utf8");

          test("response correction routes enter dedicated editors directly", () => {
            assert.ok(ui.includes('surveyEdit: "/survey/edit-initial"'));
            assert.ok(ui.includes('followupEdit: "/survey/follow-up/edit"'));
            assert.ok(ui.includes('goto("followupEdit")'));
            assert.ok(ui.includes("2回目の回答を修正"));
            assert.ok(ui.includes('goto("surveyEdit")'));
            assert.ok(ui.includes('startEditMode={view === "surveyEdit"'));
            assert.ok(ui.includes('editExisting={view === "followupEdit"'));
          });

          test("withdrawal copy distinguishes second-only withdrawal from full response withdrawal", () => {
            assert.ok(ui.includes("初回だけの撤回は行わず、初回を撤回する場合は回答全体を撤回します"));
            assert.ok(ui.includes("回答全体を撤回する"));
          });

          test("analysis trace keeps numeric stages and never stores raw model text", () => {
            assert.ok(analysis.includes("withAnalysisValueTrace"));
            assert.ok(analysis.includes("raw: analysisValueSnapshot(rawValues)"));
            assert.ok(analysis.includes("sanitized: analysisValueSnapshot(analysis)"));
            assert.ok(ui.includes("D1 / API取得値"));
            assert.ok(ui.includes("UI表示値"));
            const traceHelperStart = analysis.indexOf("export function withAnalysisValueTrace");
            const traceHelperEnd = analysis.indexOf("export function sanitizeAiAnalysis", traceHelperStart);
            const traceHelper = analysis.slice(traceHelperStart, traceHelperEnd);
            assert.ok(!traceHelper.includes("output_text"));
            assert.ok(!traceHelper.includes("message.content"));
            assert.ok(!traceHelper.includes("choices"));
          });

          test("ideology map explains both axes and confidence", () => {
            assert.ok(ui.includes("再分配・大きな政府"));
            assert.ok(ui.includes("市場競争・小さな政府"));
            assert.ok(ui.includes("伝統・治安・安全保障重視"));
            assert.ok(ui.includes("市民的自由・権利拡張"));
            assert.ok(ui.includes("推定確信度"));
            assert.ok(ui.includes("点の色は思想分類ではなく"));
          });
          EOF

      - name: Verify generated sources are synchronized
        run: |
          set -euo pipefail
          cmp -s app/seiseki.jsx local/src/App.jsx
          node --check cloudflare/src/analysis.mjs
          node --check tests/response-ux-analysis-trace-contract.test.mjs

      - name: Verify UI contracts
        run: |
          set -euo pipefail
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx

      - name: Verify Cloudflare worker
        run: |
          set -euo pipefail
          npm --prefix cloudflare run check
          npm --prefix cloudflare test

      - name: Verify local bridge and staging build
        run: |
          set -euo pipefail
          node tests/local-bridge.test.js
          npm --prefix local run build:staging

      - name: Guard scope and privacy
        run: |
          set -euo pipefail
          BASE=37599c45a2944998ec62b0ae2d6d314a00788148
          git diff --exit-code "$BASE" -- core/logic.js local/quantum-entanglement-engine.mjs local/vite.config.js || {
            echo "Unexpected quantum/core logic change" >&2
            exit 1
          }
          if grep -R -Fq 'storeLocalProvisionalAnalysis' cloudflare/src; then
            echo "Provisional local analysis must not enter formal D1 path" >&2
            exit 1
          fi
          grep -Fq 'analysisValueSnapshot' cloudflare/src/analysis.mjs
          grep -Fq '本文やAIの生テキストは保存せず' core/ui.jsx
          grep -Fq 'surveyEdit: "/survey/edit-initial"' core/ui.jsx
          grep -Fq 'followupEdit: "/survey/follow-up/edit"' core/ui.jsx
          grep -Fq '回答全体を撤回する' core/ui.jsx
          grep -Fq '推定確信度' core/ui.jsx

      - name: Commit tested implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-response-ux-analysis-trace-20260829.mjs
          rm -f .github/workflows/response-ux-analysis-trace-20260829.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Improve response edit UX and trace analysis values"
          git push origin HEAD:codex/response-ux-analysis-trace-20260829
