name: Production RC2 mobile quantum deploy 20260830

on:
  push:
    branches:
      - release/production-20260830
    paths:
      - .github/workflows/production-deploy-rc2-mobile-quantum-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiseki-production-20260830
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RC1_SHA: e1652c303868b9c20e476abc1888ba7388738b2f
      RC2_SHA: 99b5f88f8aa08df086e1f226b331d47ce6bf08ba
      TESTED_FIX_SHA: ca8b9326a096883247b64358ece4a932f43985fd
      PRODUCTION_URL: https://seiseki-api.tokyo-odh-129.workers.dev
      EXPECTED_DB_ID: 8ad5e023-3588-490c-ba61-3f180f8b2887
      EXPECTED_QUEUE_ID: 4606abc6f57645358bad7444b83e3b1b
      DLQ_NAME: seiseki-analysis-dlq
    steps:
      - name: Checkout exact production RC2
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC2_SHA }}
          fetch-depth: 0

      - name: Prove RC2 is one staging-tested source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC2_SHA"
          git diff --name-only "$RC1_SHA" "$RC2_SHA" > /tmp/changed.txt
          printf '%s\n' local/chunk-network-entanglement-preview.html > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(git rev-parse "$RC2_SHA":local/chunk-network-entanglement-preview.html)" = "$(git rev-parse "$TESTED_FIX_SHA":local/chunk-network-entanglement-preview.html)"
          test "$(git rev-parse "$RC2_SHA":cloudflare/wrangler.jsonc)" = "$(git rev-parse "$RC1_SHA":cloudflare/wrangler.jsonc)"
          test "$(git rev-parse "$RC2_SHA":cloudflare/src/index.mjs)" = "$(git rev-parse "$RC1_SHA":cloudflare/src/index.mjs)"
          echo 'RC2 single-source-delta invariant PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            local/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          npm --prefix local ci --no-audit --no-fund

      - name: Re-run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          git diff --exit-code -- app/seiseki.jsx local/src/App.jsx
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          git show "$TESTED_FIX_SHA":tests/mobile-quantum-touch-zoom-contract.mjs > /tmp/mobile-quantum-contract.mjs
          node /tmp/mobile-quantum-contract.mjs local/chunk-network-entanglement-preview.html

      - name: Read-only production D1 gate
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DB_API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list seiseki-db --remote | tee /tmp/migrations.txt
          if grep -qE '0006_response_access_revision|0007_response_updated_at|0008_questionnaire_seven_structured|0008_response_follow_up_text' /tmp/migrations.txt; then exit 71; fi
          npx wrangler d1 execute seiseki-db --remote --command "SELECT COUNT(*) AS duplicate_groups FROM (SELECT account_id FROM account_responses GROUP BY account_id HAVING COUNT(*) > 1); PRAGMA foreign_key_check;" --json > /tmp/d1.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const rows=i=>x?.[i]?.results||x?.[i]?.result||[];
          if(Number(rows(0)?.[0]?.duplicate_groups??NaN)!==0)throw new Error('duplicate ownership');
          if(rows(1).length)throw new Error('foreign key violations');
          console.log('production D1 integrity PASS');
          NODE

      - name: Read-only Queue and DLQ gate
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler queues list | tee /tmp/queues.txt
          grep -Eq '(^|[[:space:]|])seiseki-analysis([[:space:]|]|$)' /tmp/queues.txt
          grep -Eq '(^|[[:space:]|])seiseki-analysis-dlq([[:space:]|]|$)' /tmp/queues.txt
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${EXPECTED_QUEUE_ID}/consumers" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/consumers.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/consumers.json','utf8'));if(!x.success)throw new Error(JSON.stringify(x.errors));const all=Array.isArray(x.result)?x.result:[];if(all.length!==1)throw new Error('consumer count');const c=all[0],s=c.settings||{};
          if(c.type!=='worker'||c.dead_letter_queue!==process.env.DLQ_NAME)throw new Error('DLQ drift');
          if(Number(s.batch_size)!==3||Number(s.max_retries)!==3||Number(s.max_wait_time_ms)!==2000||Number(s.max_concurrency)!==1||Number(s.retry_delay)!==10)throw new Error('consumer settings drift');
          console.log('production Queue/DLQ PASS');
          NODE

      - name: Build production assets and verify quantum bundle
        shell: bash
        run: |
          set -euo pipefail
          VITE_SEISEKI_API_BASE="$PRODUCTION_URL" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm --prefix local run build
          node /tmp/mobile-quantum-contract.mjs local/dist --built
          node tests/phase5-quantum-compact-contract.mjs local/dist/quantum/chunk-network-entanglement-preview.html
          cd cloudflare
          npx wrangler deploy --env="" --dry-run --outdir /tmp/rc2-dry-run
          test -d /tmp/rc2-dry-run

      - name: Deploy production RC2
        id: deploy_prod
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env="" --strict 2>&1 | tee /tmp/deploy.log
          grep -E 'Current Version ID|Uploaded|Deployed|https://' /tmp/deploy.log || true

      - name: Verify live production health and quantum interaction bundle
        id: live_verify
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "$PRODUCTION_URL/api/health" > /tmp/health.json; then break; fi
            sleep 3
          done
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(h.status!=='ok'||h.database!=='d1')throw new Error(JSON.stringify(h));
          NODE
          curl -fsS "$PRODUCTION_URL/api/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));if((c.questions||[]).filter(q=>q?.type!=='free').length!==7)throw new Error('questionnaire mismatch');
          NODE
          curl -fsS -L "$PRODUCTION_URL/app/quantum" > /tmp/app.html
          grep -qi '<!doctype html>' /tmp/app.html
          curl -fsS -L "$PRODUCTION_URL/quantum/chunk-network-entanglement-preview.html?count=10000&seed=prototype-10000&theme=dark&rev=mobile-touch-zoom-20260830" > /tmp/quantum.html
          grep -qi 'quantum\|chunk-network\|量子' /tmp/quantum.html
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('/tmp/quantum.html','utf8');const refs=[];for(const re of [/<script[^>]+src=["']([^"']+)["']/g,/<link[^>]+href=["']([^"']+)["']/g])for(const m of html.matchAll(re))if(/\.js(?:\?|$)/.test(m[1]))refs.push(m[1]);const u=[...new Set(refs)];if(!u.length)throw new Error('no JS refs');fs.writeFileSync('/tmp/jsrefs.txt',u.join('\n'));
          NODE
          : > /tmp/all-js.txt
          while IFS= read -r src; do
            case "$src" in http*) url="$src" ;; /*) url="$PRODUCTION_URL$src" ;; *) url="$PRODUCTION_URL/quantum/$src" ;; esac
            curl -fsS -L "$url" >> /tmp/all-js.txt
            printf '\n' >> /tmp/all-js.txt
          done < /tmp/jsrefs.txt
          grep -Fq 'pointerdown' /tmp/all-js.txt
          grep -Fq 'pointerup' /tmp/all-js.txt
          grep -Fq 'pointercancel' /tmp/all-js.txt
          grep -Fq '(pointer: coarse)' /tmp/all-js.txt
          grep -Fq '(max-width:700px)' /tmp/all-js.txt
          echo 'live production mobile quantum interaction bundle PASS'

      - name: Verify Queue DLQ remains attached after deploy
        if: ${{ always() && steps.deploy_prod.outcome == 'success' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues/${EXPECTED_QUEUE_ID}/consumers" -H "Authorization: Bearer ${CF_TOKEN}" > /tmp/consumers-after.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/consumers-after.json','utf8'));const c=(Array.isArray(x.result)?x.result:[])[0];if(!x.success||!c||c.dead_letter_queue!==process.env.DLQ_NAME)throw new Error('Queue/DLQ post-deploy verification failed');console.log('post-deploy Queue/DLQ PASS');
          NODE

      - name: Roll back Worker if post-deploy verification fails
        if: ${{ failure() && steps.deploy_prod.outcome == 'success' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler rollback --name seiseki-api --message "Automatic rollback after failed SEISEKI production RC2 mobile quantum verification"
