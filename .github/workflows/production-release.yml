name: Release SEISEKI production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA approved for production
        required: true
        type: string
      confirmation:
        description: Type deploy-production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seiseki-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://seiseki-api.tokyo-odh-129.workers.dev
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable release request
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "deploy-production"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout approved release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify application and Worker contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-app.mjs
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/local-bridge.test.js
          node tests/balcheck.js app/seiseki.jsx
          node tests/quantum-entanglement-engine.test.mjs
          node tests/runtime-deploy-contract.test.mjs
          test -z "$(git status --porcelain)"

      - name: Install Cloudflare tooling and run Worker tests
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Verify fixed production bindings
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'seiseki-api') throw new Error('production Worker name mismatch');
          const db = config.d1_databases?.find(item => item.binding === 'DB');
          if (!db || db.database_name !== 'seiseki-db' || !/^[0-9a-f-]{36}$/i.test(db.database_id)) {
            throw new Error('production D1 binding mismatch');
          }
          if (config.vars?.ALLOWED_ORIGINS !== 'https://seiseki-api.tokyo-odh-129.workers.dev') {
            throw new Error('production origin mismatch');
          }
          if (config.vars?.PASSWORD_ITERATIONS !== '30000') throw new Error('production KDF setting mismatch');
          if (config.queues?.producers?.[0]?.queue !== 'seiseki-analysis') throw new Error('production queue mismatch');
          if (config.queues?.consumers?.[0]?.dead_letter_queue !== 'seiseki-analysis-dlq') {
            throw new Error('production DLQ mismatch');
          }
          if (config.ai?.binding !== 'AI') throw new Error('production AI binding missing');
          NODE
      - name: Verify production infrastructure without changing it
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          npx wrangler queues list > /tmp/queues.txt
          npx wrangler secret list > /tmp/secrets.json
          npx wrangler d1 migrations list seiseki-db --remote > /tmp/migrations.txt
          node - <<'NODE'
          const fs = require('fs');
          const databases = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          if (!databases.some(item => item?.name === 'seiseki-db')) throw new Error('production D1 is missing');
          const queues = fs.readFileSync('/tmp/queues.txt', 'utf8');
          for (const name of ['seiseki-analysis', 'seiseki-analysis-dlq']) {
            if (!queues.includes(name)) throw new Error(`production Queue is missing: ${name}`);
          }
          const secrets = JSON.parse(fs.readFileSync('/tmp/secrets.json', 'utf8'));
          const names = new Set(secrets.map(item => item.name));
          for (const name of [
            'ANALYSIS_CACHE_HMAC_SECRET',
            'SUBMISSION_FINGERPRINT_HMAC_SECRET',
            'RATE_LIMIT_FINGERPRINT_SECRET'
          ]) {
            if (!names.has(name)) throw new Error(`production secret is missing: ${name}`);
          }
          const migrations = fs.readFileSync('/tmp/migrations.txt', 'utf8');
          if (!/No migrations to apply/i.test(migrations)) {
            throw new Error('production D1 has pending migrations; run the separately approved migration workflow first');
          }
          NODE

      - name: Build guarded production assets
        working-directory: local
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:production
          test -s dist/index.html
          test -s dist/seiseki-runtime.json
          test -f dist/model/manifest.json
          test -f dist/quantum/chunk-network-entanglement-preview.html
          test ! -e dist/quantum-v2/quantum-node-relations-v2-preview.html
          npm --prefix ../cloudflare run assets:check:production

      - name: Verify production package after asset build
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --strict --env=""

      - name: Record existing production state before deploy
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list > /tmp/prod-before.txt
          printf '\n### Release candidate\n\n- commit: `%s`\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '\n### Existing production deployment\n\n' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' /tmp/prod-before.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy immutable production candidate
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:production 2>&1 | tee /tmp/prod-deploy.txt
          grep -E 'Current Version ID|Uploaded|https://' /tmp/prod-deploy.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Production read-only smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "$PRODUCTION_URL/api/health" > /tmp/health.json; then break; fi
            sleep 3
          done
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (health.status !== 'ok' || health.database !== 'd1') throw new Error('production health failed');
          NODE
          curl -fsS "$PRODUCTION_URL/api/config" > /tmp/config.json
          curl -fsS "$PRODUCTION_URL/app" > /tmp/app.html
          grep -qi '<!doctype html>' /tmp/app.html
          printf '\n### Production smoke\n\n- `/api/health`: ok\n- `/api/config`: ok\n- `/app`: served\n' >> "$GITHUB_STEP_SUMMARY"
