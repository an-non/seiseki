name: Fix radial tree scale 20260830

on:
  push:
    branches:
      - fix/radial-tree-scale-20260830
    paths:
      - .github/workflows/fix-radial-tree-scale-20260830.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/radial-tree-scale-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            local/package-lock.json
            cloudflare/package-lock.json

      - name: Patch radial tree layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/ui.jsx')
          s=p.read_text()
          old='''  const S = 640, cx = S / 2, cy = S / 2;\n  const R0 = 62, R1 = 128, R2 = 218, R3 = 268;'''
          new='''  const branchLoad = Math.max(rt.ring2.length, rt.ring3.length);\n  const treeScale = Math.max(1, Math.min(1.9, 1 + Math.max(0, branchLoad - 18) * 0.018));\n  const R0 = 62;\n  const R1 = Math.round(128 * treeScale);\n  const R2 = Math.round(218 * treeScale);\n  const R3 = Math.round(268 * treeScale);\n  const S = Math.max(640, R3 * 2 + 84), cx = S / 2, cy = S / 2;'''
          if s.count(old)!=1: raise SystemExit('radial geometry target mismatch')
          s=s.replace(old,new,1)
          old='''  return (\n    <svg viewBox={"0 0 " + S + " " + S} style={{ width: "100%", maxWidth: 640, height: "auto", display: "block", margin: "0 auto" }}>'''
          new='''  return (\n    <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 4 }}>\n      <svg viewBox={"0 0 " + S + " " + S} style={{ width: S, maxWidth: "none", height: "auto", display: "block", margin: "0 auto" }}>'''
          if s.count(old)!=1: raise SystemExit('radial svg opening mismatch')
          s=s.replace(old,new,1)
          marker='''    </svg>\n  );\n}\n\nfunction'''
          repl='''      </svg>\n    </div>\n  );\n}\n\nfunction'''
          start=s.index('function RadialTree')
          pos=s.find(marker,start)
          if pos<0: raise SystemExit('radial close after component not found')
          s=s[:pos]+repl+s[pos+len(marker):]
          p.write_text(s)
          PY
          git diff --check

      - name: Focused contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('core/ui.jsx','utf8');
          for(const x of ['const branchLoad = Math.max(rt.ring2.length, rt.ring3.length)','const treeScale = Math.max(1, Math.min(1.9','const R3 = Math.round(268 * treeScale)','const S = Math.max(640, R3 * 2 + 84)','width: S, maxWidth: "none"']) if(!s.includes(x)) throw new Error(x);
          if(s.includes('const S = 640, cx = S / 2, cy = S / 2;\n  const R0 = 62, R1 = 128, R2 = 218, R3 = 268;')) throw new Error('fixed radial geometry remains');
          console.log('radial tree dynamic layout contract PASS');
          NODE

      - name: Install regenerate and test
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix local ci --no-audit --no-fund
          npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
          node scripts/build-app.mjs
          node tests/test.js
          node tests/page-routing.test.mjs
          node tests/phase5-ui-contract.test.mjs
          node tests/follow-up-ui-contract.test.mjs
          node tests/response-ux-analysis-trace-contract.test.mjs
          node tests/balcheck.js app/seiseki.jsx
          npm --prefix cloudflare run check
          npm --prefix cloudflare test
          node tests/local-bridge.test.js
          VITE_SEISEKI_API_BASE="https://seiseki-api.tokyo-odh-129.workers.dev" VITE_SEISEKI_API_REQUIRED=true VITE_SEISEKI_RUNTIME_MODE=production npm --prefix local run build

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf local/node_modules local/dist cloudflare/node_modules
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' app/seiseki.jsx core/ui.jsx local/src/App.jsx | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/seiseki.jsx core/ui.jsx local/src/App.jsx
          git commit -m 'Scale radial opinion tree with branch density'
          git push origin HEAD:fix/radial-tree-scale-20260830
