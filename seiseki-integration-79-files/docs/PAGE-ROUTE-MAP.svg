<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">声析 ページ分離後の画面遷移図</title>
  <desc id="desc">入口、概要、回答、回答完了、自分の回答、アカウントメニュー、独立した管理画面のURLと遷移関係を示す。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="5" dy="5" stdDeviation="2" flood-color="#1d2b4f" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#263a63"/></marker>
    <marker id="mutedArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#78868e"/></marker>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill:#172039; }
      .title { font-size:26px; font-weight:700; }
      .sub { font-size:15px; fill:#46536a; }
      .group { font-size:17px; font-weight:700; }
      .box-title { font-size:16px; font-weight:700; }
      .route { font-family:Consolas,monospace; font-size:13px; fill:#2d577b; }
      .body { font-size:13px; fill:#37445a; }
      .line { fill:none; stroke:#263a63; stroke-width:2; marker-end:url(#arrow); }
      .dashed { fill:none; stroke:#78868e; stroke-width:2; stroke-dasharray:8 6; marker-end:url(#mutedArrow); }
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#f6f8fb"/>
  <path d="M25 22 H520 V84 L500 108 H25 Z" fill="#fff" stroke="#263a63" stroke-width="3" filter="url(#shadow)"/>
  <text x="48" y="58" class="title">声析 ページ分離後の画面遷移図</text>
  <text x="48" y="84" class="sub">既存UI・保存・解析機能を保ったURL境界</text>

  <rect x="45" y="155" width="1710" height="830" rx="5" fill="#e9f3e8" stroke="#263a63" stroke-width="3"/>
  <text x="70" y="190" class="group">一般利用領域</text>

  <g filter="url(#shadow)">
    <rect x="95" y="245" width="285" height="145" rx="4" fill="#fff" stroke="#263a63" stroke-width="2"/>
    <text x="118" y="278" class="box-title">入口</text>
    <text x="118" y="304" class="route">/</text>
    <text x="118" y="332" class="body">登録 / ログイン</text>
    <text x="118" y="354" class="body">登録せず閲覧</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="225" width="365" height="185" rx="4" fill="#dcecff" stroke="#263a63" stroke-width="2"/>
    <text x="525" y="258" class="box-title">概要</text>
    <text x="525" y="284" class="route">/app</text>
    <text x="525" y="314" class="body">既存ホームと共通ナビ</text>
    <text x="525" y="338" class="body">ダッシュボード</text>
    <text x="525" y="360" class="body">意見ネットワーク・各ビジュアル</text>
    <text x="525" y="382" class="body">意見一覧（すべてページ内切替）</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="225" width="300" height="185" rx="4" fill="#fff2c8" stroke="#263a63" stroke-width="2"/>
    <text x="1015" y="258" class="box-title">回答</text>
    <text x="1015" y="284" class="route">/survey</text>
    <text x="1015" y="314" class="body">未ログインなら登録・ログイン</text>
    <text x="1015" y="338" class="body">同意 → 属性 → 設問</text>
    <text x="1015" y="362" class="body">自由記述 → 端末内解析</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1390" y="225" width="300" height="185" rx="4" fill="#dff3e4" stroke="#263a63" stroke-width="2"/>
    <text x="1415" y="258" class="box-title">回答完了</text>
    <text x="1415" y="284" class="route">/survey/complete</text>
    <text x="1415" y="314" class="body">回答IDと解析結果</text>
    <text x="1415" y="338" class="body">ダッシュボードへ移動</text>
    <text x="1415" y="362" class="body">再読込時は保存回答を復元</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="555" width="350" height="135" rx="4" fill="#fff" stroke="#263a63" stroke-width="2"/>
    <text x="585" y="590" class="box-title">自分の回答</text>
    <text x="585" y="616" class="route">/account/response</text>
    <text x="585" y="644" class="body">確認・追記・撤回</text>
    <text x="585" y="666" class="body">回答IDまたはログイン状態で照会</text>
  </g>

  <path d="M380 318 H500" class="line"/>
  <text x="400" y="302" class="body">認証済み / 匿名</text>
  <path d="M865 300 H990" class="line"/>
  <text x="887" y="284" class="body">回答する</text>
  <path d="M1290 318 H1390" class="line"/>
  <text x="1305" y="302" class="body">保存完了</text>
  <path d="M1510 410 C1510 500 1030 510 865 410" class="line"/>
  <text x="1190" y="493" class="body">統計を見る</text>
  <path d="M690 410 V555" class="line"/>
  <text x="705" y="490" class="body">右上アカウントメニュー</text>
  <path d="M990 375 C930 430 880 475 790 555" class="dashed"/>
  <text x="855" y="470" class="body">回答状態を確認</text>

  <rect x="95" y="760" width="1595" height="165" rx="5" fill="#ffe2df" stroke="#9a3d44" stroke-width="2"/>
  <text x="120" y="795" class="group">管理領域</text>
  <g filter="url(#shadow)">
    <rect x="530" y="805" width="540" height="90" rx="4" fill="#fff" stroke="#9a3d44" stroke-width="2"/>
    <text x="555" y="838" class="box-title">Admin</text>
    <text x="555" y="864" class="route">/admin</text>
    <text x="735" y="838" class="body">一般ナビ・一般画面の導線から除外</text>
    <text x="735" y="864" class="body">本番では別ビルド化または非搭載を検討</text>
  </g>
  <path d="M380 352 C320 620 420 790 530 850" class="dashed"/>
  <text x="205" y="704" class="body">直接URLのみ。一般利用フローとは分離</text>

  <text x="95" y="1018" class="sub">注意: URL分離は認可ではない。D1へのアクセスはWorker APIに限定し、Adminはサーバー側の管理者認証を必須とする。</text>
</svg>
